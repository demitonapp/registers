name: release

# Tag vN on main when a consumer (the Demiton monorepo, today) should vendor a pinned
# set of contracts. The tarballs are built here and attached to the release; they are
# never committed - `contracts/`, `obligations/` and `vocab/` themselves are already
# the source of truth in git.
#
# `registers-obligations-*.tar.gz` carries the FLATTENED obligation library: it is
# built with `scripts/resolve.py --out`, which resolves the abstract bases under
# `obligations/_model/` into the concrete instruments that extend them. A consumer
# therefore never sees a base or an `extends` (SM031 decisions 7 and 8), and
# `vocab/` travels with it because every jurisdiction code and instrument_type in
# the flattened set is checked against that directory. `holidays/` travels with it
# too: an obligation's window in business days means nothing without the state's
# public holidays to count around.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run python scripts/validate.py
      - run: uv run python -m pytest tests/ -q
      - run: |
          rm -rf dist
          mkdir -p dist/obligations
          uv run python scripts/resolve.py --out dist/obligations
          cp -r vocab dist/vocab
          cp -r holidays dist/holidays
          tar -czf "registers-contracts-${TAG}.tar.gz" contracts
          tar -czf "registers-research-${TAG}.tar.gz" research
          tar -czf "registers-history-${TAG}.tar.gz" history
          tar -czf "registers-obligations-${TAG}.tar.gz" -C dist obligations vocab holidays
        env:
          TAG: ${{ github.ref_name }}
      - run: |
          gh release create "$TAG" \
            "registers-contracts-${TAG}.tar.gz" \
            "registers-research-${TAG}.tar.gz" \
            "registers-history-${TAG}.tar.gz" \
            "registers-obligations-${TAG}.tar.gz" \
            --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
