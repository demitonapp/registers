# Holidays Act 1958 (ACT): every whole-day public holiday declared for the whole of AU-ACT.
# Shape: holidays/calendar.schema.json. Dates read from the sources below, not computed.
jurisdiction: AU-ACT
holidays_act:
  title: "Holidays Act 1958 (ACT)"
  url: https://www.legislation.act.gov.au/a/1958-19/
weekend_rule: "ACT Government: when Anzac Day falls on a Saturday an additional public holiday is observed on the Monday; when it falls on a Sunday it is observed on the following Monday and the Sunday is also declared. When Christmas Day or Boxing Day falls on a weekend an additional public holiday is observed on the next weekday. Reconciliation Day is the Monday on or after 27 May."
