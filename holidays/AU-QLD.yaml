  url: https://www.legislation.qld.gov.au/view/html/inforce/current/act-1983-018
weekend_rule: "Queensland Government: the Holidays Act 1983 adds an extra public holiday when Christmas Day, Boxing Day or New Year's Day falls on a weekend. Australia Day is observed the following Monday when 26 January is a Saturday or Sunday. Anzac Day is observed the following Monday when 25 April is a Sunday (not when it is a Saturday)."
