# Shape: holidays/calendar.schema.json. Dates read from the sources below, not computed.
jurisdiction: AU-SA
holidays_act:
  title: "Public Holidays Act 2023 (SA)"
  url: https://www.legislation.sa.gov.au/lz?path=%2FC%2FA%2FPUBLIC%20HOLIDAYS%20ACT%202023
weekend_rule: "SafeWork SA: when 25 December or 1 January falls on a Saturday or Sunday, that day and the following Monday are public holidays. When 26 December (Proclamation Day holiday) falls on a Saturday, that day and the following Monday are public holidays; on a Sunday or Monday, that day and the following Tuesday. When 26 January falls on a Saturday or Sunday, the following Monday is the public holiday instead. 25 April is a public holiday whatever the day, with no substitute or additional day."
