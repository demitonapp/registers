# Statutory Holidays Act 2000 (Tas): every whole-day public holiday declared for the whole of AU-TAS.
# Shape: holidays/calendar.schema.json. Dates read from the sources below, not computed.
jurisdiction: AU-TAS
holidays_act:
  title: "Statutory Holidays Act 2000 (Tas)"
  url: https://www.legislation.tas.gov.au/view/html/inforce/current/act-2000-096
weekend_rule: "WorkSafe Tasmania: when New Year's Day, Australia Day, Christmas Day or Boxing Day fall on a weekend the public holiday is held on the following Monday (or Tuesday in some cases). If 25 December is a Saturday, both the Saturday and the following Monday are holidays; if a Sunday, both the Sunday and the following Tuesday. When Anzac Day falls on a Saturday or Sunday, no substitute or additional holiday is observed."
