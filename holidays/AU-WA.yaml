# Public and Bank Holidays Act 1972 (WA): every whole-day public holiday declared for the whole of AU-WA.
# Shape: holidays/calendar.schema.json. Dates read from the sources below, not computed.
jurisdiction: AU-WA
holidays_act:
  title: "Public and Bank Holidays Act 1972 (WA)"
  url: https://www.legislation.wa.gov.au/legislation/statutes.nsf/main_mrtitle_762_homepage.html
weekend_rule: "WA Government: when New Year's Day, Anzac Day or Christmas Day falls on a Saturday or Sunday the next following Monday is also a public holiday. When 26 January falls on a Saturday or Sunday the first Monday following is the public holiday. When Boxing Day falls on a Saturday the next following Monday is also a public holiday, and when it falls on a Sunday or Monday the next following Tuesday is also a public holiday."
