  caveat: '''GC21 Ed 2, read in ACT v1.8'' - recorded as AU-ACT (the version actually read), not a combined
    NSW/ACT code (jurisdiction is single-valued); the general GC21 rule is the same in NSW. Final payment
    claim due within 13 weeks of completion, converted to 91 days (no ''weeks'' unit) - late is barred.
    Also: completion undertaking (security) returned 14 days after completion; principal''s payment schedule
    within 10 business days - both folded in here rather than split into further rows.'
