    access_date: '2026-10-09'
- overrides: whs.swms_copy_to_principal
  key: whs.swms_copy_to_principal.au-act
  clause: r 301
  citation:
    url: https://www.legislation.act.gov.au/sl/2011-36/current/pdf/2011-36.pdf
    clause: r 301
    access_date: '2026-10-09'
  caveat: Before the work starts, with no day count, so no window is recorded. Applies only to work on a
    construction project, which r 292 defines as construction work costing $250,000 or more, or any
    construction work that demolishes or refurbishes a structure containing loose-fill asbestos
    insulation, whatever it costs. The principal contractor's matching duty to obtain the copy is r
    312, its own row. The compliance_documents register can hold a statement but not whether or when
    a copy went to the principal contractor, so this is recorded not_collected.
