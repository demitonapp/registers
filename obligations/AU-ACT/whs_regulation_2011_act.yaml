    clause: r 299(1)
    access_date: '2026-10-09'
  caveat: 'Before the work starts, with no day count, so no window is recorded. High risk construction work is
    the 19 kinds of construction work r 291 lists: the model''s 18 (among them a risk of a person
    falling more than 2m, a shaft or trench deeper than 1.5m, a tunnel, work on or next to a road or
    railway, including light rail, in use by traffic, and an area where powered mobile plant moves)
    plus processing crystalline silica material with a power tool or another mechanical method (r
    291(1)(s)). Provision 299(2) and (3) set what the statement must contain; a statement another person
    already prepared satisfies the duty. The compliance_documents register can hold a statement (its
    document_type names the class), but not which high risk construction work it covers or when that
    work started, so this is recorded not_collected.'
- overrides: whs.swms_comply
  key: whs.swms_comply.au-act
  clause: r 300(1)-(2)
