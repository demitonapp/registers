  caveat: 'Nationally harmonised excavation-work clause (model WHS Regulations Part 6.3 Division 3): the
    SM026 seed cited only the ACT''s copy for a bare ''AU'' row, which is wrong for a site outside the
    ACT (each state enacts its own instrument). This row was independently verified against this state''s
    own current register 2026-09-27 (SM030 O2), not carried over. NT, TAS and WA almost certainly carry
    the same duty but could not be pinned to a clean, current, official URL within this session''s scope
    - see library-transcription.md Corrections. Victoria is correctly excluded: it runs its own OHS Act/Regulations,
    never harmonised.'
