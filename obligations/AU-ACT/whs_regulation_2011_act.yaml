  citation:
    url: https://www.legislation.act.gov.au/sl/2011-36/current/pdf/2011-36.pdf
    clause: r 312
    access_date: '2026-10-09'
  caveat: Before the work starts, with no day count, so no window is recorded. Binds the principal contractor
    for a construction project, which r 292 defines as construction work costing $250,000 or more,
    or any construction work that demolishes or refurbishes a structure containing loose-fill
    asbestos insulation, whatever it costs. The matching duty on the business doing the work is r
    301, its own row. The compliance_documents register can hold a statement but not whether the
    principal contractor held it before the work started, so this is recorded not_collected.
