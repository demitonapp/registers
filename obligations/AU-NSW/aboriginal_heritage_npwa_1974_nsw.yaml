  citation:
    url: https://legislation.nsw.gov.au/view/whole/html/inforce/current/act-1974-080
    clause: s 89A
    access_date: '2026-09-30'
  caveat: 'Section 89A requires a person who is aware of the location of an Aboriginal object that is Crown property, or that is real property, to notify the Secretary in the prescribed manner within a reasonable time after first becoming aware, unless the person believes on reasonable grounds that the Secretary is already aware: 100 penalty units for an individual. "Within a reasonable time" is not a fixed period, so the base''s 24-hour window is cleared rather than inherited.'
