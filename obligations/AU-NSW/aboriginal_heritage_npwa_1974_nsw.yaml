# SM031 M6: the second New South Wales approvals instrument. Read from the
# Internet Archive's copy of the government's whole-Act page (archived
# 13 December 2025), because legislation.nsw.gov.au returns HTTP 403 here. The
# shared shape's separate plan-conditions duty is not adopted: the National Parks
# and Wildlife Act states the harm offence and the notification duty, and a
# cultural heritage management plan is not the instrument it uses - an Aboriginal
# Heritage Impact Permit under s 90 is - so there is no plan-conditions clause to
# cite from this Act.
