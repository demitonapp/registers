    access_date: '2026-09-30'
  caveat: 'Section 86(1) prohibits harming or desecrating an object the person knows is an Aboriginal object: 2,500 penalty units or 1 year imprisonment (5,000 units or 2 years in circumstances of aggravation) for an individual, and 10,000 units for a corporation. Section 86(2) prohibits harming an Aboriginal object the person does not know is one: 500 units (1,000 in aggravation) for an individual and 2,000 for a corporation. The defences, and the Aboriginal Heritage Impact Permit route, are in ss 87 and 90.'
