  clause: s 34-37, 39
  caveat: Liability falls on the person granted the development consent, construction certificate or complying
    development certificate, or else the person for whom the building is erected (s 37) - typically the
    principal or developer, not the contractor, so this is framed as a check rather than the contractor's
    own payment duty. Maximum penalty 20 penalty units for non-payment (s 39). The rate is capped at 0.6%
    in the Act itself (s 35); the current rate (0.25%) and threshold ($250,000, effective 1 January 2023)
    are the Long Service Corporation's own published figures, not read in the Regulation.
