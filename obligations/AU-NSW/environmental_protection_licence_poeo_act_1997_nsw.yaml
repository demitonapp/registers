  grade: primary_read
  window: null
  citation:
    url: https://legislation.nsw.gov.au/view/whole/html/inforce/current/act-1997-156
    clause: s 148(2), (3)
    access_date: '2026-09-30'
  caveat: 'Section 148(2) requires the person carrying on the activity to notify each relevant authority, immediately after becoming aware, of a pollution incident that causes or threatens material harm to the environment, and s 148(3) requires an employee to notify the employer. "Immediately" carries no number, so the base''s 24-hour window is cleared rather than inherited. Contravening Part 5.7 is an offence under s 152: $4,000,000 for a corporation and $1,000,000 for an individual, plus daily penalties.'
