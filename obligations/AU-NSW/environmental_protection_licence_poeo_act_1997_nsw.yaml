  caveat: 'Section 64(1) makes each holder of the licence guilty of an offence if any condition of the licence is contravened: for a corporation $2,000,000 and a further $240,000 for each day the offence continues; for an individual $500,000 and $120,000 per day. Section 64(2) provides a defence where the contravention was caused by another person and the holder took reasonable precautions. The conditions themselves are imposed under s 63.'
- overrides: approvals.environmental_authority_incident_notice
