  clause: cl 7.2.3, 7.2.4, Table R44.7
  evidence:
    kind: not_collected
    register: inspection_test_result
  threshold:
    direction: min
    unit: percent
    set_by: library
  caveat: The minimum varies by row of Table R44.7, from 90.0% for earth mounds to 102.0% in the Selected
    Material Zone, so no single value is stated here. The characteristic value is computed per TfNSW
    Specification Q. Where conformity is not achieved the lot is reworked or re-checked (cl 7.2.4). Recorded
    as not_collected because Demiton holds the test results but does not yet measure a lot against this
    minimum.
