  duty: Compact each earthworks lot so its characteristic relative compaction is not below Table R44.7
  consequence: breach
  protection_type: threshold
  disease: rework
  severity: 3
  grade: primary_read
  citation:
    url: https://standards.transport.nsw.gov.au/_entity/annotation/bf827ada-5615-ee11-9cbd-002248e414c7
