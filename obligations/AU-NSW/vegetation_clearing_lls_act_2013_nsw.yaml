# SM031 M6: the fourth New South Wales approvals instrument. The clearing regime in
# NSW is the Local Land Services Act 2013, Part 5A, not the Biodiversity
# Conservation Act 2016: the offence for clearing native vegetation in a regulated
# rural area, and the Panel approval route, are both in this Act. Read 2026-09-30
# from the Internet Archive's copy of the NSW legislation XML export, because
# legislation.nsw.gov.au returns HTTP 403 to this environment. The shared shape's
# conditions and records duties are not adopted: this Act conditions the offence on
# authorisation under a code or an approval rather than stating a condition-
# compliance duty, and the notice at s 60X is a notice to Local Land Services, not
# a record the contractor must keep.
