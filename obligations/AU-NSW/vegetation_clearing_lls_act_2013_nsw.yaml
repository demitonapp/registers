  caveat: 'Section 60N makes clearing native vegetation in a regulated rural area an offence unless the landholder establishes a defence: that the clearing is an allowable activity under Division 4 and Schedule 5A, is authorised by a land management (native vegetation) code under Division 5, is authorised by an approval of the Panel under Division 6, is authorised under s 60O, or is a forestry operation authorised under Part 5B. Penalties run to $5 million for a corporation and $1 million for an individual where the offence was intentional and caused or was likely to cause significant harm, and $2 million or $500,000 otherwise. Section 60ZF is the Panel approval route, available only on category 2-regulated land for a purpose the application specifies.'
