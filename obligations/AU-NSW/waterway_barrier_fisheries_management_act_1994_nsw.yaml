    clause: s 201(1)
    access_date: '2026-09-30'
  caveat: 'Section 201(1) prohibits carrying out dredging work or reclamation work except under the authority of a permit issued by the Minister: 2,000 penalty units for a corporation and 1,000 otherwise. Section 201(2) excludes work authorised under the Crown Land Management Act 2016, work carried out or authorised by a relevant public authority including a local government authority, and work the regulations exclude.'
- overrides: approvals.waterway_barrier_fish_passage
  key: approvals.waterway_barrier_fish_passage.au-nsw
  clause: ss 218-219
  grade: primary_read
  citation:
    url: https://legislation.nsw.gov.au/view/whole/html/inforce/current/act-1994-038
    clause: ss 218-219
    access_date: '2026-09-30'
  caveat: 'Section 219(1) makes it an offence to construct or alter a dam, floodgate, causeway or weir, or otherwise create an obstruction, so that fish will or could be blocked or left stranded or the free passage of fish obstructed: 2,000 penalty units for a corporation and 1,000 otherwise, and the court may order the obstruction removed. Section 218 lets the Minister order a person who constructs, alters or modifies a dam, weir or reservoir on a waterway to build a fishway or fish by-pass within a stated period, and s 218(5) requires a public authority to notify the Minister of a proposal and to include a fishway if the Minister asks.'
