# SM031 M6: the third New South Wales approvals instrument. The Fisheries
# Management Act 1994 (NSW) regulates in-water works through a ministerial permit
# (s 201) and protects fish passage directly (ss 218-219). Read 2026-09-30 from the
# Internet Archive's copy of the NSW legislation XML export, because
# legislation.nsw.gov.au returns HTTP 403 to this environment. The shared shape's
# separate conditions duty is not adopted: this Act creates the permit and the
# fish-passage offence, and the permit's general conditions are enforced
# elsewhere, so there is no condition-compliance clause here to cite.
