  clause: s 32-35, 40
  caveat: The $200,000 threshold (s 32) and the tiered rate structure above a $5 billion project cost
    (s 33) are both stated in the Act itself, not sourced from a regulator's site - unlike the figures
    widely reported (a $1,000,000 threshold and a $1 billion tier), which this pass found to be wrong
    when read against the Act's own text. Liability (s 34) falls on the single contractor only where an
    interstate government entity commissions the work; otherwise it is the person for whom the work is
    done, which may be the principal - framed as a check for that reason. Failure to notify before work
    starts (s 40) is a strict-liability offence, 100 penalty units for a natural person, 500 for a body
    corporate; failure to pay (s 35) is a strict-liability offence, 100 penalty units.
