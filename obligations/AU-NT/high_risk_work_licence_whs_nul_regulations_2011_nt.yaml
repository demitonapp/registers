# The high risk work licence duties of the same Regulations, their own instrument
# because a concrete extends one base (the Qld and NSW pattern).
id: high_risk_work_licence_whs_nul_regulations_2011_nt
extends: model_competency
title: Work Health and Safety (National Uniform Legislation) Regulations 2011 (NT), high risk work licences
  (rr 81 to 85)
publisher: AU-NT Government
jurisdictions:
- AU-NT
