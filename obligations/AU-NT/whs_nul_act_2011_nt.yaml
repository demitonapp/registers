id: whs_nul_act_2011_nt
source: law
instrument_type: act
title: Work Health and Safety (National Uniform Legislation) Act 2011 (NT)
publisher: Northern Territory Legislative Assembly
jurisdictions:
- AU-NT
citation:
  url: https://legislation.nt.gov.au/api/sitecore/Act/PDF?id=12282
  access_date: '2026-09-28'
  version: Reprint REPW025, as in force at 1 February 2020 (listed as current)
obligations:
- key: whs.incident_notice.au-nt
  duty: Notify the regulator immediately after becoming aware of a notifiable incident
  consequence: offence
  protection_type: watch
  disease: non_compliance
  severity: 3
  grade: primary_read
  citation:
    url: https://legislation.nt.gov.au/api/sitecore/Act/PDF?id=12282
    clause: s 38(1)-(3)
    access_date: '2026-09-28'
  evidence:
    kind: not_collected
    register: safety_incident
  clause: s 38(1)-(3)
  caveat: '''Immediately'', by the fastest possible means - no number, so no window is recorded. Maximum
    penalty $50,000 (body corporate, strict liability). The incident site must also be left undisturbed
    until an inspector arrives or directs otherwise (s 39), not recorded as its own row. The safety_incident
    register holds each incident and its worst outcome, but not whether or when the regulator was told,
    so this is recorded not_collected.'
- key: whs.incident_written_notice.au-nt
  duty: Give written notice of a notifiable incident within 48 hours when the regulator requires it
  consequence: offence
  protection_type: watch
  disease: non_compliance
  severity: 3
  grade: primary_read
  citation:
    url: https://legislation.nt.gov.au/api/sitecore/Act/PDF?id=12282
    clause: s 38(4)
    access_date: '2026-09-28'
  evidence:
    kind: not_collected
    register: safety_incident
  clause: s 38(4)
  window:
    value: 48
    unit: hours
  caveat: 'Runs from the regulator''s requirement, not from the incident. It carries no penalty of its
    own: a failure is a failure of s 38(1)''s duty. The safety_incident register holds each incident and
    its worst outcome, but not whether or when the regulator was told, so this is recorded not_collected.'
- key: whs.incident_record.au-nt
  duty: Keep a record of each notifiable incident for at least 5 years from the day notice is given
  consequence: offence
  protection_type: check
  disease: non_compliance
  severity: 3
  grade: primary_read
  citation:
    url: https://legislation.nt.gov.au/api/sitecore/Act/PDF?id=12282
    clause: s 38(7)
    access_date: '2026-09-28'
  evidence:
    kind: not_collected
    register: safety_incident
  clause: s 38(7)
  window:
    value: 60
    unit: months
  caveat: 5 years converted to 60 months. The safety_incident register holds each incident and its worst
    outcome, but not whether or when the regulator was told, so this is recorded not_collected.
