# Read 2026-10-21 from the official reprint as in force at 17 July 2026. The NT never re-made
# its 2011 Regulations (SM061 decision 2). It differs from the model on r 292 ($1,000,000 from
# 28 May 2026) and r 291 (a 3 m fall height for residential work from 17 July 2026).
