    clause: r 312
    access_date: '2026-10-21'
  caveat: Before the work starts, with no day count, so no window is recorded. Binds the principal contractor
    for a construction project, which r 292 defines as construction work costing $1,000,000 or more from
    28 May 2026 (the model sets $250,000). The matching duty on the business doing the work is r 301,
    its own row. The compliance_documents register can hold a statement but not whether the principal
    contractor held it before the work started, so this is recorded not_collected.
