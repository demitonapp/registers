  key: latent_conditions.utility_check.au-nt
  citation:
    url: https://legislation.nt.gov.au/Legislation/WORK-HEALTH-AND-SAFETY-NATIONAL-UNIFORM-LEGISLATION-REGULATIONS-2011
    clause: r 304(2), (6)
    access_date: '2026-10-21'
  caveat: Nationally harmonised excavation-work clause (model WHS Regulations Part 6.3 Division 3). Provision
    304(6) keeps the underground essential services information for at least 2 years after a notifiable
    incident in connection with the excavation work, and otherwise until the excavation work is completed;
    the 24 months here is the incident case. Read against this state's own current Regulations 2026-10-21
    (SM061 W1), not carried over from another state.
- overrides: whs.swms_prepare
  key: whs.swms_prepare.au-nt
  citation:
    url: https://legislation.nt.gov.au/Legislation/WORK-HEALTH-AND-SAFETY-NATIONAL-UNIFORM-LEGISLATION-REGULATIONS-2011
    clause: r 299(1)
    access_date: '2026-10-21'
  caveat: 'Before the work starts, with no day count, so no window is recorded. High risk construction
    work is the 19 kinds of construction work r 291 lists, among them a risk of a person falling more
    than 2m on work that is not residential construction work, a risk of a person falling more than 3m
    on residential construction work, a shaft or trench deeper than 1.5m, a tunnel, work on or next to
    a road or railway in use by traffic, and an area where powered mobile plant moves. The Northern Territory
    split the model''s fall height on 17 July 2026: r 291(2) defines residential construction work as
    work on a Class 1 building, or a Class 10 building attached or adjacent to one. Provision 299(2) and
    (3) set what the statement must contain; a statement another person already prepared satisfies the
    duty. The compliance_documents register can hold a statement (its document_type names the class),
    but not which high risk construction work it covers or when that work started, so this is recorded
    not_collected.'
- overrides: whs.swms_comply
  key: whs.swms_comply.au-nt
  citation:
    url: https://legislation.nt.gov.au/Legislation/WORK-HEALTH-AND-SAFETY-NATIONAL-UNIFORM-LEGISLATION-REGULATIONS-2011
    clause: r 300(1)-(2)
    access_date: '2026-10-21'
- overrides: whs.swms_copy_to_principal
  key: whs.swms_copy_to_principal.au-nt
  citation:
    url: https://legislation.nt.gov.au/Legislation/WORK-HEALTH-AND-SAFETY-NATIONAL-UNIFORM-LEGISLATION-REGULATIONS-2011
    clause: r 301
    access_date: '2026-10-21'
  caveat: Before the work starts, with no day count, so no window is recorded. Applies only to work on
    a construction project, which r 292 defines as construction work costing $1,000,000 or more from 28
    May 2026 (the model sets $250,000). The principal contractor's matching duty to obtain the copy is
    r 312, its own row. The compliance_documents register can hold a statement but not whether or when
    a copy went to the principal contractor, so this is recorded not_collected.
