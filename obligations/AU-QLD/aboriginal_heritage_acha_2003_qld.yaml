  caveat: 'Section 23 is the cultural heritage duty of care: take all reasonable and practicable measures to ensure the activity does not harm Aboriginal cultural heritage. Maximum penalty 1,000 penalty units for an individual and 10,000 for a corporation. Section 24 makes it an offence to harm Aboriginal cultural heritage the person knows, or ought reasonably to know, is Aboriginal cultural heritage, and s 24(2) exempts harm done under an authority under the Act or under an approved cultural heritage management plan, which is also where the plan''s conditions are enforced. NOT adopted from the shape: the 24-hour find-reporting duty (this Act states none) and the separate plan-conditions duty (s 24(2)(b) is the exemption the harm row already cites).'
