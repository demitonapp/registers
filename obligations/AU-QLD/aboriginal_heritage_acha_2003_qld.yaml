# SM031 M6: the fourth approvals concrete. The Aboriginal Cultural Heritage Act
# 2003 (Qld) states the duty of care and the harm offence, and exempts harm done
# under an approved cultural heritage management plan. It states no duty to
# report a find, so that row of the shared shape is not adopted - the find is
# reported under the plan's own conditions, or under another instrument, and
# there is no clause here to cite for it.
