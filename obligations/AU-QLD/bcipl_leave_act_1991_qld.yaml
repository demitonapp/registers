  clause: s 66, 67, 74, 75, 77
  caveat: 'Liability falls on the person granted the permit or the person for whom the work is done (s
    74), which may be the principal rather than the contractor, so this is framed as a check rather than
    the contractor''s own payment duty. Section 77 requires the permit authority to sight proof of payment
    before the permit issues. The current rate (0.35%) and the project-value threshold ($150,000) are
    QLeave''s own published figures, not read in the Act or its Regulation - the Act itself sets the mechanism
    (s 66-68) and leaves the rate to regulation (s 72). The QLD scheme was NOT replaced by a 2020 Act,
    contrary to some secondary reporting: the 1991 Act, current as at 1 February 2024, is still in force.'
