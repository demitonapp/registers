# SM031 M6: the first concrete of the `approvals` source. It extends the shared
# shape and adopts the two duties the Environmental Protection Act 1994 (Qld)
# states for an environmental authority holder: the compliance offence (s 430)
# and the regulator notification (s 320DA). The base's records duty is not
# adopted - the EP Act imposes no general record-keeping duty on an authority
# holder (the only record provision, s 440ZY, is about fuel), so the monitoring
# records come from each authority's own conditions and there is no clause to
# cite. `publisher` is inherited from the base: the department administers the
# authority; the Act is only its citation.
id: environmental_authority_ep_act_1994_qld
