- key: closeout.retention_cap.au-qld
  duty: Hold no more retention than the statutory cap
  consequence: barred
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 1
  grade: primary_read
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1991-098
    clause: ss 67K-67N
    access_date: '2026-09-16'
  evidence:
    kind: register
    register: retention_position
    system_type: finance
  research_row: C3
  clause: ss 67K-67N
  caveat: 'Caps: 5% before practical completion, 2.5% after, 10% per payment - a standing cap, no time
    window. ''Excess void'' mapped to barred, the closest enum member (judgment call: nothing in the enum
    literally means ''void'').'
