  clause: cl 5.5.2, Table 15.3(b)
  evidence:
    kind: not_collected
    register: inspection_test_result
  threshold:
    direction: min
    unit: percent
    set_by: library
  caveat: The minimum varies by row of Table 15.3(b), for example 97% for earth fill in the top 300 mm below
    subgrade level and 95% for Class A1, A2 or B fill deeper than 300 mm, so no single value is stated here.
    The number compared is the lot's characteristic value under TMR Test Method Q020, not one test result.
    A lot that fails is subject to rework (MRTS50 cl 10.1.2). Recorded as not_collected because Demiton
    holds the test results but does not yet measure a lot against this minimum.
