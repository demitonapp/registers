# SM031 M6: the third approvals concrete. In Queensland the prohibition on
# clearing native vegetation without a permit, and the offence for breaching the
# approval's conditions, are in the Planning Act 2016; the Vegetation Management
# Act 1999 supplies the assessment framework and the accepted-development codes
# (s 19Q), and states no clearing offence of its own. The instrument here is
# therefore the Planning Act, which is where the duties a contractor must meet
# actually live, and the Vegetation Management Act is named in the caveat.
