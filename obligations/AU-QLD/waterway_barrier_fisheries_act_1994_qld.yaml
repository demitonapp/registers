# SM031 M6: the second approvals concrete. The Fisheries Act 1994 (Qld) governs
# waterway barrier works; since the Planning Act 2016 moved the approval itself
# into the planning system, the Fisheries Act's own operative provisions are the
# two penalty sections read here. The shared shape's general "comply with the
# conditions" duty is not adopted as a separate row, because s 76U reaches only
# the fish-way conditions, and every other condition is enforced by the Planning
# Act 2016 s 164.
id: waterway_barrier_fisheries_act_1994_qld
extends: model_waterway_barrier
