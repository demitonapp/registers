  caveat: '''Immediately'', by the fastest possible means - no number, so no window is recorded. Maximum
    penalty 100 penalty units. The incident site must also be left undisturbed until an inspector arrives
    or directs otherwise (s 39), not recorded as its own row. The safety_incident register holds each
    incident and its worst outcome, but not whether or when the regulator was told, so this is recorded
    not_collected.'
