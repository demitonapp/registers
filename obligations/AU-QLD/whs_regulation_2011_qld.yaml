  caveat: 'Before the work starts, with no day count, so no window is recorded. High risk construction work is
    the 18 kinds of construction work r 291 lists, among them a risk of a person falling more than
    2m, a shaft or trench deeper than 1.5m, a tunnel, work on or next to a road or railway in use by
    traffic, and an area where powered mobile plant moves. Provision 299(2) to (4) set what the statement
    must contain; a statement another person already prepared satisfies the duty. Queensland adds r
    299(4): where the work risks a fall of more than 2m and the only controls are administrative
    controls or personal protective equipment, the statement must describe every control measure
    considered. The compliance_documents register can hold a statement (its document_type names the
    class), but not which high risk construction work it covers or when that work started, so this
    is recorded not_collected.'
