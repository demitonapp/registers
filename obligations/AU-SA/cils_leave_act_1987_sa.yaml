  caveat: Read via the Wayback Machine after legislation.sa.gov.au blocked direct access; the version
    read is the site's current consolidated Act. The $5,000 maximum penalty under s 27 is for a false
    return, not for late payment - s 29 separately imposes interest plus a fine for late payment, the
    amount not confirmed. The rate (2% per the authority's site) and the registration test (a minimum
    of days/hours worked per month) are both set by regulation, not stated in the Act.
