  caveat: Before the work starts, with no day count, so no window is recorded. Applies only to work on a
    construction project, which r 292 defines as construction work costing $450,000 or more (the
    model sets $250,000). The principal contractor's matching duty to obtain the copy is r 312, its
    own row. The compliance_documents register can hold a statement but not whether or when a copy
    went to the principal contractor, so this is recorded not_collected.
