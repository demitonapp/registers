  clause: s 5, 6, 8
  caveat: 'Tasmania DOES have a portable long service scheme (TasBuild), contrary to an earlier working
    assumption that it did not. Its levy (s 7) is not a standalone rate or threshold in this Act: TasBuild''s
    administering company may impose it only in substitution for direct employer payments, and only on
    a person already liable under the Building and Construction Industry Training Fund Act 1990 s 25 -
    a separate levy this row does not cover, and whether TasBuild has ever actually exercised the s 7
    power was not established. Employer and worker registration is 100 penalty units each (s 5, s 6);
    records and returns carry 10 penalty units (s 8).'
