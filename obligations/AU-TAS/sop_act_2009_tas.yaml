id: sop_act_2009_tas
source: law
instrument_type: act
title: Building and Construction Industry Security of Payment Act 2009 (Tas)
publisher: Parliament of Tasmania
jurisdictions:
- AU-TAS
citation:
  url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
  access_date: '2026-09-28'
  version: In force, as amended to No 7 of 2025 (1 July 2025)
obligations:
- key: payment.claim_content.au-tas
  duty: 'Make every claim a valid payment claim: identify the work in enough detail to assess it, state
    the amount and state it is made under the Act'
  consequence: barred
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 1
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 17(2)
    access_date: '2026-09-28'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  clause: s 17(2)
  caveat: A claim missing this content is not valid under the Act; mapped to barred like the other SOP
    Acts' claim_content rows. The Act itself states no consequence - that comes from case law, not read
    here.
- key: payment.claim_cadence.au-tas
  duty: Make one progress claim per reference date (the last day of each month if the contract is silent)
  consequence: guidance
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 4, 17(4)
    access_date: '2026-09-28'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  clause: s 4, 17(4)
  window:
    value: 1
    unit: months
  caveat: One claim per reference date; a claim must also be served within the later of the contract period
    or 12 months after the work was last carried out (s 17(6)).
- key: payment.schedule_due.au-tas
  duty: Receive a payment schedule within 10 business days of each claim, or the full amount becomes payable
  consequence: liable_full_amount
  protection_type: watch
  disease: disputes
  approval_class: payments
  trigger: claim_lodged
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 19(2), (3)(b)
    access_date: '2026-09-28'
  evidence:
    kind: not_collected
    register: payment_schedule
  clause: s 19(2), (3)(b)
  window:
    value: 10
    unit: business_days
  caveat: The earlier of the contract's time or 10 business days. A residential owner who is not a building
    practitioner has 20 business days (s 19(3)(a)).
- key: payment.due_date.au-tas
  duty: Be paid within 10 business days of the claim where the contract sets no date
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 15(2)
    access_date: '2026-09-28'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  clause: s 15(2)
  window:
    value: 10
    unit: business_days
  caveat: A default only, not a cap (20 business days for a residential owner). No head contract / subcontract
    distinction.
- key: payment.notice_of_intention.au-tas
  duty: Give notice of intention to apply for adjudication within 20 business days of the due date
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 21(4)(a), (b)
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 21(4)(a), (b)
  window:
    value: 20
    unit: business_days
  caveat: Applies where no schedule was served; the respondent then has 5 business days to serve a schedule.
- key: payment.adjudication_application.au-tas
  duty: Apply for adjudication within 10 business days of a schedule for less than the claim
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 21(3)(a)
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 21(3)(a)
  window:
    value: 10
    unit: business_days
  caveat: 'Other cases: 20 business days after the due date where a scheduled amount is unpaid (s 21(3)(b));
    10 business days after the 5-day period where no schedule was served (s 21(4)(c)). Mapped to guidance
    like every other SOP Act''s adjudication window in this library; an application out of time is not
    a valid application.'
- key: payment.adjudication_response.au-tas
  duty: Respond to an adjudication application within 10 business days
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-2009-086
    clause: s 23(1), (2), (6)
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 23(1), (2), (6)
  window:
    value: 10
    unit: business_days
  caveat: Later of 10 business days after receiving the application or 5 after the adjudicator accepts
    it; only if a schedule was served.
