    access_date: '2026-09-16'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  research_row: P7
  clause: s 18(2)
  window:
    value: 10
    unit: business_days
  caveat: A further 5 business days after this notice before the next step (suspension / suing) is available.
