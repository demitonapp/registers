    kind: register
    register: progress_claim
    system_type: finance
  research_row: P1
  clause: s 14A, 14D
  window:
    value: 1
    unit: months
  caveat: Monthly claim cadence; no consequence stated for the cadence itself in the source table - validity
    conditions are P2.
- key: payment.claim_content.au-vic
  duty: 'Make every claim a valid payment claim: identify the work and state the amount'
  consequence: barred
  protection_type: check
  disease: disputes
  severity: 1
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 14(2)
    access_date: '2026-09-16'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  research_row: P2
  clause: s 14(2)
  caveat: A claim missing this content is not valid under the Act; mapped to barred.
- key: payment.due_date.au-vic
  duty: Be paid within 10 business days of a payment schedule (or of the claim if none is given)
  consequence: guidance
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 12
    access_date: '2026-09-16'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  research_row: P6
  clause: s 12
  window:
    value: 10
    unit: business_days
  caveat: 'No consequence stated for the due-date rule itself in the source table (non-payment consequences
    are P7); mapped to guidance. VIC: beyond 20 BD has no effect.'
- key: payment.notice_of_intention.au-vic
  duty: Give notice of intention to apply for adjudication within 10 business days
  consequence: guidance
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
