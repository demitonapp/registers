- key: payment.claim_cadence.au-vic
  duty: Make a progress claim on the cadence the contract allows
  consequence: guidance
  protection_type: check
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 14A, 14D
    access_date: '2026-09-16'
