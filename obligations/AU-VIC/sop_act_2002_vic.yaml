id: sop_act_2002_vic
source: law
instrument_type: act
title: Building and Construction Industry Security of Payment Act 2002 (Vic)
publisher: Victorian Parliament
jurisdictions:
- AU-VIC
citation:
  url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
  access_date: '2026-09-28'
  version: Authorised Version 015 as at 24 Jun 2026
obligations:
- key: closeout.security_recourse_notice.au-vic
  duty: Have no recourse to a performance security until 5 business days after written notice of intention
  consequence: barred
  protection_type: watch
  disease: forfeited_entitlements
  severity: 1
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 17H
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 17H
  window:
    value: 5
    unit: business_days
  caveat: Inserted by No. 43/2025. Binds the party calling on the security - usually the principal against
    the contractor - so this watches the notice the contractor receives. A longer contract period governs.
    'Not entitled to have recourse' mapped to barred, as for WA s 57.
- key: closeout.security_release_claim.au-vic
  duty: Claim release of a performance security by the last day of the month after the defects liability
    period ends
  consequence: barred
  protection_type: countdown
  disease: forfeited_entitlements
  severity: 2
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 17A-17C
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 17A-17C
  caveat: Inserted by No. 43/2025. The earliest a claim may be served is 20 business days after the defects
    liability period ends, or a day the contract sets (s 17B); the latest is the later of the contract's
    day or the last day of the month after the one in which the last defects liability period ends (s
    17C). No fixed count of days, so no window is recorded. A claim served late loses the Act's release
    route; mapped to barred.
- key: payment.adjudication_application.au-vic
  duty: Apply for adjudication within 10 business days of a schedule for less than the claim
  consequence: guidance
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 18(3)(c)
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  research_row: P8
  clause: s 18(3)(c)
  window:
    value: 10
    unit: business_days
  caveat: 'Other cases: 10 business days after the due date where a scheduled amount is unpaid (s 18(3)(d));
    5 business days after the respondent''s 5-business-day period where no schedule was served (s 18(3)(e)).
    Mapped to guidance like every other SOP Act''s adjudication window in this library.'
- key: payment.adjudication_response.au-vic
  duty: Respond to an adjudication application within 5 business days
  consequence: guidance
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 21
    access_date: '2026-09-16'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  research_row: P9
  clause: s 21
  window:
    value: 5
    unit: business_days
  caveat: Later of 5 BD / 2 BD; only if a schedule was served.
- key: payment.claim_cadence.au-vic
  duty: Make a progress claim on the cadence the contract allows
  consequence: guidance
  protection_type: check
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 14A, 14D
    access_date: '2026-09-16'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  research_row: P1
  clause: s 14A, 14D
  window:
    value: 1
    unit: months
  caveat: Monthly claim cadence; no consequence stated for the cadence itself in the source table - validity
    conditions are P2.
- key: payment.claim_content.au-vic
  duty: 'Make every claim a valid payment claim: in the prescribed form, identifying the work, stating
    the amount and that it is made under the Act'
  consequence: barred
  protection_type: check
  disease: disputes
  severity: 1
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 14(2)
    access_date: '2026-09-28'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  research_row: P2
  clause: s 14(2)
  caveat: A claim missing this content is not valid under the Act; mapped to barred. The prescribed form
    and prescribed information requirements (s 14(2)(a), (b)) were added by No. 43/2025.
- key: payment.due_date.au-vic
  duty: Be paid by the contract's due date, and never later than 20 business days after the claim
  consequence: guidance
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 12(1), (1B)
    access_date: '2026-09-28'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  research_row: P6
  clause: s 12(1), (1B)
  window:
    value: 20
    unit: business_days
  caveat: A contract term setting a later date has no effect (s 12(1B), inserted by No. 43/2025). Where
    the contract is silent, payment is due 10 business days after the earliest day a claim may be served
    under s 14A (s 12(1)(b)). Corrected 2026-09-28 - this row previously said 10 business days after a
    payment schedule. No consequence stated for the due-date rule itself; mapped to guidance.
- key: payment.notice_of_intention.au-vic
  duty: Give notice of intention to apply for adjudication within 10 business days of the due date
  consequence: guidance
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 18(2)
    access_date: '2026-09-28'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  research_row: P7
  clause: s 18(2)
  window:
    value: 10
    unit: business_days
  caveat: A further 5 business days after this notice before the next step (suspension / suing) is available.
- key: payment.schedule_due.au-vic
  duty: Receive a payment schedule within 10 business days of each claim, or the full amount becomes payable
  consequence: liable_full_amount
  protection_type: watch
  disease: disputes
  severity: 4
  grade: primary_read
  citation:
    url: https://content.legislation.vic.gov.au/sites/default/files/2026-06/02-15aa015-authorised.pdf
    clause: s 15(4)
    access_date: '2026-09-16'
  evidence:
