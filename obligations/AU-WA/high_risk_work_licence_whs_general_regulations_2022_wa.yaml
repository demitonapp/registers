# The high risk work licence duties of the same Regulations, their own instrument
# because a concrete extends one base (the Qld and NSW pattern).
id: high_risk_work_licence_whs_general_regulations_2022_wa
extends: model_competency
title: Work Health and Safety (General) Regulations 2022 (WA), high risk work licences (rr 81 to 85)
publisher: AU-WA Government
jurisdictions:
