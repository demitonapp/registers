  citation:
    url: https://www.legislation.wa.gov.au/legislation/statutes.nsf/law_s53267.html&view=consolidated
    clause: r 81
    access_date: '2026-10-21'
  caveat: Regulation 81 says a person must not carry out a class of high risk work unless they hold a
    high risk work licence for that class, except as regulation 82 provides (training under a licensed
    supervisor; a certification holder for 60 days while applying; an accredited assessor's assessment).
    Schedule 3 sets the licence classes. The duty is the worker's; the contractor's matching duty to see
    the licence is r 85, the next row. Read against this state's own current Regulations 2026-10-21 (SM061
    W1), not carried over from another state.
- overrides: own_commitments.competency_evidence
  key: own_commitments.competency_evidence.au-wa
  clause: r 85
  grade: primary_read
  citation:
    url: https://www.legislation.wa.gov.au/legislation/statutes.nsf/law_s53267.html&view=consolidated
    clause: r 85
    access_date: '2026-10-21'
  caveat: Regulation 85 requires a person conducting a business or undertaking to see written evidence
    that a worker holds the relevant high risk work licence before directing or allowing them to carry
    out or supervise high risk work, and to keep a record of that evidence for at least 1 year (r 85(4)).
    That is the duty a site check of who is allocated today evidences. Read against this state's own current
    Regulations 2026-10-21 (SM061 W1), not carried over from another state.
