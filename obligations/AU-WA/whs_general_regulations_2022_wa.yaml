    clause: r 304(2), (6)
    access_date: '2026-10-21'
  caveat: Nationally harmonised excavation-work clause (model WHS Regulations Part 6.3 Division 3). Provision
    304(6) keeps the underground essential services information for at least 2 years after a notifiable
    incident in connection with the excavation work, and otherwise until the excavation work is completed;
    the 24 months here is the incident case. Read against this state's own current Regulations 2026-10-21
    (SM061 W1), not carried over from another state.
