- overrides: whs.swms_copy_to_principal
  key: whs.swms_copy_to_principal.au-wa
  citation:
    url: https://www.legislation.wa.gov.au/legislation/statutes.nsf/law_s53267.html&view=consolidated
    clause: r 301
    access_date: '2026-10-21'
  caveat: 'Before the work starts, with no day count, so no window is recorded. Applies only to work on
    a construction project, which r 292 defines by headcount, not cost: a project where 5 or more persons
    are, or are likely to be, working at the same time at a construction site (the model sets $250,000).
    The principal contractor''s matching duty to obtain the copy is r 312, its own row. The compliance_documents
    register can hold a statement but not whether or when a copy went to the principal contractor, so
    this is recorded not_collected.'
