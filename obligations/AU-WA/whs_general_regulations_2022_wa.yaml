# Read 2026-10-21 from the official consolidation (PCO 01-c0-00, as at 1 July 2026). WA's
# only difference from the model on these rows is r 292: a construction project is defined by
# headcount, not cost. Mines and petroleum operations have their own Regulations, not read here.
