- key: clocs_a.vehicle_safety_spec.au
  duty: Fit every heavy vehicle with the CLOCS-A safety equipment for the project's tier
  consequence: breach
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: clocs_a.vehicle_safety_spec
  severity: 3
  grade: primary_read
  citation:
    url: https://clocs-a.org.au/wp-content/uploads/2026/04/CLOCS-A-Standard-v.1.6.pdf
    clause: cl 5.4.2(a); App E
    access_date: '2026-10-21'
  evidence:
    kind: not_collected
    register: vehicle_list
  clause: cl 5.4.2(a)
  caveat: A Transport Operator duty (a civil contractor running its own trucks is one), binding only where the client's
    contract requires CLOCS-A. Appendix E1 sets the equipment by tier. Bronze, the minimum, is met by at least one
    standard of each either/OR pair plus every other Bronze standard. On city and urban projects only, Bronze bars
    solid, clear or coloured bug deflectors on bonneted trucks. On city and urban projects only, Bronze bars external
    engine air intake hardware above bonnet level on bonneted trucks. On city and urban projects only, Bronze bars
    large bullbars that rise above the vehicle's standard bumper height. Bronze bars sunvisors that protrude below
    the windscreen's tinted band or the wipers' swept path. Bronze bars overly large lettering or decals on any part
    of the windscreen. Bronze bars windscreen or side window tinting that cuts light transmittance beyond legal levels.
    Bronze bars aftermarket fitments inside the cab, such as screens or mobile phones, that create blind spots or
    restrict the driver's view. Bronze requires a Fresnel lens on the front or a peeper window, OR approved front
    and left-side cameras or proximity sensors (an either/OR item). Bronze requires amber beacons on the cabin roof.
    Bronze requires Class V (passenger side) and Class VI (front) blind spot mirrors. Bronze requires reverse beepers.
    Bronze requires conspicuity markings in retro-reflective tape. Bronze requires a high visibility drawbar colour
    scheme. Bronze requires vulnerable road user warning signage. Bronze requires wheel-nut position indicators. Bronze
    requires reversing cameras OR reversing sensors (an either/OR item). Silver adds daytime running lamps, a left
    turn audible warning, front, side and rear underrun protection, ABS on trucks and trailers, the ADR 80/03 (Euro
    V) emission standard, and left-side blind spot cameras OR proximity sensors. Gold adds a telematics monitoring
    system plus at least 4 of electronic stability control, roll stability control, advanced emergency braking, autonomous
    reverse braking, and ADR 80/04 (Euro VI) or a zero emission vehicle. The vehicle register does not record fitted
    equipment, so this is recorded not_collected. TfNSW TS 00088 makes the Bronze vehicle tier mandatory for heavy
    vehicles on its own contracts; that is a separate instrument.
