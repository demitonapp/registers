    access_date: '2026-09-28'
  evidence:
    kind: not_collected
    register: traffic_management_plan
  clause: App C(j)
  window:
    value: 1
    unit: months
  caveat: A Principal Contractor duty, binding only where the client's contract requires CLOCS-A. The
    construction logistics management plan (CLMP) is its own document, separate from the traffic management
