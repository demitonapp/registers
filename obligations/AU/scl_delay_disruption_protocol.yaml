  caveat: Demiton default, basis SCL Protocol. No Australian primary source names a photo cadence and
    the research record's own not-found list says no source sets one; L9 is graded 'secondary' (SCL App
    B 2.2-2.3, UK guidance). SM026 decision 4 records it as a `guidance`-consequence Demiton default that
    is never counted as `missed`. The one-per-working-day cadence and the dated-and-located content requirement
    are the Demiton default, not a source's. It is not jurisdiction-specific; recorded as AU so it applies
    to every AU project, and applies_to_form is 'any' because it is not tied to a contract form.
  basis: Society of Construction Law Delay and Disruption Protocol
