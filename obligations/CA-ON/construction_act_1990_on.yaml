    clause: s 85.1(1)-(7), 85.2; O. Reg. 304/18 s 12, 12.1
    access_date: '2026-10-09'
  evidence: *id004
  clause: s 85.1(1)-(7), 85.2; O. Reg. 304/18 s 12, 12.1
  caveat: A public contract is one whose owner is the Crown, a municipality or a broader public sector organization
    (s 85.1(1)); an architect or engineer contractor is exempt (s 85.1(3)). Bonds are in the prescribed form,
    from an insurer licensed to write surety and fidelity insurance, and the payment bond protects subcontractors
    and suppliers (s 85.1(4), (5)). Above CAD 500,000,000 the owner sets the limit, at least CAD 250,000,000
