obligations:
- key: payment.act_applicability.ca-on
  duty: Determine which version of the Act, and whether its prompt payment and adjudication Parts, govern the
    contract
  consequence: guidance
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 1(4), 4, 5(1), 87.3(1), (4), 87.4; O. Reg. 304/18 s 13
    access_date: '2026-10-09'
  evidence:
    kind: built_in
    from: the contract
  clause: s 1(4), 4, 5(1), 87.3(1), (4), 87.4; O. Reg. 304/18 s 13
  caveat: 'Parts I.1 (prompt payment) and II.1 (adjudication) do not apply to a contract entered into before
    1 October 2019, to a later contract whose procurement the owner commenced before that day, or to a subcontract
    under either (s 87.3(4)). A procurement commences at the earliest request for qualifications, request for
    quotation, request for proposals or call for tenders (s 1(4)). A contract entered into, or procured, before
    1 July 2018 stays under the Act as it read on 29 June 2018 (s 87.3(1)). The amendments in force on 1 January
    2026 (Building Ontario For You Act (Budget Measures), 2024, Sched. 4) apply to every other improvement
    from that day (s 87.4(2)), except as s 87.4(3) to (7) provide: the annual holdback release starts later
    for a contract entered into before that day (s 87.4(4)). Parts I.1 and II.1 do not apply to a Class I nuclear
    facility (O. Reg. 304/18 s 13), and apply with modifications to an alternative financing and procurement
    project agreement (s 1.1). An agreement that the Act does not apply is void (s 4), and every contract and
    subcontract is deemed amended to conform (s 5(1)). Not itself an evidence record, but the rule for whether
    the other rows in this instrument apply.'
- key: payment.claim_cadence.ca-on
  duty: Give the owner a proper invoice every month, unless the contract sets another cadence
  consequence: guidance
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.3(1)-(4)
    access_date: '2026-10-09'
  evidence: &id001
    kind: register
    register: progress_claim
    system_type: finance
  clause: s 6.3(1)-(4)
  window:
    value: 1
    unit: months
  caveat: Monthly unless the contract provides otherwise (s 6.3(1)). A term that makes giving a proper invoice
    conditional on a payment certifier's prior certification or the owner's prior approval is of no force or
    effect (s 6.3(2)); certification or approval after the invoice is given, and testing and commissioning
    terms, are allowed (s 6.3(3), (4)). No consequence is stated for the cadence itself.
- key: payment.claim_content.ca-on
  duty: 'Make every invoice to the owner a proper invoice: contractor''s name and address, date and period
    or milestone, the contract reference, a description of what was supplied, the amount and payment terms,
    and who is to be paid'
  consequence: barred
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 1
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.1(1), 6.3(5), (6)
    access_date: '2026-10-09'
  evidence: *id001
  clause: s 6.1(1), 6.3(5), (6)
  caveat: 'Also any information the owner reasonably requests for its accounts payable system, any other requirement
    the contract specifies, and anything prescribed (s 6.1(1) para 6.1, 7). From 1 January 2026 an invoice
    that misses a requirement is still deemed a proper invoice unless the owner gives a written deficiency
    notice within 7 days of receiving it (s 6.1(2), its own row). Once given, a proper invoice may be revised
    only with the owner''s advance agreement and without changing its date (s 6.3(5)). Mapped to barred as
    the other jurisdictions'' claim content rows are (judgment call): an invoice the owner rejects in time
    starts no 28 day payment clock.'
- key: payment.invoice_deficiency_notice.ca-on
  duty: Receive any written notice that an invoice is deficient within 7 days after the owner receives it,
    or the invoice is deemed a proper invoice
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.1(2), 6.3(6)
    access_date: '2026-10-09'
  evidence: &id002
    kind: record_in_demiton
    register: contract_notice
  clause: s 6.1(2), 6.3(6)
  window:
    value: 7
    unit: days
  caveat: 'In force from 1 January 2026. The owner''s notice must say what is deficient and what is required
    to address it; without one in time, the invoice is deemed proper for Part I.1 and the 28 day payment and
    14 day non-payment clocks run. Applies the same way to a revised invoice (s 6.3(6)). The clock runs from
    the owner''s receipt; a document sent by certified or registered mail is deemed received on the fifth day
    after mailing, excluding Saturdays and holidays (s 87(2)). No trigger is set: claim_lodged dates the invoice
    when given, and its proof pairs with a payment schedule, not this notice. Calendar days: the Act defines
    no business day. ''No later than N days after'' an event excludes the day of the event (Legislation Act,
    2006 s 89(5)), and a time limit ending on a holiday runs to the next day that is not one (s 89(1)); Sunday
    is a holiday there, Saturday is not.'
- key: payment.schedule_due.ca-on
  duty: Receive any notice of non-payment within 14 days after the owner receives a proper invoice, or the
    full amount is payable by day 28
  consequence: liable_full_amount
  protection_type: watch
  disease: disputes
  approval_class: payments
  trigger: claim_lodged
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.4(2), (3), 6.7; O. Reg. 303/18 s 3(a); O. Reg. 304/18 s 4
    access_date: '2026-10-09'
  evidence:
    kind: register
    register: payment_schedule
    system_type: finance
  clause: s 6.4(2), (3), 6.7; O. Reg. 303/18 s 3(a); O. Reg. 304/18 s 4
  window:
    value: 14
    unit: days
  caveat: 'Ontario''s equivalent of a payment schedule. The owner may withhold only the amount a notice of
    non-payment specifies, and the notice must be in Form 1.1 (paper or electronic) and detail all of the reasons;
    every other amount stays due within 28 days (s 6.4(1), (3)). Reasons may include set-off under s 12 or
    s 17(3) (s 6.7). The Act counts from the owner''s receipt of the invoice, while claim_lodged dates the
    invoice when given; the two are the same day for an invoice delivered electronically, but a mailed invoice
    is deemed received on the fifth day after mailing, excluding Saturdays and holidays (s 87(2)), so this
    deadline then runs early. Calendar days: the Act defines no business day. ''No later than N days after''
    an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday
    runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.due_date.ca-on
  duty: Be paid every amount of a proper invoice that no notice of non-payment disputes within 28 days after
    the owner receives it
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.2, 6.4(1), (3)
    access_date: '2026-10-09'
  evidence: *id001
  clause: s 6.2, 6.4(1), (3)
  window:
    value: 28
    unit: days
  caveat: 'Subject to the 10% holdback (s 6.2). Unpaid amounts carry interest (s 6.9, its own row) and may
    be referred to adjudication (O. Reg. 264/25 s 19(1)). No trigger is set, as for the other jurisdictions''
    due date rows; the clock runs from the owner''s receipt (see payment.schedule_due.ca-on). Calendar days:
    the Act defines no business day. ''No later than N days after'' an event excludes the day of the event
    (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday runs to the next day that is not
    one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.interest.ca-on
  duty: Charge interest on any amount not paid when the Act makes it due, at the prejudgment interest rate
    or the contract rate if higher
  consequence: guidance
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 2
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.9, 13.19(3), (4)
    access_date: '2026-10-09'
  evidence:
    kind: not_collected
    register: progress_claim
  clause: s 6.9, 13.19(3), (4)
  caveat: Interest begins to accrue on the due date, at the prejudgment interest rate under the Courts of Justice
    Act s 127(2) or, if the contract or subcontract specifies a different rate, the greater of the two (s 6.9).
    The same rule applies to an amount an adjudicator determines (s 13.19(3)), without compounding on interest
    already under s 6.9 (s 13.19(4)). The rate itself is set under the Courts of Justice Act and is not recorded
    here. The progress_claim register holds the amount but not the interest charged on it, so this is recorded
    not_collected.
- key: payment.subcontractor_payment.ca-on
  duty: Pay each subcontractor whose work was in a proper invoice within 7 days after receiving the owner's
    payment of it
  consequence: breach
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 3
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.5(1)-(3), 6.6(1)-(3), (11)
    access_date: '2026-10-09'
  evidence:
    kind: not_collected
    register: payable_entry
  clause: s 6.5(1)-(3), 6.6(1)-(3), (11)
  window:
    value: 7
    unit: days
  caveat: 'Applies to full and partial payment; a partial payment is shared rateably, with any amount the owner
    withheld for a particular subcontractor''s work held back from that subcontractor only (s 6.5(3)). The
    same 7 days bind each subcontractor towards its own subcontractors (s 6.6). Subject to the holdback (s
    6.2) and to the contractor''s own notice of non-payment (its own row); wages obligations are not reduced
    (s 6.8). The Act states no offence: a late payment carries interest (s 6.9) and can be adjudicated (O.
    Reg. 264/25 s 19(1)). No register dates the owner''s payment against the invoice it pays, so no trigger
    is set and this is recorded not_collected. Calendar days: the Act defines no business day. ''No later than
    N days after'' an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit
    ending on a holiday runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday
    is not.'
- key: payment.subcontractor_payment_unpaid.ca-on
  duty: Pay each subcontractor within 35 days after giving the owner the proper invoice, even if the owner
    has not paid, unless a notice of non-payment is given
  consequence: breach
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 3
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.5(4), 6.6(4), (5), (10)
    access_date: '2026-10-09'
  evidence:
    kind: not_collected
    register: payable_entry
  clause: s 6.5(4), 6.6(4), (5), (10)
  window:
    value: 35
    unit: days
  caveat: 'Applies to the amount the owner did not pay within 28 days, to the extent the subcontractor was
    not paid under s 6.5(2). A subcontractor paying its own subcontractor has 7 days after it is paid or, if
    it is not paid, 42 days after the proper invoice was given to the owner (s 6.6(5)), and may ask the contractor
    to confirm that date, which the contractor must give as soon as possible (s 6.6(10)). The clock runs from
    the day the contractor gives the invoice, which is the date claim_lodged records; no trigger is set because
    claim_lodged''s proof is a payment schedule, not a payment to a subcontractor. The Act states no offence.
    Calendar days: the Act defines no business day. ''No later than N days after'' an event excludes the day
    of the event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday runs to the next day
    that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.non_payment_notice_to_subcontractor.ca-on
  duty: Give a subcontractor any notice of non-payment within 7 days after receiving the owner's notice of
    non-payment, or before day 35 after the invoice if the owner gave none
  consequence: liable_full_amount
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.5(5)-(8), 6.6(6)-(9); O. Reg. 303/18 s 3(b)-(e); O. Reg. 304/18 s 4
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 6.5(5)-(8), 6.6(6)-(9); O. Reg. 303/18 s 3(b)-(e); O. Reg. 304/18 s 4
  window:
    value: 7
    unit: days
  caveat: 'Two kinds. Where the owner has not paid: Form 1.2, stating the amount not paid because of the owner''s
    non-payment, with a copy of any owner''s notice and an undertaking to refer the matter to adjudication
    within 21 days (s 6.5(5)). Where the contractor disputes the subcontractor''s entitlement: Form 1.3, specifying
    the amount and detailing all of the reasons (s 6.5(6)). Without a notice in time, the contractor must pay
    within the 7 or 35 days. A subcontractor''s notice to its own subcontractor is Form 1.4 or 1.5 on the same
    timing (s 6.6(6)-(8)). Once the owner pays an amount covered by a Form 1.2 notice, the 7 day payment rule
    applies to it (s 6.5(8)). Calendar days: the Act defines no business day. ''No later than N days after''
    an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday
    runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.adjudication_undertaking.ca-on
  duty: Refer the owner's non-payment to adjudication within 21 days after giving a subcontractor a notice
    of non-payment that undertakes to do so
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 6.5(5)(a)(iii), 6.6(6)(a)(iii)
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 6.5(5)(a)(iii), 6.6(6)(a)(iii)
  window:
    value: 21
    unit: days
  caveat: 'The undertaking is a required part of a Form 1.2 or Form 1.4 notice (a Form 1.4 needs none where
    the chain broke at the owner). The Act states no consequence for failing to refer within the 21 days. Calendar
    days: the Act defines no business day. ''No later than N days after'' an event excludes the day of the
    event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday runs to the next day that is
    not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.adjudication_deadline.ca-on
  duty: Give any notice of adjudication within 90 days after the contract is completed, abandoned or terminated
  consequence: barred
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 1
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.5(1)-(3.1), (4), (5); O. Reg. 264/25 s 19
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.5(1)-(3.1), (4), (5); O. Reg. 264/25 s 19
  window:
    value: 90
    unit: days
  caveat: 'After the 90 days an adjudication may not be commenced unless the parties agree otherwise (s 13.5(3)).
    For a subcontract the 90 days run from the earliest of that date, the date the subcontract is certified
    complete under s 33, and the date the subcontractor last supplied (s 13.5(3.1)). This text is in force
    from 1 January 2026; the earlier text was not read. Adjudicable matters (O. Reg. 264/25 s 19): valuation,
    payment including change orders approved or not, any dispute in a notice of non-payment, set-off amounts,
    holdback payment under s 26, and scope, price change or extension of time where needed to decide one of
    those. One dispute per adjudication unless the parties and the adjudicator agree (s 13.5(4)), even if a
    court action or arbitration is under way (s 13.5(5)). No register dates completion, abandonment or termination,
    so no trigger is set. Calendar days: the Act defines no business day. ''No later than N days after'' an
    event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday
    runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.notice_of_adjudication.ca-on
  duty: Give the other party a written notice of adjudication with the content the Act requires, and send a
    copy to the Authority the same day
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.7(1); O. Reg. 264/25 s 20
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.7(1); O. Reg. 264/25 s 20
  caveat: The notice states the parties' names and addresses, the nature of the dispute and how and when it
    arose, the redress sought, a proposed adjudicator, and any previous adjudication on the same contract or
    subcontract with its determination (s 13.7(1)). The copy to the Authorized Nominating Authority is electronic
    and on the same day (O. Reg. 264/25 s 20); 'same day' is the only timing, so no window is recorded.
- key: payment.adjudicator_appointment.ca-on
  duty: Ask the Authority to appoint a registry adjudicator if the agreed adjudicator has not consented within
    4 days after the notice of adjudication
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.9(2)-(6); O. Reg. 264/25 s 21, 22
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.9(2)-(6); O. Reg. 264/25 s 21, 22
  window:
    value: 4
    unit: days
  caveat: 'Binds the party who gave the notice (s 13.9(4)), and also applies as soon as there is no prospect
    of agreeing an adjudicator (O. Reg. 264/25 s 22). The Authority appoints within 7 days after the request
    (s 13.9(5)). A private adjudicator needs a written agreement signed by the parties and the adjudicator
    with a fee of at least CAD 1,000 an hour (O. Reg. 264/25 s 21). A contract term naming an adjudicator is
    of no force or effect (s 13.9(3)). Calendar days: the Act defines no business day. ''No later than N days
    after'' an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending
    on a holiday runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.adjudication_documents.ca-on
  duty: Give the adjudicator the notice, and the adjudicator and the other party the contract and every document
    relied on, within 5 days after the adjudicator agrees or is appointed
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.11; O. Reg. 264/25 s 24
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.11; O. Reg. 264/25 s 24
  window:
    value: 5
    unit: days
  caveat: 'Binds the party who gave the notice of adjudication. Served as the rules of court permit for a document
    other than an originating process, to the adjudicator and the other party on the same day, unless the adjudicator
    directs otherwise (O. Reg. 264/25 s 24). The adjudicator''s 30 days run from receiving these documents
    (s 13.13(1)). The Act states no consequence for lateness. Calendar days: the Act defines no business day.
    ''No later than N days after'' an event excludes the day of the event (Legislation Act, 2006 s 89(5)),
    and a time limit ending on a holiday runs to the next day that is not one (s 89(1)); Sunday is a holiday
    there, Saturday is not.'
- key: payment.adjudication_response.ca-on
  duty: Respond in writing to a notice of adjudication by the day the adjudicator specifies, copied to the
    adjudicator and every other party the same day
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.11.1; O. Reg. 264/25 s 25
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.11.1; O. Reg. 264/25 s 25
  caveat: Responding is optional (s 13.11.1 says a party 'may'). The adjudicator sets the day (O. Reg. 264/25
    s 25(3)); neither the Act nor the regulation states a day count, so no window is recorded. An objection
    to the adjudicator's jurisdiction must be made when the party first makes submissions (s 13.12.1).
- key: payment.determination.ca-on
  duty: Receive the adjudicator's written determination within 30 days after the adjudicator receives the documents
  consequence: breach
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 3
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.13(1)-(6), 13.17.1; O. Reg. 264/25 s 30, 32
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.13(1)-(6), 13.17.1; O. Reg. 264/25 s 30, 32
  window:
    value: 30
    unit: days
  caveat: 'Extendable before expiry by up to 14 days on the adjudicator''s request with the parties'' written
    consent, or by any period the parties agree in writing with the adjudicator''s consent (s 13.13(2)); a
    party who gave a notice of non-payment on the matter must pass on notice of the extension (s 13.13(3),
    (4)). A determination made late is of no force or effect (s 13.13(5)), and the referring party may give
    a fresh notice of adjudication (O. Reg. 264/25 s 32). The adjudicator sends an electronic copy, then a
    certified copy within 7 days (O. Reg. 264/25 s 30), and may correct errors within 5 days after communicating
    it (s 13.17.1). A duty on the adjudicator, mapped to breach as the other jurisdictions'' determination
    rows are. Calendar days: the Act defines no business day. ''No later than N days after'' an event excludes
    the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday runs to the
    next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
- key: payment.determination_payment.ca-on
  duty: Pay any amount an adjudicator's determination requires within 15 days after it is communicated
  consequence: breach
  protection_type: watch
  disease: disputes
  approval_class: payments
  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 13.15, 13.19(1)-(6), 13.20
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 13.15, 13.19(1)-(6), 13.20
  window:
    value: 15
    unit: days
  caveat: '15 days from 1 January 2026 (2024, c. 20, Sched. 4, s. 23); the Act said 10 days before then. Subject
    to the holdback (s 13.19(1)). The determination binds until a court, an arbitration or a written agreement
    decides the matter (s 13.15). An unpaid amount carries interest (s 13.19(3)), and the unpaid contractor
    or subcontractor may suspend work until paid the amount, interest and the reasonable costs of suspending,
    and is then owed the reasonable costs of resuming (s 13.19(5), (6)). A certified copy may be filed with
    the court and enforced as its order within 2 years, and the filing party must notify the other within 10
    days of filing (s 13.20). Calendar days: the Act defines no business day. ''No later than N days after''
    an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending on a holiday
    runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
