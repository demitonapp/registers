- key: closeout.holdback_retain.ca-on
  duty: Retain a holdback of 10% of the price of the services or materials as they are supplied, until every
    lien that may be claimed against it has expired or been discharged
  consequence: liable_full_amount
  protection_type: check
  disease: disputes
  approval_class: payments
  severity: 3
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 22(1)-(4), 23, 24, 30
    access_date: '2026-10-09'
  evidence: &id003
    kind: register
    register: retention_position
    system_type: finance
  clause: s 22(1)-(4), 23, 24, 30
  caveat: 'Binds every payer: the owner, the contractor and each subcontractor (s 22(1)). After substantial
    performance, a separate 10% holdback applies to the finishing work (s 22(2)). It may be held as a letter
    of credit or a demand-worded holdback repayment bond in the prescribed form (s 22(4)). A payer may pay
    up to 90% without jeopardy unless it has received written notice of a lien, when it must also retain enough
    to satisfy the lien (s 24). An owner is personally liable to lien claimants for the holdback it was required
    to retain (s 23). On abandonment or termination, holdback may not be applied to substitute work or a claim
    against the contractor until the liens expire (s 30). Applies to the contractor in both directions: it
    is held from the contractor, and the contractor holds it from its subcontractors.'
