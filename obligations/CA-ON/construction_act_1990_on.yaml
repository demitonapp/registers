# Ontario's Construction Act, read in full from Ontario e-Laws on 2026-10-09
# (consolidated from 1 January 2026 to the e-Laws currency date; last
# amendment 2025, c. 14, Sched. 2), with the regulations its rows rely on:
# O. Reg. 264/25 (Adjudications under Part II.1, in force 1 January 2026,
# which revoked O. Reg. 306/18), O. Reg. 304/18 (General) and O. Reg. 303/18
# (Forms), each consolidated from 1 January 2026.
#
# Parts I.1 (prompt payment) and II.1 (adjudication) govern only contracts
# entered into on or after 1 October 2019 whose procurement began on or after
# that day (s 87.3(4)). The Building Ontario For You Act (Budget Measures),
# 2024, Sched. 4 and the Fighting Delays, Building Faster Act, 2025, Sched. 2
# changed several windows from 1 January 2026; the rows carry the current text
# and say where it changed. Day counts are calendar days (the Act defines no
# business day); the Legislation Act, 2006 ss 88 and 89 exclude the day of the
# event and extend a period that ends on a holiday (Sunday and the listed
# public holidays, not Saturday). This library holds no Ontario holiday
# calendar.
