    can be set aside only on the grounds in s 13.18(5), and on a ground that could have been raised as a jurisdictional
    objection in the adjudication only if failing to object was justified (s 13.18(5.1), 13.12.1). An application
    does not stay the determination unless the court orders (s 13.18(7)), so the 15 day payment still runs.
