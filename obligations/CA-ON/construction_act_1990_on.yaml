  evidence: *id003
  clause: s 26(4), (7), (9), 87.4(4)
  window:
    value: 74
    unit: days
  caveat: 'In force from 1 January 2026. The owner pays all holdback accrued on the contractor''s supply in
    the year before the anniversary, at least 60 and not later than 74 days after the notice, unless a lien
    has been preserved or perfected on the contract and not discharged or vacated (s 26(4)). Holdback held
