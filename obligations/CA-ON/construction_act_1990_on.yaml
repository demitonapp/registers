  clause: s 36(1)-(6)
  window:
    value: 90
    unit: days
  caveat: 'A preserved lien not perfected in time expires (s 36(2)). Where the lien does not attach to the
    premises, starting the action perfects it (s 36(3)(b)). A preserved lien is also perfected by sheltering
    under another claimant''s perfected lien on the same improvement, as to the defendants and relief in that
    claim (s 36(4)). The 90 days run from the last day of the 60 day preservation period, so up to about 150
    days from the triggering event. Calendar days: the Act defines no business day. ''No later than N days
    after'' an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit ending
    on a holiday runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday is not.'
