    value: 21
    unit: days
  caveat: 'Anyone with a lien, a trust beneficiary under Part II or a mortgagee may ask. The owner or contractor
    gives the parties, contract date, procurement start, contract price, a state of accounts (price supplied,
    amounts paid, holdbacks, balance and set-off, s 39(4.1)) and any payment bond; the contractor or a subcontractor
    gives the same for a subcontract (s 39(1)). A workers'' trust fund trustee may inspect payroll records
    on the same timing (s 39(3)). The contractor must also confirm the date and place the certificate of substantial
    performance was published, within a reasonable time with no day count (s 39(4)). Failing to answer, or
    knowingly or negligently misstating, makes the person liable for the requester''s damages (s 39(5)), and
    the court may order compliance (s 39(6)). Calendar days: the Act defines no business day. ''No later than
    N days after'' an event excludes the day of the event (Legislation Act, 2006 s 89(5)), and a time limit
    ending on a holiday runs to the next day that is not one (s 89(1)); Sunday is a holiday there, Saturday
