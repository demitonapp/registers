  severity: 4
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 2(1), 32(1)-(4); O. Reg. 303/18 s 2(9); O. Reg. 304/18 s 1, 9
    access_date: '2026-10-09'
  evidence: &id004
    kind: not_collected
    register: compliance_documents
  clause: s 2(1), 32(1)-(4); O. Reg. 303/18 s 2(9); O. Reg. 304/18 s 1, 9
  window:
    value: 7
    unit: days
  caveat: 'On the contractor''s application, the payment certifier (or, if there is none, the owner and the
    contractor jointly) decides whether the contract is substantially performed: ready for use and completable
    for no more than 3% of the first CAD 1,000,000 of the price, 2% of the next CAD 1,000,000 and 1% of the
    rest (s 2(1)), and signs Form 9. The certifier gives a copy to the owner and contractor within 7 days of
    signing, or is liable for the resulting damages (s 32(1) para 4, 32(4)). The contractor publishes it on
    the Daily Commercial News, Link2Build or Ontario Construction News; if it has not within 7 days, anyone
    may (s 32(1) paras 5, 6). The certificate has no effect until published (s 32(1) para 10), and publication
    starts the 60 day lien periods (s 31). Refusing to certify within a reasonable time when performance is
    clear makes the certifier liable for damages, and a court may declare it (s 32(1) para 7, 32(3)). No register
    holds the certificate with its publication date, so this is recorded not_collected. Calendar days: the
    Act defines no business day. ''No later than N days after'' an event excludes the day of the event (Legislation
    Act, 2006 s 89(5)), and a time limit ending on a holiday runs to the next day that is not one (s 89(1));
    Sunday is a holiday there, Saturday is not.'
- key: lien.preserve.ca-on
  duty: Preserve a lien within 60 days, by registering a claim for lien on title or, where the lien cannot
    attach to the premises, giving the owner a copy
  consequence: barred
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: payments
  severity: 1
  grade: primary_read
  citation:
    url: https://www.ontario.ca/laws/statute/90c30
    clause: s 15, 16, 31(2)-(7), 34(1), (3)-(5); O. Reg. 304/18 s 11, 11.1
    access_date: '2026-10-09'
  evidence: *id002
  clause: s 15, 16, 31(2)-(7), 34(1), (3)-(5); O. Reg. 304/18 s 11, 11.1
  window:
    value: 60
    unit: days
  caveat: A contractor's lien for supply up to substantial performance expires 60 days after the earlier of
    publication of the certificate or declaration of substantial performance and completion, abandonment or
    termination of the contract; for later supply, or with no certificate, 60 days after the earlier of completion
    and abandonment or termination (s 31(2)). A subcontractor's or supplier's lien runs from the earliest of
    publication, its last supply, the contract's completion, abandonment or termination, and the subcontract's
    certified completion (s 31(3)). A contract is deemed complete when what remains costs no more than the
    lesser of 1% of the price and CAD 5,000 (s 2(3)). If a notice of termination is published, the termination
    date is the publication date (s 31(7)). A lien does not attach to a Crown, municipal or railway right-of-way
    premises and is preserved by giving the copy to the prescribed Crown office, the municipal clerk or the
    railway (s 16, 34(3)-(4); O. Reg. 304/18 s 11, 11.1). The claim states the matters in s 34(5); a wilfully
    exaggerated claim makes the claimant liable for damages (s 35). 'The 60-day period next following' excludes
    the day of the event (Legislation Act, 2006 s 89(5)); a period ending on a holiday, or on a day the land
    registry office is closed, runs to the next day it is open (s 89(1), (2)). No register dates the triggering
    events, so no trigger is set.
- key: lien.perfect.ca-on
  duty: Perfect a preserved lien within 90 days after the last day it could have been preserved, by starting
    an action and registering a certificate of action on title
