# Ontario's Occupational Health and Safety Act, ss 51 to 53.1 and 66, read from
# Ontario e-Laws on 2026-10-09 (consolidated from 27 November 2025 to the
# e-Laws currency date; last amendment 2025, c. 13, Sched. 4), with O. Reg.
# 420/21 (Notices and Reports under Sections 51 to 53.1, consolidated from
# 1 January 2024; last amendment O. Reg. 242/23). The notice of project
# (s 23(2)) and the other construction duties are in
# construction_projects_regulation_1991_on.
id: ohsa_1990_on
