  clause: Art 7 Abs 1 S 1, 3, 4, Abs 3, 4, 5; Art 20 Abs 1 Nr 2, 3
  caveat: 'Bedarf der Erlaubnis, wer nach Bodendenkmälern graben oder zu einem anderen Zweck Erdarbeiten vornehmen will,
    obwohl er weiß, vermutet oder den Umständen nach annehmen muss, dass sich dort Bodendenkmäler befinden. Die Erlaubnis
    kann versagt werden, soweit es zum Schutz eines Bodendenkmals erforderlich ist (Abs 1 S 3). Erlaubnisfrei sind unter
    anderem Hauseinführungen, Netzverteiler, Leitungen vollständig in bestehenden Leitungsgräben, im Schlitzverfahren oder
    in bestehenden Straßenkörpern mit Mindertiefe sowie Start- und Zielgruben im Oberboden (Abs 3, Aufzählung dort); Grabungen
    des Landesamts sind ausgenommen (Abs 4). Eine Erlaubnis braucht auch, wer in der Nähe oberirdisch erkennbarer Bodendenkmäler
    Anlagen errichten, verändern oder beseitigen will, wenn sich das auf Bestand oder Erscheinungsbild auswirken kann (Abs
    5 S 1). Abs 1 S 4 verweist nur auf Art 6 Abs 5 S 2; ob eine Baugenehmigung die Erlaubnis nach Art 7 ersetzt, habe ich
    nicht geprüft (BayBO nicht gelesen). Ohne die Erlaubnis oder die an ihre Stelle tretende Genehmigung zu arbeiten, ist
    eine Ordnungswidrigkeit mit Geldbuße bis zu fünf Millionen Euro (Art 20 Abs 1 Nr 2, 3). Wer die Erlaubnis einholen muss,
    sagt das Gesetz mit "wer ... will": der Veranlasser, im Regelfall der Bauherr; ob der Bauvertrag sie dem Auftragnehmer
    überträgt, steht nicht im Gesetz. Das Register compliance_documents kann die Erlaubnis enthalten, nicht aber den Bezug
    zu den Erdarbeiten, deshalb not_collected.'
- key: approvals.archaeological_find_costs.de-by
  duty: Die Kosten der vorherigen wissenschaftlichen Untersuchung, der Bergung von Funden und der Dokumentation der Befunde
    tragen, soweit es zuzumuten ist
  consequence: guidance
