  clause: Art 9 Abs 1, 2, 3, 4; Art 20 Abs 1 Nr 6
  caveat: Solche Funde werden mit der Entdeckung Eigentum des Freistaates Bayern, unabhängig von einer Eintragung in die
    Denkmalliste (Abs 1 S 1). Der Grundstückseigentümer hat gegen den Freistaat einen Anspruch auf Ausgleich, der Entdecker,
    der nicht zugleich Grundstückseigentümer ist, einen Anspruch auf Belohnung nach s 971 BGB (Abs 2, 3); beide entfallen
    für Objekte mit einem Verkehrswert unter 1000 Euro und für Funde, die unter Verstoß gegen gesetzliche Bestimmungen erfolgten
    (Abs 2 S 3). Der Anspruch entsteht 24 Monate nach der Übergabe (Abs 4 S 1). Wer nicht unverzüglich übergibt, handelt
    ordnungswidrig; Geldbuße bis zu fünf Millionen Euro (Art 20 Abs 1 Nr 6). "Unverzüglich" hat keine Zahl, deshalb kein
    Fenster. Das Register safety_incident kennt keinen Fund, deshalb ist die Zuordnung ein Näherungswert.
