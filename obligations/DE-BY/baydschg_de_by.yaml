    clause: Art 7 Abs 1 S 2
    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: job_budget
  clause: Art 7 Abs 1 S 2
  caveat: Die Pflicht trifft den, der nach Abs 1 S 1 die Erlaubnis braucht, also den Veranlasser der Erdarbeiten, im Regelfall
    den Bauherrn. Ob der Bauvertrag die Kosten dem Auftragnehmer überträgt oder ihm erstattet, steht nicht im Gesetz; für
    den Auftragnehmer ist die Zeile die Grundlage, den Kostenposten im Angebot und im Budget zu führen. "Soweit ihm das
    zuzumuten ist" ist nicht beziffert. Das Gesetz nennt für die Kostentragung weder Frist noch Folge, deshalb kein Fenster
    und guidance. Das Register job_budget führt Budgets, nicht den Kostenträger eines Funds, deshalb not_collected.
