    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: safety_incident
  clause: Art 8 Abs 2, 3, 4; Art 20 Abs 1 Nr 5
  window:
    value: 7
    unit: days
  caveat: Die Woche läuft ab der Anzeige nach Abs 1; ohne Anzeige beginnt sie nicht. Der gelesene Wortlaut sieht keine Verlängerung
    durch die Behörde vor; Eigentümer, dinglich Verfügungsberechtigte und unmittelbare Besitzer können aber verpflichtet
    werden, notwendige Maßnahmen zur Bergung, zur Klärung der Fundumstände und zur Sicherung weiterer Bodendenkmäler zu
    dulden (Abs 4). Gilt nicht bei Arbeiten des Landesamts oder unter seiner Mitwirkung (Abs 3). Verstoß ist eine Ordnungswidrigkeit
    mit Geldbuße bis zu fünf Millionen Euro (Art 20 Abs 1 Nr 5). Das Register safety_incident kennt keinen Fund, deshalb
    ist die Zuordnung ein Näherungswert.
- key: approvals.archaeological_dig_permit.de-by
  duty: Vor Erdarbeiten auf einem Grundstück die Erlaubnis einholen, wenn man weiß oder vermutet oder den Umständen nach
    annehmen muss, dass sich dort Bodendenkmäler befinden
