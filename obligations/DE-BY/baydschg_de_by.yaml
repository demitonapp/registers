# Gesetz zum Schutz und zur Pflege der Denkmäler (Bayerisches Denkmalschutzgesetz, BayDSchG) vom 25. Juni 1973 (BayRS 2242-1-WK). Art 1, 6, 7, 8, 9,
# 10, 11 und 20 gelesen auf gesetze-bayern.de (BAYERN.RECHT) am 18. Oktober 2026; die Seiten tragen den Vermerk "Text gilt ab: 01.05.2026" und
# "Fassung: 25.06.1973". In dieser Datei steht "Art" für Artikel.
#
# Bodendenkmäler sind bewegliche und unbewegliche Denkmäler einschließlich der zugehörigen menschlichen Gebeine, tierischen und sonstigen organischen
# Überreste, die sich im Boden befinden oder befanden und in der Regel aus vor- oder frühgeschichtlicher Zeit stammen (Art 1 Abs 4). Untere
# Denkmalschutzbehörden sind die Kreisverwaltungsbehörden (Art 10 Abs 1). Nach Art 20 Abs 1 kann mit Geldbuße bis zu fünf Millionen Euro belegt
# werden, wer vorsätzlich oder fahrlässig die dort genannten Pflichten verletzt; die Verfolgung verjährt in fünf Jahren (Abs 2). "Eine Woche" in Art 8
# Abs 2 zähle ich als 7 Tage; das Gesetz sagt nichts über ein Fristende am Wochenende. Die Bayerische Bauordnung (BayBO) habe ich nicht gelesen. Art 6
# (Baudenkmäler) ist nicht in einer Zeile gefasst: er betrifft Maßnahmen an Baudenkmälern und in ihrer Nähe, nicht die Entdeckung im Boden.
