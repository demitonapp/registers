  clause: Art 8 Abs 1, 3; Art 20 Abs 1 Nr 4, Abs 2
  caveat: Zur Anzeige verpflichtet sind der Finder, der Eigentümer und der Besitzer des Grundstücks sowie der Unternehmer
    und der Leiter der Arbeiten, die zu dem Fund geführt haben (Abs 1 S 1, 2); die Anzeige eines der Verpflichteten befreit
    die übrigen (S 3). Nimmt der Finder aufgrund eines Arbeitsverhältnisses an den Arbeiten teil, befreit ihn die Anzeige
    an den Unternehmer oder den Leiter der Arbeiten (S 4). Das gilt nicht bei Arbeiten, die vom Landesamt oder unter seiner
    Mitwirkung vorgenommen oder veranlasst werden (Abs 3). Wer die Anzeige nicht unverzüglich erstattet, handelt ordnungswidrig;
    Geldbuße bis zu fünf Millionen Euro (Art 20 Abs 1 Nr 4). "Unverzüglich" hat keine Zahl, deshalb kein Fenster. Das Register
    safety_incident ist das nächstliegende für ein Ereignis auf der Baustelle; es kennt keinen Fund, deshalb ist die Zuordnung
    ein Näherungswert.
- key: approvals.archaeological_find_standstill.de-by
  duty: Die aufgefundenen Gegenstände und den Fundort bis zum Ablauf einer Woche nach der Anzeige unverändert lassen, wenn
    nicht die Untere Denkmalschutzbehörde sie früher freigibt oder die Fortsetzung der Arbeiten gestattet
  consequence: offence
  protection_type: watch
