# Denkmalschutzgesetz (DSchG NRW) vom 13. April 2022 (GV. NRW. S. 662), zuletzt geändert durch Artikel 2 des Gesetzes vom 21. Juli 2026 (GV. NRW. S. 537), in Kraft
# getreten am 1. September 2026. Gelesen auf recht.nrw.de am 18. Oktober 2026 in der Fassung vom 01.09.2026, die seit diesem Tag gilt (vorher galt die Fassung vom
# 01.06.2022): s 2 Abs 5, s 9, s 14 bis 18, s 24 bis 27 und s 41. Die Änderung vom 21. Juli 2026 betrifft s 15 Abs 1 und s 24 Abs 2, 5 und 6 (Fußnoten des Gesetzestextes)
# und fügt s 38a ein. In dieser Datei steht "s" für Paragraf.
#
# Bodendenkmäler sind bewegliche oder unbewegliche Denkmäler, die sich im Boden oder in Gewässern befinden oder befanden, und gelten auch als solche, soweit konkrete,
# wissenschaftlich begründete Anhaltspunkte sie vermuten lassen (s 2 Abs 5). Untere Denkmalbehörden und Obere Denkmalbehörden sind nach s 21 bestimmt; ich habe s 21
# nicht gelesen und nenne die Behörden so, wie die gelesenen Paragrafen sie nennen. "Eine Woche" in s 16 Abs 2 zähle ich als 7 Tage; das Gesetz sagt nichts über ein
# Fristende am Wochenende. Nach s 41 Abs 2 kann eine Ordnungswidrigkeit mit einer Geldbuße bis zu fünfhunderttausend Euro geahndet werden, die Verjährung beträgt fünf
# Jahre (Abs 3). Baudenkmäler (s 9) und Gartendenkmäler (s 13) sind nicht in Zeilen gefasst. s 38a habe ich nicht gelesen.
