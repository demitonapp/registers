    url: https://recht.nrw.de/lrgv/gesetz/01092026-denkmalschutzgesetz-dschg-nrw
    clause: s 24 Abs 7
    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: compliance_documents
  clause: s 24 Abs 7
  window:
    value: 36
    unit: months
  caveat: Gilt für jede Erlaubnis nach diesem Gesetz. Die Frist kann auf Antrag in Textform jeweils bis zu einem Jahr verlängert
    werden, auch rückwirkend, wenn der Antrag vor Fristablauf bei der Denkmalbehörde eingegangen ist. Das Fenster nennt
    die drei Jahre bis zum Beginn der Ausführung, in Monaten gerechnet (36); die Unterbrechungsfrist von einem Jahr läuft
    ab Beginn jeder Unterbrechung und steht in der Zeile, nicht im Fenster. Der Absatz trägt im Gesetzestext die Nummer
    7 und steht am Ende von s 24, vor s 25. Das Register compliance_documents kann die Erlaubnis enthalten, nicht aber das
    Datum, an dem ihre Ausführung begann, deshalb not_collected.
