    clause: s 17; s 18 Abs 1, 2; s 41 Abs 1 Nr 4, 5
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: safety_incident
  clause: s 17; s 18 Abs 1, 2; s 41 Abs 1 Nr 4, 5
  window:
    value: 6
    unit: months
  caveat: Solche beweglichen Bodendenkmäler werden mit der Entdeckung Eigentum des Landes; es kann das Eigentum auf den
    Landschaftsverband, den Kreis, die Gemeinde, den Grundstückseigentümer oder den Entdecker übertragen (s 18 Abs 1). Wer
    seiner Ablieferungspflicht nachkommt, soll eine angemessene Belohnung erhalten, außer bei unerlaubten Nachforschungen
    (s 18 Abs 2). Die Überlassung nach s 17 ist vorübergehend; die sechs Monate sind die Höchstdauer, die die Obere Denkmalbehörde
    verlängern kann, wenn es zur Erhaltung oder Erforschung erforderlich ist, und keine Frist, die der Pflichtige einhalten
    müsste. Verstöße gegen die Überlassungspflicht (s 17) und die Melde- oder Übergabepflicht (s 18 Abs 1 S 2) sind Ordnungswidrigkeiten
    mit Geldbuße bis zu fünfhunderttausend Euro (s 41 Abs 1 Nr 4, 5). Das Register safety_incident kennt keinen Fund, deshalb
    ist die Zuordnung ein Näherungswert.
- key: approvals.heritage_permit_lapse.de-nw
  duty: Mit der Ausführung eines erlaubten Vorhabens innerhalb von drei Jahren nach Erteilung der Erlaubnis beginnen und
    die Ausführung nicht länger als ein Jahr unterbrechen, sonst erlischt die Erlaubnis
  consequence: barred
  protection_type: countdown
  disease: non_compliance
