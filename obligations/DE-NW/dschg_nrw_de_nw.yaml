  clause: s 16 Abs 1, 3; s 41 Abs 1 Nr 1, Abs 2
  caveat: Zur Anzeige verpflichtet sind der Entdecker, der Eigentümer, der Besitzer des Grundstücks, der Unternehmer und
    der Leiter der Arbeiten, die zu der Entdeckung geführt haben; die Anzeige eines Verpflichteten befreit die übrigen (Abs
    1 S 3 bis 5). Nimmt der Entdecker aufgrund eines Arbeitsverhältnisses an den Arbeiten teil, befreit ihn die Anzeige
    an den Unternehmer oder den Leiter der Arbeiten. Die Stelle, die die Anzeige erhält, unterrichtet die andere Stelle
    und die Obere Denkmalbehörde (S 2). Das gilt nicht bei Arbeiten der Denkmalfachämter oder unter ihrer Mitwirkung (Abs
    3). Wer die Anzeige nicht oder nicht rechtzeitig erstattet, handelt ordnungswidrig; Geldbuße bis zu fünfhunderttausend
    Euro (s 41 Abs 1 Nr 1, Abs 2). "Unverzüglich" hat keine Zahl, deshalb kein Fenster. Das Register safety_incident kennt
    keinen Fund, deshalb ist die Zuordnung ein Näherungswert.
- key: approvals.archaeological_find_standstill.de-nw
  duty: Das entdeckte Bodendenkmal und die Entdeckungsstätte bis zum Ablauf einer Woche nach der Anzeige unverändert lassen,
    wenn nicht die Obere Denkmalbehörde die Entdeckungsstätte früher freigibt oder die Fortsetzung der Arbeiten gestattet
  consequence: offence
  protection_type: watch
  disease: non_compliance
  approval_class: safety_environment
