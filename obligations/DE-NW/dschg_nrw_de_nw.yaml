    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: safety_incident
  clause: s 16 Abs 2, 3, 4; s 41 Abs 1 Nr 3, Abs 2
  window:
    value: 7
    unit: days
  caveat: Die Woche läuft ab der Anzeige nach Abs 1. Die Obere Denkmalbehörde kann die Frist verlängern, wenn die sachgerechte
    Untersuchung oder die Bergung des Bodendenkmals dies erfordern und es für die Betroffenen zumutbar ist (Abs 2 S 2);
    das Fenster nennt daher nur die gesetzliche Mindestdauer von einer Woche. Gegenüber Eigentümer und Nutzungsberechtigten
    kann angeordnet werden, notwendige Maßnahmen zur Bergung, zur Klärung der Fundumstände und zur Sicherung weiterer Bodendenkmäler
    zu dulden (Abs 4). Gilt nicht bei Arbeiten der Denkmalfachämter oder unter ihrer Mitwirkung (Abs 3). Die Behörde, die
    freigibt, ist in Nordrhein-Westfalen die Obere Denkmalbehörde, nicht wie in Bayern die Untere. Verstoß ist eine Ordnungswidrigkeit
    mit Geldbuße bis zu fünfhunderttausend Euro (s 41 Abs 1 Nr 3, Abs 2). Das Register safety_incident kennt keinen Fund,
    deshalb ist die Zuordnung ein Näherungswert.
- key: approvals.archaeological_dig_permit.de-nw
  duty: Vor dem Graben nach Bodendenkmälern oder deren Bergung die Erlaubnis der Oberen Denkmalbehörde einholen, vor dem
    Beseitigen oder Verändern eines Bodendenkmals oder Maßnahmen in seiner engeren Umgebung, die sich auswirken können,
    die Erlaubnis der Unteren Denkmalbehörde
