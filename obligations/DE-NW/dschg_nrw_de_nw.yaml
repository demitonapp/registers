  clause: s 15 Abs 1 bis 6; s 24 Abs 1, 4, 5; s 41 Abs 1 Nr 2, Abs 2
  caveat: Absatz 1 steht in der seit 1. September 2026 geltenden Fassung. Der Erlaubnis der Oberen Denkmalbehörde bedürfen
    das Verwenden von Mess- und Suchgeräten, die Bodendenkmäler auffinden können, das Graben nach Bodendenkmälern und die
    Bergung (Abs 1 Nr 1 bis 3); ausgenommen sind Nachforschungen unter Verantwortung des Landes, der Denkmalbehörden oder
    der Denkmalfachämter. Der Erlaubnis der Unteren Denkmalbehörde bedarf, wer ein Bodendenkmal oder einen Teil beseitigen,
    verändern, an einen anderen Ort verbringen oder dessen bisherige Nutzung ändern will, und wer in der engeren Umgebung
    Anlagen errichten, verändern oder beseitigen oder andere Maßnahmen durchführen will, wenn sich das auf die denkmalwerte
    Substanz oder das Erscheinungsbild auswirken kann (Abs 2). Sie ist zu erteilen, wenn Belange des Denkmalschutzes nicht
    entgegenstehen oder ein überwiegendes öffentliches Interesse die Maßnahme verlangt (Abs 3). Die Erlaubnis nach Abs 1
    S 1 wird nur bei erforderlicher Zuverlässigkeit erteilt (Abs 4), kann mit Auflagen und Bedingungen erteilt werden (Abs
    5) und ist bei der Durchführung im Original oder in Kopie mitzuführen (Abs 6). Der Antrag ist in Textform bei der zuständigen
    Denkmalbehörde zu stellen (s 24 Abs 1); die Entscheidung in Angelegenheiten des Bodendenkmalschutzes ergeht im Benehmen
    mit dem zuständigen Landschaftsverband, das als hergestellt gilt, wenn nicht innerhalb von zwei Monaten eine Äußerung
    vorliegt (s 24 Abs 4); die Behörde kann die Entscheidung für höchstens ein Jahr aussetzen (s 24 Abs 5). Maßnahmen ohne
    die Erlaubnis oder abweichend von ihr sind eine Ordnungswidrigkeit mit Geldbuße bis zu fünfhunderttausend Euro (s 41
    Abs 1 Nr 2). Die Behörde kann bei unerlaubten Handlungen die Einstellung der Arbeiten anordnen und die Baustelle versiegeln
    (s 25 Abs 1, 2). Kein Fenster, weil das Gesetz für die Antragsentscheidung keine feste Dauer nennt. Das Register compliance_documents
    kann die Erlaubnis enthalten, nicht aber den Bezug zu den Erdarbeiten, deshalb not_collected.
