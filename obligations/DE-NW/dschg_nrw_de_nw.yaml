  clause: s 27 Abs 1, 2
  caveat: Die Pflicht trifft den, der eine Erlaubnis nach s 9, 13, 15 oder 20 braucht oder ein in die Denkmalliste eingetragenes
    Denkmal oder Bodendenkmal sonst verändert oder beseitigt, also den Veranlasser, im Regelfall den Bauherrn. Ob der Bauvertrag
    die Kosten dem Auftragnehmer überträgt, steht nicht im Gesetz. Das Nähere regelt die Erlaubnis durch Nebenbestimmungen,
    in anderen Fällen ein Verwaltungsakt (Abs 1 S 2). Die Behörde kann bestimmen, dass der Betroffene die voraussichtlichen
    Kosten im Voraus zahlt; zahlt er nicht fristgerecht, können sie im Verwaltungszwangsverfahren beigetrieben werden (Abs
    2). "Im Rahmen des Zumutbaren" ist nicht beziffert. Kein Fenster; guidance, weil das Gesetz keine Folge nennt. Das Register
    job_budget führt Budgets, nicht den Kostenträger eines Fundes, deshalb not_collected.
- key: approvals.archaeological_find_handover.de-nw
  duty: Bewegliche Bodendenkmäler, die herrenlos oder so lange verborgen waren, dass der Eigentümer nicht mehr zu ermitteln
    ist, unverzüglich melden und übergeben; Funde, die der Anzeigepflicht unterliegen, dem Land und dem Denkmalfachamt unverzüglich
    bis zu sechs Monate zur Bergung, Auswertung und Erforschung überlassen
  consequence: offence
  protection_type: check
