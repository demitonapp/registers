# Ordnungsbehördliche Verordnung zur Verhütung von Schäden durch Kampfmittel (Kampfmittelverordnung des Landes Nordrhein-Westfalen, KampfmittelVO NRW) vom
# 12. November 2003 (GV. NRW. S. 685), geändert durch Artikel 12 der Verordnung vom 16. Juli 2013 (GV. NRW. S. 483) und durch die Verordnung vom 16. März 2022
# (GV. NRW. S. 354, in Kraft seit 1. Juni 2022). Nach der Änderung von 2022 tritt sie am 31. Dezember 2031 außer Kraft (s 7 Abs 2). In dieser Datei steht "s" für Paragraf.
#
# Quellenlage: Ich konnte auf recht.nrw.de keine konsolidierte Fassung öffnen. Der geltende Text ist aus der amtlichen Fassung von 2003 mit den Änderungen von 2013
# (recht.nrw.de/system/files/BH/5199-21392.htm, die Seite trägt den Vermerk "siehe Norm ab 01.06.2022") und der amtlichen Änderungsverordnung von 2022 (recht.nrw.de/gvnrw/2022-s354)
# zusammengesetzt; er stimmt mit der konsolidierten Fassung vom 31.05.2022 auf lexaris.de überein, die ich nur zum Abgleich gelesen habe. Eine Änderung nach dem 1. Juni 2022 ist
# damit nicht ausgeschlossen; die Fußnoten der amtlichen Seite nennen keine. Die Zeilen tragen deshalb die URL der Fassung, aus der der Wortlaut stammt.
#
# Kampfmittel sind gewahrsamslos gewordene Gegenstände militärischer Herkunft aus der Zeit bis zum Ende des zweiten Weltkrieges und Teile solcher Gegenstände, die
# Explosivstoffe oder Kampfstoffe, Nebelstoffe, Brandkampfstoffe oder Reizstoffe enthalten (s 1 Abs 2). Das Land unterhält den staatlichen Kampfmittelbeseitigungsdienst bei den
# Bezirksregierungen Arnsberg und Düsseldorf (s 1 Abs 1). Die Verordnung gilt nicht für die Bundeswehr, die Stationierungsstreitkräfte, die Polizeien des Bundes und des Landes
# und die Kontrolleinheiten der Hauptzollämter (s 6 Abs 1). Die Verordnung nennt keine Frist in Tagen.
