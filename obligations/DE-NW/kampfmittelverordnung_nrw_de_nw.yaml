  clause: s 2; s 4; s 5 Abs 1 Nr 1, 6, Abs 2
  caveat: Wortlaut von s 2 stammt aus der Fassung der Verordnung von 2013 (die Änderung von 2022 berührt ihn nicht). Das
    Betreten von Flächen, auf denen Kampfmittel entdeckt worden sind, ist nur den Angehörigen der für die Gefahrenabwehr
    zuständigen Behörden und den Stellen gestattet, die die Bezirksregierung mit der Beseitigung beauftragt hat (s 4). Wer
    die Entdeckung oder den Besitz nicht oder nicht unverzüglich anzeigt oder die Fläche betritt, handelt ordnungswidrig
    (s 5 Abs 1 Nr 1, 6). Die Geldbuße beträgt in diesen Fällen bis zu tausend Euro; geschieht es im Rahmen einer gewerblichen
    Tätigkeit, kann sie bis zu fünfundzwanzigtausend Euro betragen (s 5 Abs 2, nach der Änderungsverordnung von 2022, GV.
    NRW. S. 354, recht.nrw.de/gvnrw/2022-s354). "Unverzüglich" hat keine Zahl, deshalb kein Fenster. Das Register safety_incident
    ist das nächstliegende für ein Ereignis auf der Baustelle; es kennt keine Kampfmittel, deshalb ist die Zuordnung ein
    Näherungswert.
- key: approvals.ordnance_handling_ban.de-nw
  duty: Kampfmittel nicht suchen, sammeln, bearbeiten oder sonst behandeln, es sei denn, die Bezirksregierung hat mit der
    Beseitigung beauftragt, oder die Ausnahme für Bohrlochdetektion und baubegleitende Räumung durch Räumfirmen mit Erlaubnis
    nach dem Sprengstoffgesetz greift
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: approvals.ordnance_handling_ban
  severity: 3
  grade: primary_read
  citation:
    url: https://recht.nrw.de/gvnrw/2022-s354
    clause: s 3 Abs 1, 2; s 5 Abs 1 Nr 2, Abs 2
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: safety_incident
  clause: s 3 Abs 1, 2; s 5 Abs 1 Nr 2, Abs 2
  caveat: Wortlaut von Abs 2 und der Bußgeldregel nach der Änderungsverordnung von 2022 (GV. NRW. S. 354, Art 1 Nr 3 und
    4). Suchen, Sammeln, Bearbeiten und sonstiges Behandeln sowie der Besitz sind nur den Stellen gestattet, die die Bezirksregierung
    mit der Beseitigung beauftragt hat (Abs 1). Ausgenommen sind Bohrlochdetektionen im Rahmen von Spezialtiefbaumaßnahmen
    einschließlich der Öffnung der daraus folgenden Verdachtsmomente und die baubegleitende Kampfmittelräumung in Bereichen,
    die vorab nicht mit anerkannten Detektionsverfahren ergebnisorientiert untersucht werden konnten, jeweils durch Räumfirmen
    mit Berechtigung nach den s 7, 9, 19 und 20 des Sprengstoffgesetzes (Abs 2 Nr 1, 2). Die Tätigkeiten dürfen nur auf
    Flächen erfolgen, für die nach Einschätzung des staatlichen Kampfmittelbeseitigungsdienstes keine konkreten Hinweise
    auf eine Kampfmittelbelastung vorliegen, mit einem Mindestabstand von 10 Metern zu Bereichen mit konkreten Belastungshinweisen.
    Ein Bauunternehmen ohne diese Berechtigung darf Kampfmittel also nicht selbst behandeln, auch nicht zum Abräumen. Verstoß
    ist eine Ordnungswidrigkeit mit Geldbuße bis zu tausend Euro, im Rahmen einer gewerblichen Tätigkeit bis zu fünfundzwanzigtausend
    Euro (s 5 Abs 1 Nr 2, Abs 2). Kein Fenster. Das Register safety_incident kennt keine Kampfmittel, deshalb ist die Zuordnung
    ein Näherungswert.
