obligations:
- key: workforce.construction_minimum_terms.de-aentg
  duty: Den Arbeitnehmern mindestens die im erstreckten Tarifvertrag des Bauhaupt- oder Baunebengewerbes für den Beschäftigungsort
    vorgeschriebenen Arbeitsbedingungen gewähren und der gemeinsamen Einrichtung der Tarifvertragsparteien die ihr zustehenden
    Beiträge leisten
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: payments
