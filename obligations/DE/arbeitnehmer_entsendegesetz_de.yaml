# Gesetz über zwingende Arbeitsbedingungen für grenzüberschreitend entsandte und für regelmäßig im Inland beschäftigte Arbeitnehmer und
# Arbeitnehmerinnen (Arbeitnehmer-Entsendegesetz, AEntG) vom 20. April 2009 (BGBl. I S. 799), zuletzt geändert durch Art. 8 Abs. 4 G v.
# 12.5.2026 (BGBl. 2026 I Nr. 137). Gelesen auf gesetze-im-internet.de am 18. Oktober 2026: s 4, 5 (Anfang), 7, 8, 13, 14 und 23. In dieser
# Datei steht "s" für Paragraf.
#
# Das Gesetz erstreckt Tarifverträge des Bauhauptgewerbes und des Baunebengewerbes (s 4 Abs 1 Nr 1) durch Rechtsverordnung (s 7) auf alle
# Arbeitgeber der Branche. Die Branchenverordnung selbst und die Höhe des Mindestentgelts habe ich nicht gelesen. Die "gemeinsame Einrichtung der
# Tarifvertragsparteien" (s 8 Abs 1 S 1, s 14) ist im Baugewerbe in der Praxis die Sozialkasse der Bauwirtschaft; der Name steht nicht im
# Gesetzestext. Die Meldepflichten für Arbeitgeber mit Sitz im Ausland (s 18) und die Prüfung durch die Zollverwaltung (s 16, 17, 19) habe ich nicht
# gelesen. Das Gesetz zählt in diesen Paragrafen keine Fristen in Tagen.
