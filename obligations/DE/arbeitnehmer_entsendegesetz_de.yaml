  clause: s 23 Abs 2, 3
  caveat: 'Bindet den Unternehmer, der einen anderen Unternehmer beauftragt. Ordnungswidrig handelt auch, wer fahrlässig
    nicht weiß; die Geldbuße beträgt bis zu fünfhunderttausend Euro (Abs 3). Das Gesetz nennt nicht, was "in erheblichem
    Umfang" heißt. Zwei Fälle: der beauftragte Unternehmer gewährt die Bedingungen nicht oder leistet Beiträge nicht, oder
    er setzt einen Nachunternehmer ein oder lässt ihn tätig werden, der es nicht tut. Das Mindestlohngesetz hat denselben
    Tatbestand für den Mindestlohn (s 21 Abs 2 MiLoG, siehe mindestlohngesetz_de). Kein Fenster. Das Register compliance_documents
    hält die Prüfung eines Nachunternehmers nicht fest, deshalb not_collected.'
