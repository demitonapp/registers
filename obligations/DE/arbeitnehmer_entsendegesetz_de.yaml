  clause: s 8 Abs 1, 2, 3; s 4 Abs 1 Nr 1; s 23 Abs 1 Nr 1, Abs 3
  caveat: Bindet jeden Arbeitgeber mit Sitz im In- oder Ausland, der unter den Geltungsbereich eines für allgemeinverbindlich
    erklärten Tarifvertrags nach s 3 S 1 Nr 1 oder einer Rechtsverordnung nach s 7 oder s 7a fällt, unabhängig davon, ob
    er tarifgebunden ist (s 8 Abs 1 S 2). Hat der Arbeitgeber einen anderen Tarifvertrag, gilt der erstreckte dennoch (Abs
    2). Beim Einsatz von Leiharbeitnehmern trifft die Pflicht den Verleiher (Abs 3). Die Arbeitsbedingungen, die ein Tarifvertrag
    regeln kann, nennt s 5, unter anderem Mindestentgeltsätze, Urlaubsdauer, Urlaubsentgelt und Urlaubsgeld. Wer eine Arbeitsbedingung,
    deren Einhaltung die Zollverwaltung nach s 16 prüft, nicht oder nicht rechtzeitig gewährt oder einen Beitrag nicht oder
    nicht rechtzeitig leistet, handelt ordnungswidrig; die Geldbuße beträgt bis zu fünfhunderttausend Euro (s 23 Abs 1 Nr
    1, Abs 3). Welcher Tarifvertrag in der Branche erstreckt ist und was er verlangt, habe ich nicht gelesen. Kein Fenster;
    das Gesetz nennt die Fälligkeit nicht. Das Register payroll_run führt Lohnläufe, nicht den Tarif des Beschäftigungsorts,
    deshalb not_collected.
- key: workforce.subcontractor_wage_liability.de-aentg
  duty: Wie ein Bürge, der auf die Einrede der Vorausklage verzichtet hat, für die Pflicht des beauftragten Unternehmers,
    eines Nachunternehmers oder eines beauftragten Verleihers haften, das Mindestentgelt zu zahlen und die Beiträge an die
    gemeinsame Einrichtung der Tarifvertragsparteien zu leisten
  consequence: liable_full_amount
  protection_type: check
  disease: non_compliance
  approval_class: payments
  duty_shape: workforce.subcontractor_wage_liability
  severity: 4
  grade: primary_read
  citation:
    url: https://www.gesetze-im-internet.de/aentg_2009/__14.html
    clause: s 14
    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: compliance_documents
  clause: s 14
  caveat: Bindet jeden Unternehmer, der einen anderen Unternehmer mit Werk- oder Dienstleistungen beauftragt, also den Auftragnehmer
    gegenüber seinen Nachunternehmern und die Kette bis zum letzten Glied. Das Mindestentgelt umfasst nur den Nettobetrag
    nach Abzug der Steuern und der Beiträge zur Sozialversicherung und zur Arbeitsförderung (Satz 2); die Haftung für die
    Beiträge an die gemeinsame Einrichtung steht daneben. Ob ein Bauherr, der für den Eigenbedarf bauen lässt, als "Unternehmer"
    haftet, sagt der Wortlaut nicht; die Rechtsprechung dazu habe ich nicht gelesen. Das Gesetz nennt keine Frist, innerhalb
    derer der Auftraggeber prüfen muss; der Wortlaut verlangt kein Verschulden. Einen Entlastungsnachweis nennt der Text
    nicht. Das Mindestlohngesetz wendet s 14 für den Mindestlohn entsprechend an (siehe mindestlohngesetz_de). Das Register
    compliance_documents kann Nachweise der Nachunternehmer enthalten, nicht deren Zahlung, deshalb not_collected.
- key: workforce.subcontractor_wage_diligence.de-aentg
  duty: Keine Werk- oder Dienstleistungen in erheblichem Umfang von einem Unternehmer ausführen lassen, von dem man weiß
    oder fahrlässig nicht weiß, dass er oder sein Nachunternehmer die vorgeschriebenen Arbeitsbedingungen nicht oder nicht
    rechtzeitig gewährt oder Beiträge nicht leistet
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: payments
