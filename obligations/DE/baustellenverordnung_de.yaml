# Verordnung über Sicherheit und Gesundheitsschutz auf Baustellen (Baustellenverordnung, BaustellV) vom 10. Juni 1998
# (BGBl. I S. 1283), zuletzt geändert durch Art. 2 V v. 17.12.2025 (BGBl. 2025 I Nr. 337). Gelesen auf gesetze-im-internet.de am
# 18. Oktober 2026: s 1 bis 8 und die Anhänge I und II. In dieser Datei steht "s" für Paragraf.
#
# Wen die Verordnung bindet: Die Maßnahmen nach s 2 und s 3 Abs 1 S 1 hat der Bauherr zu treffen, es sei denn, er beauftragt einen Dritten,
# sie in eigener Verantwortung zu treffen (s 4). Ein Auftragnehmer ist an die Zeilen zu s 2 und s 3 nur gebunden, wenn der Bauherr ihm diese
# Maßnahmen übertragen hat (zum Beispiel einem Generalunternehmer oder Projektsteuerer); die Beauftragung entbindet den Bauherrn nicht
# (s 3 Abs 1a). s 5 und s 6 binden jeden Arbeitgeber und jeden Unternehmer ohne Beschäftigte unmittelbar. Die Verordnung nennt keine Frist
# in Werktagen; "zwei Wochen" (s 2 Abs 2) sind 14 Tage. Die zuständige Behörde für die Vorankündigung bestimmt das Landesrecht; sie steht
# nicht in der Verordnung und ich habe sie nicht nachgeschlagen. Die Höhe der Geldbuße steht im Arbeitsschutzgesetz (s 25), das ich nicht
# gelesen habe.
