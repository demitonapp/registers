    kind: record_in_demiton
    register: contract_notice
  clause: s 648a Abs 1 bis 6; s 314 Abs 2, 3; s 650h
  caveat: Bindet jede Partei, die kündigt; für den Unternehmer ist es das Recht, bei Zahlungs- oder Mitwirkungsverzug des
    Bestellers zu kündigen, und die Pflicht, als Besteller einen Nachunternehmer richtig zu kündigen. Beide Parteien können
    ohne Kündigungsfrist aus wichtigem Grund kündigen, wenn ihnen die Fortsetzung bis zur Fertigstellung nicht zugemutet
    werden kann (s 648a Abs 1); auch teilweise, für einen abgrenzbaren Teil des Werks (Abs 2). Liegt der Grund in einer
    Pflichtverletzung, ist die Kündigung erst nach erfolglosem Ablauf einer Abhilfefrist oder nach erfolgloser Abmahnung
    zulässig (s 314 Abs 2 S 1, über s 648a Abs 3); sie ist entbehrlich unter den Voraussetzungen von s 323 Abs 2 Nr 1 und
    2 (nicht gelesen) und bei besonderen Umständen (s 314 Abs 2 S 2, 3). Der Berechtigte kann nur innerhalb einer angemessenen
    Frist nach Kenntnis des Grundes kündigen (s 314 Abs 3); das Gesetz nennt keine Zahl. Die Kündigung bedarf der schriftlichen
    Form (s 650h). Nach der Kündigung kann jede Partei eine gemeinsame Feststellung des Leistungsstands verlangen; wer nicht
    mitwirkt oder einen Termin versäumt, trägt die Beweislast für den Stand bei Kündigung, außer er bleibt aus einem nicht
    zu vertretenden, unverzüglich mitgeteilten Grund fern (Abs 4). Bei Kündigung aus wichtigem Grund kann der Unternehmer
    nur die Vergütung für den bis dahin erbrachten Teil verlangen (Abs 5); Schadensersatz bleibt unberührt (Abs 6). Barred
    ist die nächstliegende Einordnung der unzulässigen Kündigung (Einordnung nach eigenem Urteil). Die VOB/B regelt die
    Kündigung durch den Unternehmer gesondert (siehe vob_b_2016_de, s 9).
