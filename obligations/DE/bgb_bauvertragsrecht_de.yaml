  clause: s 650f Abs 5
  caveat: Bindet den Unternehmer, der fordert. Erst nach erfolglosem Ablauf einer angemessenen Frist darf er die Leistung
    verweigern oder den Vertrag kündigen (Abs 5 S 1); ohne Fristsetzung fehlt die Voraussetzung, deshalb barred (Einordnung
    nach eigenem Urteil). Das Gesetz nennt keine Zahl, deshalb kein Fenster. Kündigt er, ist er berechtigt, die vereinbarte
    Vergütung zu verlangen, muss sich aber Ersparnisse und anderweitigen Erwerb anrechnen lassen (S 2); vermutet wird, dass
    ihm 5 Prozent der auf den nicht erbrachten Teil entfallenden Vergütung zustehen (S 3). Die Ausnahmen aus s 650f Abs
    6 gelten auch hier. Die Kündigung bedarf der schriftlichen Form (s 650h). Im Register contract_notice ist notice_kind
    suspension die nächstliegende Art (Verweigerung der Leistung).
