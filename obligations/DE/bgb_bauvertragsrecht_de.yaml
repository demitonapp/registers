  clause: s 650f Abs 1 bis 4, 6, 7
  caveat: Bindet den Unternehmer, der fordert, bei einem Bauvertrag nach s 650a. Erfasst sind auch in Zusatzaufträgen vereinbarte
    Vergütungen (Abs 1 S 1); der Anspruch besteht trotz Erfüllungsverlangen oder Abnahme (S 3). Gegenansprüche, mit denen
    aufgerechnet werden kann, zählen nur, wenn sie unstreitig oder rechtskräftig festgestellt sind (S 4). Die Sicherheit
    kann auch durch Garantie oder Zahlungsversprechen eines Kreditinstituts oder Kreditversicherers geleistet werden, das
    nur zahlen darf, soweit der Besteller die Vergütung anerkennt oder durch vorläufig vollstreckbares Urteil verurteilt
    ist (Abs 2). Der Unternehmer erstattet die üblichen Kosten bis zu 2 Prozent für das Jahr, nicht soweit die Sicherheit
    wegen unbegründeter Einwendungen des Bestellers aufrechterhalten werden muss (Abs 3). Hat er eine Sicherheit erlangt,
    ist die Sicherungshypothek nach s 650e ausgeschlossen (Abs 4). Der Anspruch besteht nicht gegen juristische Personen
    des öffentlichen Rechts und öffentlich-rechtliche Sondervermögen, über deren Vermögen ein Insolvenzverfahren unzulässig
    ist, und nicht gegen Verbraucher bei einem Verbraucherbauvertrag (s 650i) oder Bauträgervertrag (s 650u); beide Vorschriften
    habe ich nicht gelesen (Abs 6). Eine abweichende Vereinbarung ist unwirksam (Abs 7). Das Gesetz sagt "kann verlangen"
    und nennt für das Unterlassen keine Folge, deshalb guidance. Kein Fenster. Das Register bank_guarantee führt Sicherheiten,
    die richtungsweise unterscheiden.
