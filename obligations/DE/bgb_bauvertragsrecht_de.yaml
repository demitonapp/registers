# Bürgerliches Gesetzbuch (BGB), Werkvertrags- und Bauvertragsrecht, Paragraf für Paragraf gelesen auf
# gesetze-im-internet.de (Bundesministerium der Justiz) am 18. Oktober 2026. Gelesen: s 187, 188, 193, 271a, 286, 288,
# 314, 631, 632a, 634, 634a, 640, 641, 642, 643, 648, 648a, 650a bis 650h, 650k und 650m. Stand laut Gesetzesseite:
# neugefasst durch Bek. v. 2.1.2002, zuletzt geändert durch Art. 6 G v. 23.7.2026 I Nr. 226. Welche Paragrafen dieses
# Änderungsgesetz berührt, habe ich nicht geprüft; keiner der gelesenen Paragrafen trägt einen Fußnotenhinweis auf eine
# künftige Änderung. In dieser Datei steht "s" für Paragraf.
#
# Wen die Zeilen binden: Das Werkvertragsrecht des BGB gilt kraft Gesetzes für jeden Werk- und Bauvertrag, auch wenn die
# VOB/B vereinbart ist, soweit diese nichts anderes regelt. Jede Zeile sagt in der Caveat, ob die Pflicht den Unternehmer
# trifft, der fordert (Auftragnehmer), oder den Unternehmer als Besteller gegenüber seinem Nachunternehmer. Die Vorschriften
# des Bauvertragsrechts (s 650a bis 650h) gelten nur für einen Bauvertrag im Sinne von s 650a. Der Verbraucherbauvertrag und
# der Bauträgervertrag (s 650i bis 650v) sind nicht in Zeilen gefasst; s 650k und 650m habe ich gelesen, sie tragen keine Zeile.
#
# Fristen: Das BGB zählt Tage als Kalendertage; keiner der gelesenen Paragrafen setzt eine Frist in Werktagen. Der Tag des
# Ereignisses zählt nicht mit (s 187 Abs 1); eine Tagesfrist endet mit Ablauf ihres letzten Tages (s 188 Abs 1). Fällt der
# letzte Tag einer Frist, innerhalb derer eine Erklärung abzugeben oder eine Leistung zu bewirken ist, auf einen Samstag,
# Sonntag oder einen am Leistungsort staatlich anerkannten Feiertag, tritt der nächste Werktag an seine Stelle (s 193).
# Die Bibliothek enthält keinen deutschen Feiertagskalender.
#
# Nicht in Zeilen gefasst, obwohl gelesen: s 271a (Zahlungsfristen über 60 Tage, Abschlagszahlungen ausgenommen), s 641 Abs 2
# (Fälligkeit bei Weitergabe an einen Dritten), s 642 und 643 (Entschädigung und Kündigung bei unterlassener Mitwirkung),
# s 648 (freie Kündigung des Bestellers) und s 650e (Sicherungshypothek). Sie sind Rechte oder Folgen, keine eigene Pflicht
# mit einem Fenster, das die Bibliothek verfolgen könnte; soweit eine Zeile sie berührt, nennt ihre Caveat sie.
id: bgb_bauvertragsrecht_de
lang: de
source: law
instrument_type: act
title: 'Bürgerliches Gesetzbuch (BGB): Werkvertrags- und Bauvertragsrecht (Abschlagszahlung, Änderung, Abnahme, Kündigung,
  Sicherheit, Verjährung)'
publisher: Bundesrepublik Deutschland (Bundesministerium der Justiz, Gesetze im Internet)
