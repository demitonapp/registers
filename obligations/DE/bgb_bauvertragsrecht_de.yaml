  clause: s 634a Abs 1 Nr 1, 2, Abs 2, 3
  window:
    value: 60
    unit: months
  caveat: Bindet den Unternehmer als Schuldner der Mängelansprüche. Die Ansprüche auf Nacherfüllung, Selbstvornahme und
    Schadensersatz (s 634 Nr 1, 2 und 4) verjähren in fünf Jahren bei einem Bauwerk und bei Planungs- oder Überwachungsleistungen
    dafür (Abs 1 Nr 2), in zwei Jahren bei anderen Werken, deren Erfolg in der Herstellung, Wartung oder Veränderung einer
    Sache besteht (Nr 1). Die Verjährung beginnt mit der Abnahme (Abs 2); bei Arglist gilt die regelmäßige Verjährungsfrist
    (s 195 und 199, nicht gelesen), im Falle der Nr 2 aber nicht vor Ablauf der fünf Jahre (Abs 3). Rücktritt und Minderung
    unterliegen s 218 (Abs 4, 5). Die Parteien können vereinbaren, was das Gesetz zulässt; die VOB/B setzt vier Jahre (siehe
    vob_b_2016_de, s 13 Abs 4). 60 Monate sind fünf Jahre. Der trigger practical_completion_reached steht für die Abnahme
    und ist nur eine Näherung; die Abnahme kann später liegen. Kein Register hält das Abnahmedatum, deshalb not_collected
    (project_milestone ist am nächsten).
