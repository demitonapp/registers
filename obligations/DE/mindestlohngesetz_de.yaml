  clause: s 1 Abs 1, 2, 3; s 2 Abs 1; s 20; s 21 Abs 1 Nr 13, Abs 3
  caveat: 'Bindet jeden Arbeitgeber mit Sitz im In- oder Ausland (s 20). Jede Arbeitnehmerin und jeder Arbeitnehmer hat
    Anspruch auf ein Arbeitsentgelt mindestens in Höhe des Mindestlohns (s 1 Abs 1). Fällig ist er zum vereinbarten Zeitpunkt,
    spätestens am letzten Bankarbeitstag (Frankfurt am Main) des Folgemonats (s 2 Abs 1 S 1 Nr 1, 2); Überstunden auf einem
    schriftlich vereinbarten Arbeitszeitkonto sind innerhalb von zwölf Kalendermonaten auszugleichen, monatlich höchstens
    50 Prozent der vertraglichen Arbeitszeit (s 2 Abs 2). Wer das Entgelt nicht oder nicht rechtzeitig zahlt, handelt ordnungswidrig
    mit einer Geldbuße bis zu fünfhunderttausend Euro (s 21 Abs 1 Nr 13, Abs 3). Das Fenster steht nicht in der Zeile: die
    Frist ist der Monatsletzte des Folgemonats, nicht ein Monat ab der Arbeitsleistung. Den Betrag des Mindestlohns und
    die Branchenmindestlöhne enthält die Zeile nicht (siehe Kopf der Datei). Das Register payroll_run führt Lohnläufe, nicht
    den Mindestlohn oder dessen Fälligkeit, deshalb not_collected.'
- key: workforce.subcontractor_wage_liability.de-milog
  duty: Wie ein Bürge, der auf die Einrede der Vorausklage verzichtet hat, dafür haften, dass der beauftragte Unternehmer,
    sein Nachunternehmer oder dessen Verleiher den Mindestlohn zahlt
  consequence: liable_full_amount
