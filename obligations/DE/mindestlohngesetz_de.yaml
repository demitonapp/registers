# Gesetz zur Regelung eines allgemeinen Mindestlohns (Mindestlohngesetz, MiLoG) vom 11. August 2014 (BGBl. I S. 1348), zuletzt geändert
# durch Art. 8 Abs. 3 G v. 12.5.2026 (BGBl. 2026 I Nr. 137). Gelesen auf gesetze-im-internet.de am 18. Oktober 2026: s 1, 2, 13, 14, 20 und 21.
# In dieser Datei steht "s" für Paragraf.
#
# Die Höhe des Mindestlohns steht in s 1 Abs 2 S 1 mit 12 Euro je Zeitstunde seit dem 1. Oktober 2022; s 1 Abs 2 S 2 lässt die Mindestlohnkommission eine
# Änderung durch Rechtsverordnung vorschlagen, und die Fußnote nennt Anpassungen durch V v. 24.11.2023 I Nr. 321 und V v. 5.11.2025 I Nr. 268. Die
# Verordnungen habe ich nicht gelesen; der heute geltende Betrag steht in keiner Zeile. Branchenmindestlöhne nach dem Arbeitnehmer-Entsendegesetz gehen
# vor, soweit sie den Mindestlohn nicht unterschreiten (s 1 Abs 3; siehe arbeitnehmer_entsendegesetz_de).
