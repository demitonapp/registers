    kind: not_collected
    register: compliance_documents
  clause: s 13 MiLoG; s 14 AEntG; s 21 Abs 2, 3
  caveat: Bindet jeden Unternehmer, der einen anderen Unternehmer mit Werk- oder Dienstleistungen beauftragt. s 13 MiLoG
    sagt nur, dass s 14 des Arbeitnehmer-Entsendegesetzes entsprechende Anwendung findet; den Inhalt habe ich in s 14 AEntG
    gelesen (Bürgenhaftung ohne Einrede der Vorausklage, Mindestentgelt nur als Nettobetrag nach Abzug der Steuern und Sozialbeiträge).
    Wie die Verweisung auf den Mindestlohn zu übertragen ist, insbesondere das Wort "Beiträge an eine gemeinsame Einrichtung",
    die im Mindestlohn fehlen, ist meine Auslegung; die Rechtsprechung habe ich nicht gelesen. Ordnungswidrig handelt außerdem,
    wer Werk- oder Dienstleistungen in erheblichem Umfang ausführen lässt, indem er einen Unternehmer beauftragt, von dem
    er weiß oder fahrlässig nicht weiß, dass er oder sein Nachunternehmer den Mindestlohn nicht oder nicht rechtzeitig zahlt;
    die Geldbuße beträgt bis zu fünfhunderttausend Euro (s 21 Abs 2, 3). Kein Fenster. Das Register compliance_documents
    hält die Zahlung der Nachunternehmer nicht fest, deshalb not_collected.
