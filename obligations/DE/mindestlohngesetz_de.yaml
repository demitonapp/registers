- key: workforce.minimum_wage.de-milog
  duty: Jedem im Inland beschäftigten Arbeitnehmer mindestens den Mindestlohn zahlen, spätestens am letzten Bankarbeitstag
    (Frankfurt am Main) des Monats, der auf den Monat der Arbeitsleistung folgt
