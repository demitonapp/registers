  citation:
    url: https://dejure.org/gesetze/VOB-B/12.html
    clause: s 12 Abs 1 bis 4, Abs 5 Nr 1 und 2, Abs 6
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 12 Abs 1 bis 4, Abs 5 Nr 1 und 2, Abs 6
  window:
    value: 14
    unit: days
  caveat: 'Bindet den Auftragnehmer, der fordert. Verlangt er nach Fertigstellung die Abnahme, hat der Auftraggeber sie
    binnen 12 Werktagen durchzuführen; eine andere Frist kann vereinbart werden (Abs 1). In sich abgeschlossene Teile sind
    auf Verlangen besonders abzunehmen (Abs 2). Wegen wesentlicher Mängel kann die Abnahme bis zur Beseitigung verweigert
    werden (Abs 3). Eine förmliche Abnahme findet statt, wenn eine Partei es verlangt; in die Niederschrift gehören Vorbehalte
    wegen bekannter Mängel und Vertragsstrafen und Einwendungen des Auftragnehmers (Abs 4 Nr 1). Wird keine Abnahme verlangt,
    gilt die Leistung als abgenommen mit Ablauf von 12 Werktagen nach schriftlicher Mitteilung über die Fertigstellung (Abs
    5 Nr 1); hat der Auftraggeber die Leistung in Benutzung genommen, nach 6 Werktagen nach Beginn der Benutzung, wenn nichts
    anderes vereinbart ist (Nr 2 S 1); die Benutzung von Teilen zur Weiterführung der Arbeiten ist keine Abnahme (S 2).
    Mit der Abnahme geht die Gefahr auf den Auftraggeber über (Abs 6). Werktage: 12 Werktage sind 14 Kalendertage, wenn
    kein gesetzlicher Feiertag hineinfällt, und jeder Feiertag verlängert die Frist um einen Tag; wer auf die Fiktion baut,
    darf den 14. Tag nur annehmen, wenn kein Feiertag in der Frist liegt (das Fenster kann also zu früh enden). Der trigger
    practical_completion_reached steht für die Fertigstellungsmitteilung und ist nur eine Näherung. Der Text nennt für den
    Fristablauf keine Strafe, deshalb guidance. Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.'
- key: closeout.acceptance_reservation.vob_b_2016
  duty: Vorbehalte wegen bekannter Mängel und wegen Vertragsstrafen bei der Abnahme erklären, spätestens zu den Zeitpunkten,
    zu denen die Abnahme nach s 12 Abs 5 als erfolgt gilt
