  citation:
    url: https://dejure.org/gesetze/VOB-B/16.html
    clause: s 16 Abs 1 Nr 1 bis 4
    access_date: '2026-10-18'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  clause: s 16 Abs 1 Nr 1 bis 4
  window:
    value: 21
    unit: days
  caveat: Bindet den Auftragnehmer, der fordert. Die Leistungen sind durch eine prüfbare Aufstellung nachzuweisen, die eine
    rasche und sichere Beurteilung ermöglicht (Nr 1 S 2); für eigens angefertigte Bauteile und angelieferte Stoffe gilt
    dasselbe, wenn dem Auftraggeber nach seiner Wahl das Eigentum übertragen oder entsprechende Sicherheit gegeben wird
    (S 3). Gegenforderungen können einbehalten werden; andere Einbehalte nur in den im Vertrag und in den gesetzlichen Bestimmungen
    vorgesehenen Fällen (Nr 2). Abschlagszahlungen sind ohne Einfluss auf die Haftung und gelten nicht als Abnahme von Teilen
    der Leistung (Nr 4). Der Auftraggeber kommt spätestens 30 Tage nach Zugang der Aufstellung in Zahlungsverzug (s 16 Abs
    5 Nr 3 S 3; siehe die Zeile payment.interest.de). Die 21 Tage laufen ab Zugang der Aufstellung; der trigger claim_lodged
    datiert die Abgabe der Forderung. Der Text nennt keine Folge der verspäteten Zahlung in dieser Nummer, deshalb guidance.
    Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: payment.final_due.vob_b_2016
  duty: Die Schlusszahlung spätestens 30 Tage nach Zugang der Schlussrechnung erhalten, bei ausdrücklich vereinbarter, sachlich
    gerechtfertigter Verlängerung höchstens 60 Tage; als Auftraggeber Einwendungen gegen die Prüfbarkeit bis zum Fristablauf
    erheben
  consequence: guidance
  protection_type: watch
