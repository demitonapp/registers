    clause: s 13 Abs 4 Nr 1, 3; Abs 5 Nr 1, 2
    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: project_milestone
  clause: s 13 Abs 4 Nr 1, 3; Abs 5 Nr 1, 2
  window:
    value: 48
    unit: months
  caveat: Bindet den Auftragnehmer. Ist für Mängelansprüche keine Verjährungsfrist im Vertrag vereinbart, beträgt sie für
    Bauwerke 4 Jahre, für andere Werke, deren Erfolg in der Herstellung, Wartung oder Veränderung einer Sache besteht, und
    für vom Feuer berührte Teile von Feuerungsanlagen 2 Jahre, für feuerberührte und abgasdämmende Teile industrieller Feuerungsanlagen
    1 Jahr (Abs 4 Nr 1); für Teile maschineller und elektrotechnischer Anlagen mit sicherheitsrelevanter Wartung 2 Jahre,
    wenn der Auftraggeber dem Auftragnehmer die Wartung nicht überträgt (Nr 2). Die Frist beginnt mit der Abnahme der gesamten
    Leistung, für in sich abgeschlossene Teile mit der Teilabnahme (Nr 3). Der Auftragnehmer beseitigt alle während der
    Frist hervortretenden, auf vertragswidrige Leistung zurückzuführenden Mängel auf seine Kosten, wenn der Auftraggeber
    es vor Ablauf der Frist schriftlich verlangt (Abs 5 Nr 1 S 1); der Anspruch verjährt in 2 Jahren ab Zugang des Verlangens,
    nicht vor Ablauf der Regelfrist, und für die Mängelbeseitigungsleistung beginnt nach ihrer Abnahme eine neue Frist von
    2 Jahren (S 2, 3). Kommt der Auftragnehmer in einer gesetzten angemessenen Frist nicht nach, kann der Auftraggeber die
    Mängel auf seine Kosten beseitigen lassen (Nr 2). Die gesetzliche Frist des BGB für ein Bauwerk beträgt fünf Jahre (siehe
    die Zeile closeout.warranty_period.de). 48 Monate sind vier Jahre. Der trigger practical_completion_reached steht für
    die Abnahme und ist nur eine Näherung. Kein Register hält das Abnahmedatum, deshalb not_collected. Gilt nur, wenn die
    Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: closeout.final_claim.vob_b_2016
  duty: Die Schlussrechnung prüfbar aufstellen und bei einer vertraglichen Ausführungsfrist von höchstens 3 Monaten spätestens
    12 Werktage nach Fertigstellung einreichen
  consequence: breach
