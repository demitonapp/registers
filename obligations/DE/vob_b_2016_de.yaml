# Vergabe- und Vertragsordnung für Bauleistungen Teil B (VOB/B): Allgemeine Vertragsbedingungen für die Ausführung von
# Bauleistungen, Ausgabe 2016 (Bekanntmachung vom 7. Januar 2016, BAnz AT 19.01.2016 B3, in Anwendung seit 18.4.2016).
# Paragraf 1 bis 18 gelesen auf dejure.org am 18. Oktober 2026, nicht in der amtlichen Ausgabe des Deutschen Vergabe- und
# Vertragsausschusses (DVA). In dieser Datei steht "s" für Paragraf.
#
# Welche Ausgabe gilt: Die Ausgabe 2016 ist die jüngste Fassung des Teils B, die ich fand. Nach einer Websuche am 18. Oktober
# 2026 haben die späteren Gesamtausgaben der VOB (2019 und die Änderungen von 2023, die Teil A betreffen) Teil B unverändert
# gelassen; die Bekanntmachungen im Bundesanzeiger habe ich nicht selbst geprüft. dejure.org vermerkt zur Fassung: "in Anwendung
# seit dem 18.4.2016 gem. s 2 Vergabeverordnung i.V.m. s 8a Abs. 1 VOB/A 2016"; die VOB/A habe ich nicht gelesen.
#
# Die VOB/B ist kein Gesetz, sondern eine Vertragsbedingung. Sie bindet nur, wenn die Parteien sie vereinbaren, und sie ändert das
# BGB-Werkvertragsrecht nur, soweit sie es regelt (siehe bgb_bauvertragsrecht_de). Jede Zeile gilt daher nur für einen Vertrag, der
# die VOB/B in der Ausgabe 2016 einbezieht, und sagt es in der Caveat. Wird die VOB/B nicht als Ganzes vereinbart oder weicht der
# Vertrag von ihr ab, unterliegen einzelne Klauseln nach meiner Kenntnis der Inhaltskontrolle für Allgemeine Geschäftsbedingungen;
# diese Rechtsprechung habe ich nicht gelesen. Die Rollen heißen Auftragnehmer (der Unternehmer) und Auftraggeber (der Besteller).
# Jede Zeile sagt, wen sie bindet: den Auftragnehmer, der fordert oder empfängt, oder den Unternehmer als Auftraggeber gegenüber seinem
# Nachunternehmer.
#
# Werktage: Die VOB/B definiert den Werktag nicht. s 11 Abs 3 zeigt mit der Regel, dass bei einer nach Wochen bemessenen Vertragsstrafe
# jeder Werktag einer angefangenen Woche als 1/6 Woche gerechnet wird, dass der Samstag mitzählt. Ob gesetzliche Feiertage ausgenommen
# sind, sagt der Text nicht; ich habe die Rechtsprechung nicht gelesen und nehme an, dass sie ausgenommen sind. Die Bibliothek hat keine
# Einheit "Werktage Montag bis Samstag". Die Fenster der Zeilen sind daher in Kalendertagen gesetzt: 6 Werktage sind 7 Kalendertage,
# 12 Werktage 14 und 18 Werktage 21, solange kein gesetzlicher Feiertag in die Frist fällt; jeder Feiertag verlängert die Frist um einen
# Tag. Die Bibliothek enthält keinen deutschen Feiertagskalender. Jede Zeile mit Werktagen sagt, in welche Richtung die Umrechnung irrt.
# Alle anderen Fristen der VOB/B sind Kalendertage, Wochen oder Monate, wie der Text sie nennt.
#
# Nicht in Zeilen gefasst, obwohl gelesen: s 1 (Art und Umfang der Leistung), s 3 (Ausführungsunterlagen), s 6 Abs 7 (Kündigung nach
# mehr als drei Monaten Unterbrechung), s 7 (Gefahrverteilung), s 8 Abs 1, 2, 4 und 5 (Kündigung durch den Auftraggeber außer s 8 Abs 3),
# s 10 (Haftung, außer Abs 2 Nr 1 S 2 in der Zeile zur Bedenkenanzeige), s 11 (Vertragsstrafe, außer Abs 4 in der Abnahme-Zeile), s 15 (Stundenlohnarbeiten) und s 18 (Streitigkeiten, außer Abs 5 in der Zeile zur Arbeitseinstellung).
