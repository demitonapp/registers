  citation:
    url: https://dejure.org/gesetze/VOB-B/17.html
    clause: s 17 Abs 1 Nr 2, Abs 2 bis 4, Abs 6 bis 8
    access_date: '2026-10-18'
  evidence:
    kind: register
    register: bank_guarantee
    system_type: finance
  clause: s 17 Abs 1 Nr 2, Abs 2 bis 4, Abs 6 bis 8
  window:
    value: 21
    unit: days
  caveat: 'Bindet den Auftragnehmer; Abs 6 und 8 binden den Unternehmer auch als Auftraggeber gegenüber seinem Nachunternehmer.
    Hat der Auftragnehmer die Sicherheit nicht geleistet, darf der Auftraggeber vom Guthaben einen Betrag in Höhe der vereinbarten
    Sicherheit einbehalten (Abs 7 S 2); guidance. Die Sicherheit dient der vertragsgemäßen Ausführung und den Mängelansprüchen
    (Abs 1 Nr 2). Der Auftragnehmer hat die Wahl unter den Arten und kann eine Sicherheit durch eine andere ersetzen (Abs
    3); wenn nichts anderes vereinbart ist, durch Einbehalt, Hinterlegung oder Bürgschaft eines in der Europäischen Gemeinschaft,
    im Europäischen Wirtschaftsraum oder einem Vertragsstaat des WTO-Beschaffungsübereinkommens zugelassenen Kreditinstituts
    oder Kreditversicherers (Abs 2). Die Bürgschaft ist schriftlich unter Verzicht auf die Einrede der Vorausklage abzugeben,
    darf nicht auf bestimmte Zeit begrenzt sein; der Auftraggeber kann keine Bürgschaft auf erstes Anfordern fordern (Abs
    4). Beim Einbehalt darf er die Zahlung um höchstens 10 Prozent kürzen, den Betrag dem Auftragnehmer mitteilen und binnen
    18 Werktagen nach der Mitteilung auf ein Sperrkonto einzahlen (Abs 6 Nr 1); zahlt er nicht rechtzeitig ein, kann der
    Auftragnehmer nach Nachfrist die sofortige Auszahlung verlangen und braucht dann keine Sicherheit mehr zu leisten (Nr
    3). Eine nicht verwertete Sicherheit für die Vertragserfüllung ist zum vereinbarten Zeitpunkt, spätestens nach Abnahme
    und Stellung der Sicherheit für Mängelansprüche, zurückzugeben (Abs 8 Nr 1), die für Mängelansprüche nach Ablauf von
    2 Jahren, wenn nichts anderes vereinbart ist (Nr 2), soweit nicht geltend gemachte Ansprüche noch offen sind. Werktage:
    18 Werktage sind 21 Kalendertage, wenn kein gesetzlicher Feiertag hineinfällt; das Fenster ist die Untergrenze. Gilt
    nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.'
