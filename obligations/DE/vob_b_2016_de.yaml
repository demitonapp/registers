    access_date: '2026-10-18'
  evidence:
    kind: register
    register: invoice_issued
    system_type: finance
  clause: s 14 Abs 1 bis 4
  window:
    value: 14
    unit: days
  caveat: 'Bindet den Auftragnehmer. Die Frist verlängert sich um je 6 Werktage für je weitere 3 Monate Ausführungsfrist,
    wenn nichts anderes vereinbart ist (Abs 3). Reicht der Auftragnehmer eine prüfbare Rechnung nicht ein, obwohl ihm der
    Auftraggeber eine angemessene Frist gesetzt hat, kann der Auftraggeber sie auf Kosten des Auftragnehmers selbst aufstellen
    (Abs 4); breach ist meine Einordnung dieser Folge (Einordnung nach eigenem Urteil). Die Rechnung ist übersichtlich aufzustellen,
    mit den Mengenberechnungen, Zeichnungen und anderen Belegen; Änderungen und Ergänzungen sind besonders kenntlich zu
    machen (Abs 1). Die notwendigen Feststellungen sind dem Fortgang entsprechend möglichst gemeinsam vorzunehmen, schwer
    feststellbare Leistungen rechtzeitig zu beantragen (Abs 2). Werktage: 12 Werktage sind 14 Kalendertage, wenn kein gesetzlicher
    Feiertag hineinfällt; das Fenster ist die Untergrenze für die Fristberechnung nach dem Text, jeder Feiertag verlängert
    sie. Der trigger practical_completion_reached steht für die Fertigstellung. Gilt nur, wenn die Parteien die VOB/B (Ausgabe
    2016) vereinbart haben.'
- key: payment.interim_due.vob_b_2016
  duty: Abschlagszahlungen auf Antrag in möglichst kurzen Zeitabständen oder zu den vereinbarten Zeitpunkten in Höhe des
    Wertes der nachgewiesenen vertragsgemäßen Leistungen erhalten; sie werden binnen 21 Tagen nach Zugang der Aufstellung
    fällig
  consequence: guidance
