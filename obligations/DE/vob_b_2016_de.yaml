  citation:
    url: https://dejure.org/gesetze/VOB-B/4.html
    clause: s 4 Abs 9
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 4 Abs 9
  caveat: 'Bindet den Auftragnehmer. Die Vergütung etwaiger Mehrkosten regelt sich nach s 2 Abs 6, setzt also die Ankündigung
    vor Ausführung voraus (siehe die Zeile variations.claim_announcement.vob_b_2016). Die Rechte des Entdeckers (s 984 BGB)
    hat der Auftraggeber. Das ist die vertragliche Anzeige an den Auftraggeber; die Anzeige an die Behörde und die Stillstandspflicht
    ergeben sich aus dem Denkmalrecht des Landes (siehe baydschg_de_by und dschg_nrw_de_nw). Kein Fenster: das Ereignis
    ist "vor jedem weiteren Aufdecken oder Ändern". Der Text nennt keine Folge, deshalb breach. Gilt nur, wenn die Parteien
    die VOB/B (Ausgabe 2016) vereinbart haben.'
- key: delay_eot.commencement.vob_b_2016
  duty: Innerhalb von 12 Werktagen nach Aufforderung mit der Ausführung beginnen, wenn keine Beginnfrist vereinbart ist,
    und den Beginn dem Auftraggeber anzeigen
  consequence: breach
  protection_type: watch
  disease: disputes
  approval_class: general
  duty_shape: delay_eot.commencement
  severity: 2
  grade: primary_read
  citation:
    url: https://dejure.org/gesetze/VOB-B/5.html
    clause: s 5 Abs 1 bis 4
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 5 Abs 1 bis 4
  window:
    value: 14
    unit: days
  caveat: 'Bindet den Auftragnehmer. Die Ausführung ist nach den verbindlichen Fristen (Vertragsfristen) zu beginnen, angemessen
    zu fördern und zu vollenden; Einzelfristen eines Bauzeitenplans sind nur Vertragsfristen, wenn das ausdrücklich vereinbart
    ist (Abs 1). Ist keine Beginnfrist vereinbart, hat der Auftraggeber auf Verlangen Auskunft über den voraussichtlichen
    Beginn zu erteilen, und der Auftragnehmer beginnt binnen 12 Werktagen nach Aufforderung (Abs 2). Sind Arbeitskräfte,
    Geräte, Gerüste, Stoffe oder Bauteile so unzureichend, dass die Fristen offenbar nicht eingehalten werden können, muss
    er auf Verlangen unverzüglich Abhilfe schaffen (Abs 3). Verzögert er den Beginn, gerät er mit der Vollendung in Verzug
    oder kommt er Abs 3 nicht nach, kann der Auftraggeber Schadensersatz nach s 6 Abs 6 verlangen oder eine angemessene
    Frist setzen und die Kündigung androhen (Abs 4, s 8 Abs 3). Werktage: 12 Werktage sind 14 Kalendertage, wenn kein gesetzlicher
    Feiertag hineinfällt; das Fenster von 14 Tagen ist daher die Untergrenze, jeder Feiertag verlängert die Frist um einen
    Tag. Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.'
- key: delay_eot.delay_notice.vob_b_2016
  duty: Eine Behinderung der ordnungsgemäßen Ausführung dem Auftraggeber unverzüglich schriftlich anzeigen
  consequence: barred
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: variations_claims
  duty_shape: delay_eot.delay_notice
  trigger: delay_recorded
  severity: 1
  grade: primary_read
  citation:
    url: https://dejure.org/gesetze/VOB-B/6.html
    clause: s 6 Abs 1 bis 4, Abs 6
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 6 Abs 1 bis 4, Abs 6
  caveat: Bindet den Auftragnehmer. Unterlässt er die Anzeige, hat er Anspruch auf Berücksichtigung der hindernden Umstände
    nur, wenn dem Auftraggeber die Tatsache und deren hindernde Wirkung offenkundig bekannt waren (Abs 1 S 2); barred, mit
    dieser Ausnahme. Die Ausführungsfristen werden verlängert, soweit die Behinderung verursacht ist durch einen Umstand
    aus dem Risikobereich des Auftraggebers, durch Streik oder Aussperrung im Betrieb des Auftragnehmers oder in einem unmittelbar
    für ihn arbeitenden Betrieb oder durch höhere Gewalt oder andere unabwendbare Umstände (Abs 2 Nr 1); Witterungseinflüsse,
    mit denen bei Angebotsabgabe normalerweise gerechnet werden musste, gelten nicht als Behinderung (Abs 2 Nr 2). Die Verlängerung
    berechnet sich nach der Dauer der Behinderung mit einem Zuschlag für die Wiederaufnahme und die etwaige Verschiebung
    in eine ungünstigere Jahreszeit (Abs 4). Der Auftragnehmer hat alles zu tun, was ihm billigerweise zugemutet werden
    kann, um die Weiterführung zu ermöglichen, und nimmt die Arbeiten unverzüglich wieder auf (Abs 3). Hat eine Partei die
    Behinderung zu vertreten, hat die andere Anspruch auf Ersatz des nachweislich entstandenen Schadens, des entgangenen
    Gewinns nur bei Vorsatz oder grober Fahrlässigkeit; der Anspruch auf Entschädigung nach s 642 BGB bleibt unberührt,
    wenn die Anzeige erfolgt oder die Tatsache offenkundig ist (Abs 6). Schriftlich ist hier die Form der Anzeige; der trigger
    delay_recorded datiert die Behinderung im Bautagebuch. "Unverzüglich" hat keine Zahl, deshalb kein Fenster. Gilt nur,
    wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: default.termination_notice.vob_b_2016
  duty: Vor einer Kündigung wegen Annahmeverzugs oder Zahlungsverzugs des Auftraggebers eine angemessene Frist zur Vertragserfüllung
    setzen, die Kündigung für den Fall des fruchtlosen Fristablaufs androhen und dann schriftlich kündigen
  consequence: barred
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: variations_claims
  duty_shape: default.termination_for_cause
  severity: 1
  grade: primary_read
  citation:
    url: https://dejure.org/gesetze/VOB-B/9.html
    clause: s 9 Abs 1 bis 3
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 9 Abs 1 bis 3
  caveat: Bindet den Auftragnehmer, der kündigt. Der Auftragnehmer kann kündigen, wenn der Auftraggeber eine ihm obliegende
    Handlung unterlässt und ihn dadurch außerstande setzt, die Leistung auszuführen (Annahmeverzug nach s 293 ff BGB), oder
    wenn der Auftraggeber eine fällige Zahlung nicht leistet oder sonst in Schuldnerverzug gerät (Abs 1). Die Kündigung
    ist schriftlich zu erklären und erst zulässig, wenn der Auftragnehmer dem Auftraggeber ohne Erfolg eine angemessene
    Frist zur Vertragserfüllung gesetzt und erklärt hat, dass er nach fruchtlosem Ablauf kündigen werde (Abs 2). Die bisherigen
    Leistungen sind nach den Vertragspreisen abzurechnen; außerdem besteht Anspruch auf angemessene Entschädigung nach s
    642 BGB, weitergehende Ansprüche bleiben (Abs 3). Das Gesetz kennt daneben die Kündigung nach s 648a und s 643 BGB (siehe
    bgb_bauvertragsrecht_de). Der Text nennt keine Zahl für die Frist, deshalb kein Fenster. barred ist die nächstliegende
    Einordnung der unzulässigen Kündigung (Einordnung nach eigenem Urteil). Gilt nur, wenn die Parteien die VOB/B (Ausgabe
    2016) vereinbart haben.
- key: default.show_cause.vob_b_2016
  duty: Auf eine Fristsetzung des Auftraggebers mit Kündigungsandrohung wegen mangelhafter Leistung, Leistung durch Nachunternehmer
    ohne Zustimmung oder Verzug innerhalb der gesetzten Frist abhelfen
