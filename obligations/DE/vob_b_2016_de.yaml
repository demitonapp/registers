obligations:
- key: variations.claim_announcement.vob_b_2016
  duty: Den Anspruch auf besondere Vergütung für eine im Vertrag nicht vorgesehene, geforderte Leistung dem Auftraggeber
    ankündigen, bevor mit ihrer Ausführung begonnen wird, und den neuen Preis möglichst vor der Ausführung vereinbaren
  consequence: barred
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: variations_claims
  duty_shape: variations.claim
  severity: 1
  grade: primary_read
  citation:
    url: https://dejure.org/gesetze/VOB-B/2.html
    clause: s 2 Abs 5, Abs 6 Nr 1 und 2, Abs 7 Nr 2, Abs 8 Nr 2
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 2 Abs 5, Abs 6 Nr 1 und 2, Abs 7 Nr 2, Abs 8 Nr 2
  caveat: Bindet den Auftragnehmer, der fordert. Wird eine im Vertrag nicht vorgesehene Leistung gefordert, hat er Anspruch
    auf besondere Vergütung, muss ihn aber ankündigen, bevor er mit der Ausführung beginnt (Abs 6 Nr 1). Ändern Entwurfsänderungen
    oder andere Anordnungen die Grundlagen des Preises einer vorgesehenen Leistung, ist ein neuer Preis zu vereinbaren,
    und die Vereinbarung soll vor der Ausführung getroffen werden (Abs 5). Die Vergütung bestimmt sich nach den Grundlagen
    der Preisermittlung und den besonderen Kosten der geforderten Leistung (Abs 6 Nr 2). Bei der Pauschalsumme gelten Abs
    4, 5 und 6 ebenfalls (Abs 7 Nr 2). Leistungen ohne Auftrag oder in eigenmächtiger Abweichung werden nicht vergütet (Abs
    8 Nr 1), außer der Auftraggeber erkennt sie nachträglich an, oder sie waren zur Vertragserfüllung notwendig, entsprachen
    dem mutmaßlichen Willen und wurden unverzüglich angezeigt (Abs 8 Nr 2). Der Text nennt die Folge der unterlassenen Ankündigung
    nicht; barred ist meine Einordnung; ob und wie die Rechtsprechung den Anspruch bei unterbliebener Ankündigung entfallen
    lässt, habe ich nicht gelesen. Das Fenster ist ein Ereignis ("bevor er mit der Ausführung beginnt"), keine Zahl. Gilt
    nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: quality.concerns_notice.vob_b_2016
  duty: Bedenken gegen die vorgesehene Art der Ausführung, die Güte vom Auftraggeber gelieferter Stoffe oder Bauteile oder
    gegen Leistungen anderer Unternehmer dem Auftraggeber unverzüglich, möglichst vor Beginn der Arbeiten, schriftlich mitteilen
  consequence: liable_full_amount
  protection_type: watch
  disease: rework
  approval_class: quality
  duty_shape: quality.concerns_notice
  severity: 2
  grade: primary_read
  citation:
    url: https://dejure.org/gesetze/VOB-B/4.html
    clause: s 4 Abs 1 Nr 4, Abs 3; s 10 Abs 2 Nr 1; s 13 Abs 3
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 4 Abs 1 Nr 4, Abs 3; s 10 Abs 2 Nr 1; s 13 Abs 3
  caveat: Bindet den Auftragnehmer. Ist ein Mangel auf die Leistungsbeschreibung, Anordnungen des Auftraggebers, von ihm
    gelieferte oder vorgeschriebene Stoffe oder Bauteile oder die Vorleistung eines anderen Unternehmers zurückzuführen,
    haftet der Auftragnehmer, es sei denn, er hat die Mitteilung nach s 4 Abs 3 gemacht (s 13 Abs 3). Der Auftraggeber bleibt
    für seine Angaben, Anordnungen und Lieferungen verantwortlich (s 4 Abs 3 Halbs 2). Ein Schaden, der nur Folge einer
    vom Auftraggeber so angeordneten Maßnahme ist, trifft den Auftraggeber allein, wenn der Auftragnehmer auf die damit
    verbundene Gefahr nach s 4 Abs 3 hingewiesen hat (s 10 Abs 2 Nr 1 S 2). Hält der Auftragnehmer Anordnungen für unberechtigt
    oder unzweckmäßig, hat er seine Bedenken geltend zu machen, die Anordnungen aber auf Verlangen auszuführen, wenn nicht
    gesetzliche oder behördliche Bestimmungen entgegenstehen; verursacht dies eine ungerechtfertigte Erschwerung, trägt
    der Auftraggeber die Mehrkosten (s 4 Abs 1 Nr 4). "Unverzüglich" hat keine Zahl, deshalb kein Fenster. liable_full_amount
    ist meine Einordnung der Haftung nach s 13 Abs 3 (Einordnung nach eigenem Urteil). notice_kind early_warning ist die
    nächstliegende Art im Register contract_notice. Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: approvals.find_notice_to_client.vob_b_2016
  duty: Funde von Gegenständen von Altertums-, Kunst- oder wissenschaftlichem Wert vor jedem weiteren Aufdecken oder Ändern
    dem Auftraggeber anzeigen und sie nach dessen Weisung abliefern
  consequence: breach
  protection_type: watch
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: approvals.find_notice_to_client
