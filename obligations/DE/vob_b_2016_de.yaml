  citation:
    url: https://dejure.org/gesetze/VOB-B/8.html
    clause: s 4 Abs 7, Abs 8 Nr 1; s 5 Abs 4; s 8 Abs 3
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 4 Abs 7, Abs 8 Nr 1; s 5 Abs 4; s 8 Abs 3
  caveat: Bindet den Auftragnehmer, der die Fristsetzung empfängt. Der Auftraggeber kann den Vertrag kündigen, wenn die
    nach s 4 Abs 7 (mangelhafte oder vertragswidrige Leistung), s 4 Abs 8 Nr 1 (Leistung ohne schriftliche Zustimmung nicht
    im eigenen Betrieb, obwohl der Betrieb darauf eingerichtet ist) oder s 5 Abs 4 (Verzug, unzureichende Mittel) gesetzte
    Frist fruchtlos abgelaufen ist (s 8 Abs 3 Nr 1 S 1); die Kündigung kann auf einen in sich abgeschlossenen Teil beschränkt
    werden (S 2). Danach darf der Auftraggeber den nicht vollendeten Teil zu Lasten des Auftragnehmers durch einen Dritten
    ausführen lassen, behält Ansprüche auf weiteren Schaden und kann bei weggefallenem Interesse Schadensersatz wegen Nichterfüllung
    verlangen (Nr 2); er kann Geräte, Gerüste, Einrichtungen und angelieferte Stoffe gegen angemessene Vergütung in Anspruch
    nehmen (Nr 3) und muss eine Aufstellung der Mehrkosten binnen 12 Werktagen nach der Abrechnung mit dem Dritten zusenden
    (Nr 4; das sind 14 Kalendertage ohne Feiertag). Die Kündigung ist schriftlich zu erklären (Abs 6). Der Text nennt für
    die Frist keine Zahl, sie muss angemessen sein, deshalb kein Fenster. Bindet auch den Unternehmer als Auftraggeber,
    der seinem Nachunternehmer eine solche Frist setzt. Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart
    haben.
- key: closeout.completion_notice_acceptance.vob_b_2016
  duty: 'Die Fertigstellung dem Auftraggeber schriftlich mitteilen oder die Abnahme verlangen: der Auftraggeber hat binnen
    12 Werktagen abzunehmen, und ohne Verlangen gilt die Leistung 12 Werktage nach schriftlicher Mitteilung der Fertigstellung
    als abgenommen'
