    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: punch_list
  clause: s 11 Abs 4; s 12 Abs 4 Nr 1 S 4, Abs 5 Nr 3
  caveat: Bindet den Unternehmer als Auftraggeber gegenüber seinem Nachunternehmer. Hat der Auftraggeber die Leistung abgenommen,
    kann er eine Vertragsstrafe nur verlangen, wenn er dies bei der Abnahme vorbehalten hat (s 11 Abs 4); barred. Vorbehalte
    wegen bekannter Mängel oder Vertragsstrafen hat er spätestens zu den Zeitpunkten geltend zu machen, zu denen die Abnahme
    nach s 12 Abs 5 Nr 1 und 2 als erfolgt gilt, also 12 Werktage nach Mitteilung der Fertigstellung oder 6 Werktage nach
    Beginn der Benutzung (s 12 Abs 5 Nr 3). Bei der förmlichen Abnahme gehören sie in die Niederschrift (s 12 Abs 4 Nr 1
    S 4). Welche Folge der Vorbehalt wegen bekannter Mängel hat, regelt die VOB/B nicht; s 640 Abs 3 BGB ist die nächstliegende
    Regel (siehe die Zeile closeout.acceptance_reservation.de; Einordnung nach eigenem Urteil). Kein Fenster, weil der Zeitpunkt
    vom Abnahmeereignis abhängt (Umrechnung der Werktage siehe die Zeile closeout.completion_notice_acceptance). Das Register
    punch_list führt Mängel, nicht den Vorbehalt, deshalb not_collected. Gilt nur, wenn die Parteien die VOB/B (Ausgabe
    2016) vereinbart haben.
