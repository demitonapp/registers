  citation:
    url: https://dejure.org/gesetze/VOB-B/16.html
    clause: s 16 Abs 3 Nr 2 bis 6
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 16 Abs 3 Nr 2 bis 6
  window:
    value: 28
    unit: days
  caveat: Bindet den Auftragnehmer, der die Schlusszahlung empfängt. Die vorbehaltlose Annahme der Schlusszahlung schließt
    Nachforderungen aus, wenn der Auftragnehmer über die Schlusszahlung schriftlich unterrichtet und auf die Ausschlusswirkung
    hingewiesen wurde (Nr 2). Einer Schlusszahlung steht es gleich, wenn der Auftraggeber unter Hinweis auf geleistete Zahlungen
    weitere Zahlungen endgültig und schriftlich ablehnt (Nr 3). Auch früher gestellte, aber unerledigte Forderungen werden
    ausgeschlossen, wenn sie nicht nochmals vorbehalten werden (Nr 4). Der Vorbehalt ist innerhalb von 28 Tagen nach Zugang
    der Mitteilung zu erklären; er wird hinfällig, wenn nicht innerhalb weiterer 28 Tage, beginnend am Tag nach Ablauf der
    ersten 28 Tage, eine prüfbare Rechnung über die vorbehaltenen Forderungen eingereicht oder, wenn das nicht möglich ist,
    der Vorbehalt eingehend begründet wird (Nr 5). Die Ausschlussfristen gelten nicht für ein Verlangen nach Richtigstellung
    wegen Aufmaß-, Rechen- und Übertragungsfehlern (Nr 6). Das Fenster nennt die erste Frist von 28 Tagen; die zweite folgt
    unmittelbar. Die Ausschlusswirkung setzt die schriftliche Unterrichtung und den Hinweis voraus; fehlen sie, läuft keine
    Ausschlussfrist (Schluss aus dem Wortlaut der Nr 2). Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart
    haben.
- key: payment.suspension_notice.vob_b_2016
  duty: Dem Auftraggeber bei Zahlungsverzug vor der Einstellung der Arbeiten eine angemessene Frist setzen und erst nach
    ihrem erfolglosen Ablauf die Arbeiten bis zur Zahlung einstellen
  consequence: guidance
  protection_type: watch
