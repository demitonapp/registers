  citation:
    url: https://dejure.org/gesetze/VOB-B/16.html
    clause: s 16 Abs 3 Nr 1
    access_date: '2026-10-18'
  evidence:
    kind: register
    register: invoice_issued
    system_type: finance
  clause: s 16 Abs 3 Nr 1
  window:
    value: 30
    unit: days
  caveat: Bindet den Auftragnehmer, der fordert, und den Unternehmer als Auftraggeber, der die Schlussrechnung seines Nachunternehmers
    prüft. Der Anspruch auf Schlusszahlung wird alsbald nach Prüfung und Feststellung fällig, spätestens innerhalb von 30
    Tagen nach Zugang der Schlussrechnung (S 1); die Frist verlängert sich auf höchstens 60 Tage, wenn dies aufgrund der
    besonderen Natur oder Merkmale der Vereinbarung sachlich gerechtfertigt ist und ausdrücklich vereinbart wurde (S 2).
    Werden Einwendungen gegen die Prüfbarkeit unter Angabe der Gründe nicht bis zum Ablauf der jeweiligen Frist erhoben,
    kann sich der Auftraggeber nicht mehr auf die fehlende Prüfbarkeit berufen (S 3). Die Prüfung ist nach Möglichkeit zu
    beschleunigen; verzögert sie sich, ist das unbestrittene Guthaben als Abschlagszahlung sofort zu zahlen (S 4, 5). Bei
    ausdrücklicher Verlängerung gelten bis zu 60 Tage; das Fenster hält den Regelfall von 30 Tagen. Der trigger claim_lodged
    datiert die Abgabe der Forderung. Der Text nennt in dieser Nummer keine Folge der verspäteten Zahlung, deshalb guidance.
    Gilt nur, wenn die Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: closeout.final_payment_reservation.vob_b_2016
  duty: Nach Zugang der Mitteilung über die Schlusszahlung binnen 28 Tagen einen Vorbehalt erklären und binnen weiterer
    28 Tage eine prüfbare Rechnung über die vorbehaltenen Forderungen einreichen oder den Vorbehalt eingehend begründen
  consequence: barred
