  citation:
    url: https://dejure.org/gesetze/VOB-B/16.html
    clause: s 16 Abs 5 Nr 3, 4; s 18 Abs 5
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: s 16 Abs 5 Nr 3, 4; s 18 Abs 5
  caveat: Bindet den Auftragnehmer, der fordert. Der Auftragnehmer darf die Arbeiten bei Zahlungsverzug bis zur Zahlung
    einstellen, sofern eine dem Auftraggeber zuvor gesetzte angemessene Frist erfolglos verstrichen ist (Nr 4). Zahlt der
    Auftraggeber bei Fälligkeit nicht, kann ihm der Auftragnehmer eine angemessene Nachfrist setzen und hat bei erfolglosem
    Ablauf Anspruch auf Zinsen in Höhe der in s 288 Abs 2 BGB genannten Sätze, wenn er nicht einen höheren Verzugsschaden
    nachweist (Nr 3 S 1, 2). Der Auftraggeber kommt jedoch ohne Nachfristsetzung spätestens 30 Tage nach Zugang der Rechnung
    oder der Aufstellung bei Abschlagszahlungen in Zahlungsverzug, wenn der Auftragnehmer seine Pflichten erfüllt und den
    fälligen Betrag nicht rechtzeitig erhalten hat, es sei denn, der Auftraggeber hat den Verzug nicht zu verantworten (S
    3); die 30 Tage verlängern sich auf höchstens 60, wenn dies sachlich gerechtfertigt und ausdrücklich vereinbart ist
    (S 4). Streitfälle berechtigen den Auftragnehmer nicht, die Arbeiten einzustellen (s 18 Abs 5). Der Text nennt keine
    Folge einer Einstellung ohne vorherige Fristsetzung; eine zu frühe Einstellung wäre eine Vertragsverletzung (Schluss,
    Rechtsprechung nicht gelesen), deshalb guidance. Kein Fenster, weil die Frist angemessen sein muss. Gilt nur, wenn die
    Parteien die VOB/B (Ausgabe 2016) vereinbart haben.
- key: closeout.contractors_bond.vob_b_2016
  duty: Eine vereinbarte Sicherheit binnen 18 Werktagen nach Vertragsabschluss leisten, wenn nichts anderes vereinbart ist
  consequence: guidance
