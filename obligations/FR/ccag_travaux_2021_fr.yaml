  caveat: 'Le délai court de la notification de la décision de réception (art. 41.3) ou, à défaut, de la fin de
    l''un des délais de trente jours des articles 41.1.3 et 41.3 (art. 12.3.2). Le déclencheur practical_completion_reached
    date la réception elle-même, qui précède cette notification : l''horloge part donc un peu tôt. Le titulaire
    est lié par les indications de son projet de décompte final, qui doit récapituler les observations non acceptées
    sous peine de les voir abandonnées (art. 12.3.1 et son commentaire). En cas de retard, le maître d''ouvrage
    met le titulaire en demeure de transmettre son projet sous quinze jours ; à défaut, le maître d''œuvre établit
    d''office le décompte final aux frais du titulaire (art. 12.3.4). Les délais se computent selon l''article 3.2
    du CCAG : ils courent à 0 heure le lendemain du fait qui les déclenche, s''entendent en jours calendaires et
    expirent à minuit le dernier jour. Un délai qui expire un samedi, un dimanche ou un jour férié est prolongé
    jusqu''à la fin du premier jour ouvrable suivant (art. 3.2.4). La date de réception de la notification fait
    courir le délai (art. 3.1.2). Ne s''applique que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation
    récapitulée au dernier article du CCAP (art. 1.2).'
