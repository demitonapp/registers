    unit: days
  caveat: 'Le maître d''œuvre notifie l''état d''acompte au titulaire et propose au maître d''ouvrage de régler
    les sommes qu''il admet, dans les sept jours de la réception de la demande de paiement mensuelle (art. 12.2.2).
    À défaut, le titulaire en informe le maître d''ouvrage, qui paie sur la base des sommes qu''il admet (art. 12.2.2).
    En cas de contestation, le complément est payé après résolution du désaccord, majoré s''il y a lieu des intérêts
    moratoires (art. 12.2.2). Le délai de paiement lui-même relève du code de la commande publique, non lu ici.
    Les délais se computent selon l''article 3.2 du CCAG : ils courent à 0 heure le lendemain du fait qui les déclenche,
    s''entendent en jours calendaires et expirent à minuit le dernier jour. Un délai qui expire un samedi, un dimanche
    ou un jour férié est prolongé jusqu''à la fin du premier jour ouvrable suivant (art. 3.2.4). La date de réception
    de la notification fait courir le délai (art. 3.1.2). Ne s''applique que si le marché se réfère au CCAG-Travaux
    2021 et sauf dérogation récapitulée au dernier article du CCAP (art. 1.2).'
