  clause: art. 12.1.1, 12.1.7 et 12.1.8
  window:
    value: 1
    unit: months
  caveat: Le projet de décompte mensuel récapitule le montant total auquel le titulaire prétend depuis la notification
    du marché, aux prix initiaux, hors actualisation, révision et TVA (art. 12.1.1). Il est accompagné des calculs
    de quantités, des coefficients d'actualisation ou de révision, des justificatifs de débours et des demandes
    de paiement des sous-traitants acceptées (art. 12.1.7). Il constitue la demande de paiement, datée, envoyée
    par tout moyen donnant date certaine (art. 12.1.8). Les décomptes mensuels n'ont pas de caractère définitif
    (art. 12.1.10). Le CCAG n'attache aucune sanction propre au retard d'une demande mensuelle. Ne s'applique que
    si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée au dernier article du CCAP (art.
    1.2).
