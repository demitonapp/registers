  clause: art. 12.4.2 et 12.4.4
  window:
    value: 30
    unit: days
  caveat: 'Le maître d''ouvrage notifie le décompte général au plus tard trente jours après la plus tardive des
    réceptions de la demande de paiement finale par le maître d''œuvre et par lui-même (art. 12.4.2). À défaut,
    le titulaire notifie, copie au maître d''œuvre, un projet de décompte général signé composé du projet de décompte
    final, du projet d''état du solde et du projet de récapitulation des acomptes (art. 12.4.4). Si le maître d''ouvrage
    ne notifie pas le décompte général dans les dix jours de leur réception, le projet du titulaire devient le décompte
    général et définitif, et le délai de paiement du solde court du lendemain (art. 12.4.4). Le CCAG ne fixe pas
    de délai au titulaire pour cette démarche : la fenêtre enregistrée est celle du maître d''ouvrage. Les délais
    se computent selon l''article 3.2 du CCAG : ils courent à 0 heure le lendemain du fait qui les déclenche, s''entendent
    en jours calendaires et expirent à minuit le dernier jour. Un délai qui expire un samedi, un dimanche ou un
    jour férié est prolongé jusqu''à la fin du premier jour ouvrable suivant (art. 3.2.4). La date de réception
    de la notification fait courir le délai (art. 3.1.2). Ne s''applique que si le marché se réfère au CCAG-Travaux
    2021 et sauf dérogation récapitulée au dernier article du CCAP (art. 1.2).'
