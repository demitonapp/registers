  evidence:
    kind: built_in
    from: the contract
  clause: arrêté, art. 1 et 3 ; annexe, art. 1.2 et 3.2
  caveat: 'Le CCAG n''est applicable qu''aux marchés qui s''y réfèrent (arrêté du 30 mars 2021, art. 1). Le marché
    peut déroger à ses stipulations, mais les dérogations doivent figurer dans le CCAP et le dernier article du
    CCAP en donne la liste récapitulative (annexe, art. 1.2). Le CCAG 2021 vaut pour les marchés dont la consultation
    a été engagée ou l''avis envoyé à la publication à compter du 1er avril 2021 ; ceux lancés entre le 1er avril
    et le 30 septembre 2021 restent réputés se référer au CCAG de 2009, sauf référence expresse à l''arrêté de 2021
    (arrêté, art. 3). Les marchés lancés avant le 1er avril 2021 restent régis par le CCAG de 2009, dont la numérotation
    diffère. Les délais se computent selon l''article 3.2 du CCAG : ils courent à 0 heure le lendemain du fait qui
    les déclenche, s''entendent en jours calendaires et expirent à minuit le dernier jour. Un délai qui expire un
    samedi, un dimanche ou un jour férié est prolongé jusqu''à la fin du premier jour ouvrable suivant (art. 3.2.4).
    La date de réception de la notification fait courir le délai (art. 3.1.2). Ce n''est pas une pièce justificative,
    mais la règle qui dit si les autres lignes de cet instrument s''appliquent.'
- key: variations.os_observations.fr
  duty: Notifier au maître d'œuvre et au maître d'ouvrage ses observations sur un ordre de service dans les quinze
    jours de sa réception, sous peine de forclusion
