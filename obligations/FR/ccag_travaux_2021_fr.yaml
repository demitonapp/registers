# Cahier des clauses administratives générales des marchés publics de travaux (CCAG-Travaux),
# annexé à l'arrêté du 30 mars 2021, lu sur Légifrance le 18 octobre 2026 dans sa version
# consolidée (page « en vigueur au 17 octobre 2026 », dernière mise à jour des données le
# 1er juillet 2024). Lus : les articles 1 à 3 de l'arrêté et, dans l'annexe, les articles 1.2,
# 3.1, 3.2, 3.8, 12.1 à 12.4, 13, 18, 33, 41.1 à 41.3 et 55. Les articles 3 et 12 de l'annexe
# sont dans leur rédaction issue de l'arrêté du 30 septembre 2021 (en vigueur le 8 octobre
# 2021), l'article 18 dans celle de l'arrêté du 29 décembre 2022 (en vigueur le 1er janvier
# 2023) ; les autres articles lus sont dans leur rédaction du 1er avril 2021.
#
# Le CCAG n'est applicable qu'aux marchés qui s'y réfèrent (arrêté, art. 1), et le CCAP peut
# déroger à ses stipulations à condition de citer les articles auxquels il déroge, récapitulés
# dans son dernier article (annexe, art. 1.2). Le CCAG 2021 régit les marchés dont la
# consultation a été engagée à compter du 1er avril 2021 ; un marché lancé entre le 1er avril
# et le 30 septembre 2021 qui ne vise pas expressément l'arrêté de 2021 reste réputé se
# référer au CCAG de 2009 (arrêté, art. 3). Les numéros d'articles cités sont ceux du texte de
# 2021, qui diffèrent de ceux de 2009.
#
# Computation (art. 3.2) : un délai court à 0 heure le lendemain du fait qui le déclenche ; en
# jours, il s'entend en jours calendaires et expire à minuit le dernier jour ; en mois, il se
# compte de quantième en quantième ; s'il expire un samedi, un dimanche ou un jour férié, il est
# prolongé jusqu'au premier jour ouvrable suivant à minuit. Un délai en jours ouvrés exclut
# samedis, dimanches et jours fériés. Les notifications qui font courir un délai sont datées
# par leur réception (art. 3.1). Les « jours » des lignes ci-dessous sont donc des jours
# calendaires (unit: days). Cette bibliothèque ne contient pas de calendrier des jours fériés
# français.
