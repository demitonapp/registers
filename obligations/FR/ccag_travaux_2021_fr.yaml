  clause: art. 55.1.2, 55.1.3, 55.2.3, 55.3.2 et 55.3.3
  window:
    value: 6
    unit: months
  caveat: Le délai de six mois court de la notification de la décision motivée du maître d'ouvrage sur le mémoire
    en réclamation, ou de la décision implicite de rejet née de son silence pendant trente jours (art. 55.1.2, 55.1.3
    et 55.3.2). Passé ce délai, le titulaire est réputé avoir accepté la décision et toute réclamation est irrecevable
    (art. 55.3.3). La saisine d'un comité consultatif de règlement amiable, d'un conciliateur ou d'un médiateur
    interrompt les délais de recours contentieux (art. 55.2.3). Un délai en mois se compte de quantième en quantième
    et expire à minuit le dernier jour, prolongé au premier jour ouvrable s'il tombe un samedi, un dimanche ou un
    jour férié (art. 3.2.3 et 3.2.4). Ne s'applique que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation
    récapitulée au dernier article du CCAP (art. 1.2).
