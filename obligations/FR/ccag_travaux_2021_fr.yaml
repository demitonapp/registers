  duty: Faire valoir auprès du maître d'ouvrage, consulté sur proposition du maître d'œuvre, les causes de prolongation
    du délai d'exécution que le CCAG admet, et contester par mémoire en réclamation une prolongation refusée
  consequence: guidance
