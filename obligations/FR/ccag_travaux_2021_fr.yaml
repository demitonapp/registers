    unit: days
  caveat: 'Vise les prestations supplémentaires ou modificatives notifiées par ordre de service et pour lesquelles
    le marché n''a pas prévu de prix (art. 13.1). L''ordre de service fixe des prix provisoires, arrêtés par le
    maître d''œuvre avec l''accord du maître d''ouvrage après consultation du titulaire (art. 13.4). Sans observation
    motivée dans les trente jours suivant cet ordre, le titulaire est réputé avoir accepté les prix pour l''établissement
    des décomptes, et ils deviennent définitifs sans avenant (art. 13.5). En cas de désaccord, le maître d''ouvrage
    paie provisoirement les sommes qu''il admet (art. 13.5). Les délais se computent selon l''article 3.2 du CCAG
    : ils courent à 0 heure le lendemain du fait qui les déclenche, s''entendent en jours calendaires et expirent
    à minuit le dernier jour. Un délai qui expire un samedi, un dimanche ou un jour férié est prolongé jusqu''à
    la fin du premier jour ouvrable suivant (art. 3.2.4). La date de réception de la notification fait courir le
    délai (art. 3.1.2). Ne s''applique que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée
    au dernier article du CCAP (art. 1.2).'
- key: variations.os_non_valorise_refus.fr
  duty: Notifier par écrit au maître d'œuvre, dans les quinze jours, le refus d'exécuter un ordre de service de
    prestations nouvelles qui n'a fait l'objet d'aucune valorisation financière
