  clause: art. 55.1.1 à 55.1.4 et 55.3.1
  caveat: Tout différend doit faire l'objet d'un mémoire en réclamation exposant ses motifs et, pour chaque chef,
    le montant réclamé et sa justification, notifié au maître d'ouvrage avec copie au maître d'œuvre (art. 55.1.1).
    Le CCAG 2021 ne fixe de délai à ce mémoire que s'il porte sur le décompte général (trente jours, voir closeout.decompte_general_reponse.fr)
    ; aucune fenêtre n'est donc enregistrée. Toute réclamation antérieure non réglée doit être reprise dans le mémoire
    sur le décompte général, sous peine de forclusion (art. 55.1.1). Le maître d'ouvrage notifie sa décision motivée
    dans les trente jours de la réception du mémoire, et son silence vaut rejet (art. 55.1.2 et 55.1.3). Devant
    le tribunal administratif, le titulaire ne peut invoquer que les chefs et motifs énoncés dans ses mémoires en
    réclamation (art. 55.3.1). Ne s'applique que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation
    récapitulée au dernier article du CCAP (art. 1.2).
