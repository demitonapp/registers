    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. 12.4.3, 12.4.5 et 55.1.1
  window:
    value: 30
    unit: days
  caveat: 'Le délai court de la notification du décompte général au titulaire (art. 12.4.3). Une signature sans
    réserve rend le décompte général et définitif et lie définitivement les parties, hors révisions de prix et intérêts
    moratoires du solde (art. 12.4.3). Si le titulaire ne renvoie pas le décompte dans les trente jours, ou ne motive
    pas son refus, ou n''expose pas en détail et ne chiffre pas ses réserves comme l''exige l''article 55.1, le
    décompte notifié est réputé accepté et devient définitif (art. 12.4.5). Le mémoire en réclamation sur le décompte
    général est transmis dans le même délai de trente jours et doit reprendre, sous peine de forclusion, les réclamations
    antérieures non réglées (art. 55.1.1). Des réserves partielles valent acceptation des autres éléments (art.
    12.4.3). En cas de contestation, le maître d''ouvrage paie dans les trente jours les sommes admises (art. 12.4.3).
    Les délais se computent selon l''article 3.2 du CCAG : ils courent à 0 heure le lendemain du fait qui les déclenche,
    s''entendent en jours calendaires et expirent à minuit le dernier jour. Un délai qui expire un samedi, un dimanche
    ou un jour férié est prolongé jusqu''à la fin du premier jour ouvrable suivant (art. 3.2.4). La date de réception
    de la notification fait courir le délai (art. 3.1.2). Ne s''applique que si le marché se réfère au CCAG-Travaux
    2021 et sauf dérogation récapitulée au dernier article du CCAP (art. 1.2).'
