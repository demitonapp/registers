  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. 13.6
  window:
    value: 15
    unit: days
  caveat: 'Le titulaire n''est pas tenu d''exécuter un ordre de service de prestations supplémentaires ou modificatives
    qui ne comporte aucune valorisation financière (art. 13.6). Le refus n''est recevable que s''il est notifié
    par écrit, avec les justifications nécessaires, au maître d''œuvre dans les quinze jours suivant la notification
    de l''ordre, copie au maître d''ouvrage (art. 13.6). Passé ce délai, le refus est irrecevable et l''article
    3.8.3 impose d''exécuter l''ordre. Les délais se computent selon l''article 3.2 du CCAG : ils courent à 0 heure
    le lendemain du fait qui les déclenche, s''entendent en jours calendaires et expirent à minuit le dernier jour.
    Un délai qui expire un samedi, un dimanche ou un jour férié est prolongé jusqu''à la fin du premier jour ouvrable
    suivant (art. 3.2.4). La date de réception de la notification fait courir le délai (art. 3.1.2). Ne s''applique
    que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée au dernier article du CCAP (art.
    1.2).'
