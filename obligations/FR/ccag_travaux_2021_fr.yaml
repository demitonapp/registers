  citation:
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043310421/
    clause: art. 3.8.2 et 3.8.3
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. 3.8.2 et 3.8.3
  window:
    value: 15
    unit: days
  caveat: 'Le délai court de la réception de l''ordre de service ; les observations sont notifiées au signataire
    de l''ordre, copie à l''autre (art. 3.8.2). Passé quinze jours, le titulaire est forclos à contester les prescriptions
    de l''ordre. Il doit en principe exécuter l''ordre même s''il a formulé des observations (art. 3.8.3). Si les
    observations motivées signalent un risque pour la sécurité ou la santé, ou une contrariété à la loi, l''exécution
    est suspendue jusqu''à la réponse du maître d''ouvrage, et le titulaire n''est pas tenu d''exécuter faute de
    réponse dans quinze jours (art. 3.8.2). Un ordre de service du maître d''œuvre qui modifie le délai, la durée
    ou le montant sans validation préalable du maître d''ouvrage jointe n''a pas à être exécuté (art. 3.8.1). En
    sous-traitance ou en groupement, seul le titulaire ou le mandataire a qualité pour formuler des observations
    (art. 3.8.4 et 3.8.5). Les délais se computent selon l''article 3.2 du CCAG : ils courent à 0 heure le lendemain
    du fait qui les déclenche, s''entendent en jours calendaires et expirent à minuit le dernier jour. Un délai
    qui expire un samedi, un dimanche ou un jour férié est prolongé jusqu''à la fin du premier jour ouvrable suivant
    (art. 3.2.4). La date de réception de la notification fait courir le délai (art. 3.1.2). Ne s''applique que
    si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée au dernier article du CCAP (art.
    1.2).'
