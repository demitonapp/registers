    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. 18.2.3
  caveat: Les intempéries au sens des dispositions législatives ou réglementaires qui entraînent un arrêt de travail
    prolongent de droit le délai d'exécution, par ordre de service qui en fixe la durée (art. 18.2.3). Cette durée
    égale le nombre de journées d'arrêt réellement constatées, moins les journées d'intempéries prévisibles indiquées
    aux documents particuliers ; les samedis, dimanches et jours fériés ou chômés compris dans la période d'intempéries
    s'y ajoutent (art. 18.2.3). Pour les intempéries hors régime légal et les autres phénomènes naturels, la prolongation
    n'existe que si les documents particuliers la prévoient selon leurs propres critères (art. 18.2.3). Le CCAG
    ne fixe ni délai ni forme au constat ; le régime légal des intempéries auquel il renvoie n'a pas été lu ici.
    Ne s'applique que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée au dernier article
    du CCAP (art. 1.2).
