  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. 18.2.1, 18.2.2 et 33.4 ; art. 55.1
  caveat: 'Hors intempéries et réquisition, la prolongation ne peut résulter que d''un avenant ou des causes de
    l''article 18.2.2 : changement du montant des travaux ou de l''importance de natures d''ouvrages, substitution
    d''ouvrages, difficultés ou circonstances imprévues, ajournement décidé par le maître d''ouvrage, retard d''opérations
    préliminaires ou d''autorisations à sa charge (art. 18.2.1 et 18.2.2). Le maître d''ouvrage décide de l''importance
    de la prolongation sur proposition du maître d''œuvre, après consultation du titulaire, et la notifie par ordre
    de service (art. 18.2.2). Le CCAG ne fixe au titulaire aucun délai pour demander une prolongation ; aucune fenêtre
    n''est donc enregistrée, mais l''ordre de service qui notifie la prolongation relève du délai d''observations
    de quinze jours de l''article 3.8.2. Les découvertes archéologiques ouvrent droit à prolongation dans ces conditions
    (art. 33.4). Article 18 dans sa rédaction issue de l''arrêté du 29 décembre 2022, en vigueur le 1er janvier
    2023. Ne s''applique que si le marché se réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée au dernier
    article du CCAP (art. 1.2).'
- key: delay_eot.intemperies.fr
  duty: Faire constater les journées d'arrêt de travail dues aux intempéries pour obtenir la prolongation du délai
    d'exécution, déduction faite des journées prévisibles fixées au marché
  consequence: guidance
