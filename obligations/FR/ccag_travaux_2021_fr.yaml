  clause: art. 33.1 à 33.4 ; art. 18.2.2
  caveat: 'Le titulaire signale la découverte au maître d''œuvre et fait conjointement avec le maître d''ouvrage
    la déclaration réglementaire au maire de la commune ; il ne déplace pas les objets ou vestiges sans autorisation
    du maître d''ouvrage et met en lieu sûr ceux détachés fortuitement (art. 33.2). Des restes humains sont signalés
    immédiatement au maire, compte rendu au maître d''œuvre (art. 33.3). Le titulaire a droit à l''indemnisation
    des dépenses justifiées et à une prolongation de délai (art. 33.4 et 18.2.2) ; l''arrêt des travaux décidé par
    les services des affaires culturelles est un ajournement au sens de l''article 53.1 (commentaire de l''art.
    33.4). Aucun délai chiffré : pas de fenêtre. L''obligation légale de déclaration immédiate est celle de l''article
    L. 531-14 du code du patrimoine (voir approvals.archaeological_find.fr). Ne s''applique que si le marché se
    réfère au CCAG-Travaux 2021 et sauf dérogation récapitulée au dernier article du CCAP (art. 1.2).'
