# Code des assurances, livre II, titre IV (assurance des travaux de construction), lu sur
# Légifrance le 18 octobre 2026 dans la version en vigueur : articles L. 241-1 et L. 243-1 à
# L. 243-3.
#
# Champ : l'obligation ne vise que les personnes dont la responsabilité décennale peut être
# engagée sur le fondement des articles 1792 et suivants du code civil (non lus ici), et
# l'article L. 243-1-1 en exclut la plupart des ouvrages de génie civil (voiries, réseaux,
# canalisations, infrastructures routières, ferroviaires, portuaires, ouvrages d'énergie...),
# sauf accessoires d'un ouvrage assujetti. Chaque ligne le rappelle. L'obligation de
# justification « à l'ouverture de tout chantier » est à l'article L. 241-1, deuxième alinéa ;
# l'article L. 243-2 en fixe la forme.
