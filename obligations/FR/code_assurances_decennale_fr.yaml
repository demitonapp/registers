    access_date: '2026-10-18'
  evidence:
    kind: register
    register: insurance_certificate
    system_type: document_store
  clause: art. L. 241-1, al. 2, L. 243-2 et L. 243-3
  caveat: 'La justification est due à l''ouverture de tout chantier, et tout candidat à un marché public doit être
    en mesure de la fournir (art. L. 241-1, al. 2). Elle prend la forme d''attestations d''assurance, sur un modèle
    fixé par arrêté, jointes aux devis et factures (art. L. 243-2, al. 2) ; l''arrêté n''a pas été lu ici. Quiconque
    contrevient aux articles L. 241-1 à L. 242-1 est puni de six mois d''emprisonnement et de 75 000 euros d''amende,
    ou de l''une de ces peines (art. L. 243-3). « À l''ouverture de tout chantier », sans nombre de jours : pas
    de fenêtre. L''obligation ne s''applique pas aux ouvrages maritimes, lacustres, fluviaux, aux infrastructures
    routières, portuaires, aéroportuaires et ferroviaires, aux ouvrages de traitement des déchets et effluents,
    ni, sauf s''ils sont accessoires à un ouvrage assujetti, aux voiries, réseaux divers, canalisations, lignes,
    ouvrages d''énergie et de télécommunications et ouvrages sportifs non couverts (art. L. 243-1-1, I) : une grande
    part du génie civil en est donc exclue. Elle ne vise pas les ouvrages existants avant l''ouverture du chantier,
    sauf s''ils deviennent techniquement indivisibles de l''ouvrage neuf (art. L. 243-1-1, II), ni l''État construisant
    pour son compte (art. L. 243-1).'
