  clause: art. L. 241-1, L. 243-1, L. 243-1-1 et L. 243-3
  caveat: 'Toute personne dont la responsabilité décennale peut être engagée sur le fondement des articles 1792
    et suivants du code civil doit être assurée (art. L. 241-1). Le contrat est réputé comporter une clause de maintien
    de la garantie pour la durée de la responsabilité décennale (art. L. 241-1). Le défaut d''assurance est puni
    de six mois d''emprisonnement et de 75 000 euros d''amende, ou de l''une de ces peines (art. L. 243-3). L''obligation
    ne s''applique pas aux ouvrages maritimes, lacustres, fluviaux, aux infrastructures routières, portuaires, aéroportuaires
    et ferroviaires, aux ouvrages de traitement des déchets et effluents, ni, sauf s''ils sont accessoires à un
    ouvrage assujetti, aux voiries, réseaux divers, canalisations, lignes, ouvrages d''énergie et de télécommunications
    et ouvrages sportifs non couverts (art. L. 243-1-1, I) : une grande part du génie civil en est donc exclue.
    Elle ne vise pas les ouvrages existants avant l''ouverture du chantier, sauf s''ils deviennent techniquement
    indivisibles de l''ouvrage neuf (art. L. 243-1-1, II), ni l''État construisant pour son compte (art. L. 243-1).'
