- key: payment.works_payment_guarantee.fr
  duty: Obtenir du maître de l'ouvrage d'un marché de travaux privé la garantie de paiement des sommes dues au-delà
    du seuil fixé par décret, par versement direct d'un crédit spécifique ou par un cautionnement solidaire
