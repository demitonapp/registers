  clause: art. 1799-1, al. 3 à 5
  window:
    value: 15
    unit: days
  caveat: 'Le droit de surseoir existe tant qu''aucune garantie n''a été fournie et que l''entrepreneur demeure
    impayé des travaux exécutés, après une mise en demeure restée sans effet à l''issue d''un délai de quinze jours
    (al. 3). Les deux conditions sont cumulatives : une garantie fournie, ou l''absence d''impayé, ferme ce droit.
    Il ne joue pas lorsque le maître de l''ouvrage contracte pour son propre compte et pour des besoins étrangers
    à une activité professionnelle en rapport avec le marché (al. 4), ni pour les marchés exclus par l''alinéa 5.
    L''article n''impose pas de forme à la mise en demeure. Jours calendaires : le texte ne vise ni jours ouvrés
    ni jours ouvrables et ne prévoit pas de report lorsque le délai expire un samedi, un dimanche ou un jour férié.'
