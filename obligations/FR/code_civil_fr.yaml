# Code civil, article 1799-1, lu sur Légifrance le 18 octobre 2026 dans sa version en vigueur depuis
# le 1er janvier 2014 (rédaction issue de l'ordonnance n° 2013-544 du 27 juin 2013), avec l'article
# 1779 auquel il renvoie. Seules les règles de cet article sont reprises.
#
# Le seuil au-delà duquel la garantie est due est fixé par un décret en Conseil d'État distinct du
# code ; ce décret n'a pas été lu, et son montant n'est pas repris. Le délai de quinze jours (al. 3)
# est en jours calendaires : l'article ne vise ni jours ouvrés ni jours ouvrables et ne prévoit pas
# de report lorsqu'il expire un samedi, un dimanche ou un jour férié.
