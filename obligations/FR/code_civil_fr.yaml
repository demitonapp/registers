  clause: art. 1779, 1799-1
  caveat: Le maître de l'ouvrage qui conclut un marché de travaux privé visé au 3° de l'article 1779 doit garantir
    à l'entrepreneur le paiement des sommes dues lorsqu'elles dépassent un seuil fixé par décret en Conseil d'État
    (art. 1799-1, al. 1). Le montant de ce seuil figure dans un décret distinct du code, qui n'a pas été lu ; il
    n'est pas repris ici. S'il recourt à un crédit spécifique, l'établissement de crédit ne peut verser le prêt
    à une personne autre que celles mentionnées au 3° de l'article 1779 tant qu'elles n'ont pas reçu l'intégralité
    de leur créance, et les versements se font sur l'ordre écrit et sous la responsabilité exclusive du maître de
    l'ouvrage (al. 2). Sans crédit spécifique, ou pour la part qu'il ne couvre pas, et à défaut de garantie stipulée,
    le paiement est garanti par un cautionnement solidaire consenti par un établissement de crédit, une société
    de financement, une entreprise d'assurance ou un organisme de garantie collective (al. 3). Le cautionnement
    de l'alinéa 3 n'est pas dû lorsque le maître de l'ouvrage contracte pour son propre compte et pour des besoins
    étrangers à une activité professionnelle en rapport avec le marché (al. 4). L'article ne s'applique pas aux
    marchés conclus par un organisme visé à l'article L. 411-2 du code de la construction et de l'habitation, ou
    par une société d'économie mixte, pour des logements à usage locatif aidés par l'État qu'ils réalisent (al.
    5). Le sous-traitant qui exerce l'action directe bénéficie de l'alinéa 2 (loi n° 75-1334 du 31 décembre 1975,
    art. 12, al. 4). Aucun registre ne relie une caution à un marché, d'où not_collected.
- key: payment.guarantee_suspension.fr
  duty: Mettre le maître de l'ouvrage en demeure de fournir la garantie de paiement et, faute d'effet dans les 15
    jours, surseoir à l'exécution du marché tant que les travaux exécutés restent impayés
  consequence: guidance
