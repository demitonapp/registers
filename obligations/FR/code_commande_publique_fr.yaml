  caveat: 'La retenue est remboursée dans un délai de trente jours à compter de l''expiration du délai de garantie
    (R. 2191-35, al. 1). Si des réserves ont été notifiées au créancier pendant le délai de garantie et n''ont pas
    été levées avant son expiration, elle est remboursée dans les trente jours de leur levée (R. 2191-35, al. 2).
    Ces articles ne fixent pas la durée du délai de garantie, qui relève du marché. Aucun registre ne date l''expiration
    du délai de garantie, d''où l''absence de trigger. Jours calendaires : ces articles ne visent ni jours ouvrés
    ni jours ouvrables et ne prévoient pas de report lorsque le délai expire un samedi, un dimanche ou un jour férié.'
