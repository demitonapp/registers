# Code de la commande publique, lu sur Légifrance le 18 octobre 2026 (version en vigueur à cette
# date) : le titre IX du livre Ier de la deuxième partie, législatif (L. 2191-1 à L. 2193-14) et
# réglementaire (R. 2191-1 à R. 2193-22), avec les articles R. 2100-1 et L. 2411-1 auxquels il renvoie.
# L'article L. 2193-1 est dans sa rédaction issue de la loi n° 2026-403 du 26 mai 2026 (simplification
# de la vie économique), en vigueur le 28 mai 2026. Les articles R. 2191-7, R. 2191-33, R. 2192-16 et
# R. 2192-23 sont dans leur rédaction issue du décret n° 2024-1251 du 30 décembre 2024, qui s'applique
# aux marchés dont la consultation est engagée à compter du lendemain de sa publication ; l'article
# R. 2191-11 dans celle du décret n° 2025-1383 du 29 décembre 2025, en vigueur le 1er janvier 2026.
#
# Les chapitres sur l'avance, les garanties et les délais de paiement s'appliquent aux acheteurs
# publics (État, établissements publics non industriels et commerciaux, collectivités territoriales,
# leurs établissements publics et groupements : L. 2191-1), avec les exceptions de l'article R. 2191-1.
# Jours calendaires : ces articles ne visent ni jours ouvrés ni jours ouvrables et ne prévoient pas de
# report lorsque le délai expire un samedi, un dimanche ou un jour férié ; pour un marché qui s'y
# réfère, le CCAG-Travaux 2021 fixe sa propre computation (ccag_travaux_2021_fr).
