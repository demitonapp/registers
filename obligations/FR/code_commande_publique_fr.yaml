  clause: art. L. 2193-13, R. 2192-22, R. 2192-23, R. 2193-11 à R. 2193-16
  window:
    value: 15
    unit: days
  caveat: 'Le sous-traitant admis au paiement direct adresse sa demande au titulaire par tout moyen permettant d''en
    assurer la réception et d''en déterminer la date, ou la dépose contre récépissé (R. 2193-11). Le titulaire dispose
    de quinze jours à compter de la réception ou du récépissé pour donner son accord ou notifier un refus au sous-traitant
    et à l''acheteur (R. 2193-12). Passé ce délai, il est réputé avoir accepté les pièces justificatives, ou parties
    de pièces, qu''il n''a pas expressément acceptées ou refusées (R. 2193-13). Le sous-traitant adresse alors sa
    demande à l''acheteur avec la preuve de réception, le récépissé ou l''avis postal du pli refusé ou non réclamé,
    et l''acheteur adresse sans délai au titulaire une copie des factures (R. 2193-14). Sur le portail public de
    facturation, la demande est déposée sans autre formalité, et le titulaire a quinze jours à compter du dépôt
    pour l''accepter ou la refuser sur ce portail (R. 2193-16). Le délai de paiement du sous-traitant est celui
    du titulaire et court de la réception par l''acheteur de l''accord du titulaire, ou de l''expiration des quinze
    jours, ou de la réception de l''avis postal (R. 2192-22, R. 2192-23). « Réputé avoir accepté » est rendu par
    liable_full_amount. Une règle de quinze jours, avec notification par lettre recommandée, figure à l''article
    8 de la loi n° 75-1334 du 31 décembre 1975 pour les seuls marchés des entreprises publiques qui ne sont pas
    des acheteurs soumis au code (art. 4 de cette loi). Jours calendaires : ces articles ne visent ni jours ouvrés
    ni jours ouvrables et ne prévoient pas de report lorsque le délai expire un samedi, un dimanche ou un jour férié.'
- key: closeout.public_retention_cap.fr
  duty: Ne subir qu'une retenue de garantie prévue au marché, au plus égale à 5 % du montant initial augmenté des
    modifications, ou à 3 % pour une petite ou moyenne entreprise auprès des plus grands acheteurs, et pouvoir y
    substituer une garantie à première demande
  consequence: breach
