  clause: art. L. 2193-1 à L. 2193-7, L. 2193-10 à L. 2193-12, R. 2193-1 à R. 2193-4, R. 2193-10
  window:
    value: 21
    unit: days
  caveat: 'Le chapitre s''applique aux marchés de travaux pour lesquels l''acheteur est maître d''ouvrage au sens
    de l''article L. 2411-1, aux marchés de services et aux marchés de fournitures comportant des services ou des
    travaux de pose ou d''installation (L. 2193-1, dans sa rédaction issue de la loi n° 2026-403 du 26 mai 2026).
    Le titulaire ne recourt à la sous-traitance qu''après l''avoir déclarée et avoir obtenu l''acceptation du sous-traitant
    et l''agrément de ses conditions de paiement (L. 2193-4), et il communique le contrat de sous-traitance à l''acheteur
    sur sa demande (L. 2193-7). Déclaré dans l''offre, avec une déclaration du sous-traitant qu''il n''est pas exclu,
    le sous-traitant est accepté par la notification du marché (R. 2193-1, R. 2193-2). Déclaré en cours d''exécution,
    il fait l''objet d''un acte spécial remis contre récépissé ou adressé par lettre recommandée avec demande d''avis
    de réception, avec la preuve qu''aucune cession ni aucun nantissement ne fait obstacle au paiement direct (R.
    2193-3). L''acceptation est constatée par la signature de l''acte spécial, et le silence de l''acheteur pendant
    vingt et un jours à compter de la réception des documents vaut acceptation et agrément (R. 2193-4). Le sous-traitant
    direct accepté dont le contrat atteint 600 euros toutes taxes comprises (10 % du montant du marché pour certains
    marchés de la défense) est payé directement par l''acheteur, même en cas de procédure collective du titulaire,
    et toute renonciation au paiement direct est réputée non écrite (L. 2193-10 à L. 2193-12, R. 2193-10). Sous
    ce seuil, il relève de l''action directe du titre III de la loi n° 75-1334 du 31 décembre 1975 (L. 2193-10,
    2°). Le code n''énonce pas ici de sanction contre le titulaire qui sous-traite sans acceptation ; les clauses
    faisant échec au chapitre sont nulles (L. 2193-3). Aucun registre ne date l''acceptation d''un sous-traitant,
    d''où not_collected. Jours calendaires : ces articles ne visent ni jours ouvrés ni jours ouvrables et ne prévoient
    pas de report lorsque le délai expire un samedi, un dimanche ou un jour férié.'
