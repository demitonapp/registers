  evidence: *id001
  clause: art. L. 2192-13, D. 2192-35, R. 2192-36
  caveat: Le retard de paiement donne lieu, de plein droit et sans autre formalité, au versement d'une indemnité
    forfaitaire pour frais de recouvrement (L. 2192-13), fixée à 40 euros (D. 2192-35). Lorsque les frais de recouvrement
    exposés sont supérieurs, le créancier peut demander une indemnisation complémentaire, sur justification (L.
    2192-13). L'indemnité est payée dans les quarante-cinq jours suivant la mise en paiement du principal (R. 2192-36).
    Le registre progress_claim ne porte pas l'indemnité, d'où not_collected.
- key: payment.public_advance.fr
  duty: Recevoir l'avance obligatoire lorsque le montant initial du marché dépasse 50 000 euros HT et que son délai
    d'exécution dépasse deux mois, au taux fixé par le marché entre 5 % et 30 %, sauf à la refuser
