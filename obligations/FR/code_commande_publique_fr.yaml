    clause: art. L. 2191-7, R. 2191-1, R. 2191-32 à R. 2191-34, R. 2191-36 à R. 2191-40
    access_date: '2026-10-18'
  evidence: &id002
    kind: register
    register: retention_position
    system_type: finance
  clause: art. L. 2191-7, R. 2191-1, R. 2191-32 à R. 2191-34, R. 2191-36 à R. 2191-40
  caveat: Les marchés peuvent prévoir une retenue de garantie, dans les conditions et sous les exceptions prévues
    par décret en Conseil d'État (L. 2191-7). Elle a pour seul objet de couvrir les réserves formulées à la réception
    et, le cas échéant, celles formulées pendant le délai de garantie pour des malfaçons qui n'étaient pas apparentes
    à la réception (R. 2191-32). Son montant ne peut dépasser 5 % du montant initial augmenté des modifications
    en cours d'exécution, ni 3 % lorsque le titulaire est une petite ou moyenne entreprise et que l'acheteur est
    l'État, un établissement public administratif de l'État autre que de santé, ou une collectivité territoriale,
    un de ses établissements publics ou groupements, dont les charges ou dépenses de fonctionnement dépassent 60
    millions d'euros (R. 2191-33). Elle est prélevée par fractions sur les acomptes, les règlements partiels définitifs
    et le solde (R. 2191-34). Le titulaire peut, pendant toute la durée du marché, lui substituer une garantie à
    première demande ou, si l'acheteur ne s'y oppose pas, une caution personnelle et solidaire, d'un montant qui
    ne peut excéder celui de la retenue (R. 2191-36, R. 2191-38). Faute de garantie constituée au plus tard à la
    remise de la demande de paiement du premier acompte, la fraction correspondante de la retenue est prélevée,
    puis reversée si la garantie est constituée plus tard (R. 2191-40). Les acheteurs de l'article R. 2100-1 ne
    sont pas soumis à ces règles (R. 2191-1). Le code ne frappe pas de nullité une retenue excédentaire ; la ligne
    est donc rendue par breach.
