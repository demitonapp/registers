  clause: art. L. 2191-1 à L. 2191-3, R. 2191-1, R. 2191-3 à R. 2191-11, R. 2192-24, R. 2192-25, R. 2193-19
  caveat: Le chapitre s'applique aux marchés de l'État, de ses établissements publics autres qu'industriels et commerciaux,
    des collectivités territoriales, de leurs établissements publics et de leurs groupements, sous réserve des exceptions
    réglementaires (L. 2191-1). Les acheteurs énumérés à l'article R. 2100-1 n'y sont pas soumis, sauf l'opérateur
    France Travail et les établissements publics administratifs de l'État à mission de recherche pour leurs achats
    de recherche (R. 2191-1). L'acheteur accorde une avance lorsque le montant initial dépasse 50 000 euros hors
    taxes et que le délai d'exécution dépasse deux mois (R. 2191-3) ; il peut en prévoir une dans les autres cas
    (R. 2191-4), et le titulaire peut la refuser (R. 2191-5). La part sous-traitée donnant lieu au paiement direct
    est déduite du montant initial (R. 2191-6). L'avance est comprise entre 5 % et 30 % du montant initial toutes
    taxes comprises pour un marché de douze mois au plus, et de douze fois ce montant divisé par la durée en mois
    au-delà (R. 2191-7). Lorsque le titulaire ou son sous-traitant admis au paiement direct est une petite ou moyenne
    entreprise, le taux minimal est porté à 30 % pour les marchés de l'État, et à 10 % pour ceux des établissements
    publics administratifs de l'État autres que de santé et des collectivités territoriales, de leurs établissements
    publics et groupements, dont les charges ou dépenses de fonctionnement dépassent 60 millions d'euros (R. 2191-7).
    Les collectivités territoriales, leurs établissements publics et groupements peuvent conditionner l'avance à
    une garantie à première demande, à laquelle les parties peuvent substituer une caution personnelle et solidaire
    (R. 2191-7), et tout acheteur peut l'exiger s'il porte l'avance au-delà de 30 % (R. 2191-8). Les clauses relatives
    au taux et aux conditions de versement de l'avance ne peuvent être modifiées en cours d'exécution (L. 2191-3).
    Le délai de paiement de l'avance court de la notification du marché ou, si le marché le prévoit, de l'acte qui
    emporte commencement d'exécution des prestations correspondantes (R. 2192-24), mais pas avant la réception de
    la garantie exigée (R. 2192-25). Dans le silence du marché, le remboursement par précompte débute lorsque les
    prestations exécutées atteignent 65 % du montant toutes taxes comprises de la part du titulaire pour une avance
    de 30 % au plus, et dès la première demande de paiement au-delà (R. 2191-11). Les sous-traitants admis au paiement
    direct reçoivent une avance, sur leur demande, dès lors que le titulaire remplit les conditions pour en bénéficier
    (R. 2193-19). Le taux est une donnée du marché (R. 2191-10), d'où built_in.
- key: payment.public_subcontractor_acceptance.fr
  duty: Déclarer chaque sous-traitant à l'acheteur et obtenir son acceptation et l'agrément de ses conditions de
    paiement, l'acheteur qui garde le silence 21 jours après réception de l'acte spécial étant réputé les avoir
    acceptés
