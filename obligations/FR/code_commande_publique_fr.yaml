  clause: art. L. 2192-10, L. 2192-11, R. 2192-10 à R. 2192-18, R. 2192-27 à R. 2192-29
  window:
    value: 30
    unit: days
  caveat: 'Le délai prévu au marché ne peut excéder le délai réglementaire (L. 2192-10) : trente jours pour les
    pouvoirs adjudicateurs, y compris lorsqu''ils agissent en tant qu''entité adjudicatrice (R. 2192-10). Il est
    de cinquante jours pour les établissements publics de santé et ceux du service de santé des armées, et de soixante
    jours pour les entreprises publiques au sens du II de l''article 1er de l''ordonnance n° 2004-503 du 7 juin
    2004, sauf celles qui ont la nature d''établissements publics locaux (R. 2192-11). Les entités adjudicatrices
    mentionnées aux 2° et 3° de l''article L. 1212-1 paient selon l''article L. 441-10 du code de commerce (L. 2192-11).
    Le délai court de la réception de la demande de paiement par le pouvoir adjudicateur ou, si le marché le prévoit,
    par le maître d''œuvre (R. 2192-12), et de l''exécution des prestations si cette date est incertaine ou antérieure
    à l''exécution (R. 2192-13). Faute de constatation, la date de la demande augmentée de deux jours fait foi,
    et la date de réception ne peut faire l''objet d''un accord contractuel (R. 2192-14). Pour le solde d''un marché
    de travaux, le délai court de la réception par le maître de l''ouvrage du décompte général et définitif (R.
    2192-16). Une procédure de vérification prévue au marché peut reporter le point de départ à la constatation
    de la conformité ; elle ne peut excéder trente jours sauf durée plus longue non abusive, et le silence vaut
    conformité (R. 2192-17). L''intervention du maître d''œuvre ne modifie pas le délai qui s''impose au pouvoir
    adjudicateur (R. 2192-18). Le délai peut être interrompu une seule fois, par une notification qui précise les
    raisons et les pièces à fournir, lorsque la demande est incomplète ou erronée ; un nouveau délai de trente jours,
    ou le solde restant s''il est supérieur, court à la réception des pièces (R. 2192-27 à R. 2192-29). Jours calendaires
    : ces articles ne visent ni jours ouvrés ni jours ouvrables et ne prévoient pas de report lorsque le délai expire
    un samedi, un dimanche ou un jour férié.'
- key: payment.public_late_interest.fr
  duty: Percevoir de plein droit les intérêts moratoires dès le lendemain de l'expiration du délai de paiement,
    au taux des opérations principales de refinancement de la Banque centrale européenne majoré de huit points
  consequence: guidance
