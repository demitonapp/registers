  citation:
    url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037729653
    clause: art. L. 2192-12 à L. 2192-14, R. 2192-31 à R. 2192-34, R. 2192-36
    access_date: '2026-10-18'
  evidence: &id001
    kind: not_collected
    register: progress_claim
  clause: art. L. 2192-12 à L. 2192-14, R. 2192-31 à R. 2192-34, R. 2192-36
  caveat: Le retard est constitué lorsque les sommes dues au créancier qui a rempli ses obligations légales et contractuelles
    ne sont pas versées à l'échéance prévue au marché ou à l'expiration du délai de paiement (L. 2192-12). Les intérêts
    courent de plein droit et sans autre formalité dès le lendemain (L. 2192-13), jusqu'à la date de mise en paiement
    du principal incluse (R. 2192-32). Le taux est celui appliqué par la Banque centrale européenne à ses opérations
    principales de refinancement les plus récentes, en vigueur au premier jour du semestre de l'année civile au
    cours duquel les intérêts ont commencé à courir, majoré de huit points de pourcentage (R. 2192-31). Ils sont
    calculés sur le montant toutes taxes comprises de l'acompte ou du solde, diminué de la retenue de garantie,
    après application des clauses d'actualisation, de révision et de pénalisation (R. 2192-33). En cas de désaccord
    sur le montant, le pouvoir adjudicateur paie dans le délai les sommes qu'il admet, et la différence finalement
    due porte intérêts (R. 2192-34). Les intérêts sont payés dans les quarante-cinq jours suivant la mise en paiement
    du principal (R. 2192-36), et toute renonciation à leur paiement est réputée non écrite (L. 2192-14). Le registre
    progress_claim porte le montant demandé, non les intérêts, d'où not_collected.
