# Code de commerce, articles L. 441-10, L. 441-16 et D. 441-5, lus sur Légifrance le 18 octobre 2026.
# L. 441-10 est dans sa rédaction issue de l'ordonnance n° 2019-359 du 24 avril 2019 (en vigueur du
# 26 avril 2019 au 1er janvier 2027) ; la version qui entre en vigueur le 1er janvier 2027
# (ordonnance n° 2026-671 du 27 juillet 2026) a été lue et ne change que la référence de la facture
# périodique (article L. 216-34 du code des impositions sur les biens et services au lieu du 3 du I de
# l'article 289 du code général des impôts). L. 441-16 est en vigueur depuis le 1er novembre 2021
# (ordonnance n° 2021-859 du 30 juin 2021), D. 441-5 depuis le 27 février 2021 (décret n° 2021-211 du
# 24 février 2021).
#
# Ces articles régissent les sommes dues entre professionnels, donc les relations d'un entrepreneur
# avec ses clients privés, ses sous-traitants et ses fournisseurs. Jours calendaires : ils ne visent
# ni jours ouvrés ni jours ouvrables et ne prévoient pas de report lorsque le délai expire un samedi,
# un dimanche ou un jour férié.
