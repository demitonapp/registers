obligations:
- key: payment.commercial_due_date.fr
  duty: Être payé dans le délai convenu, qui ne peut dépasser 60 jours après la date d'émission de la facture, ou
    45 jours fin de mois si le contrat le stipule expressément, et dans les 30 jours de l'exécution de la prestation
    à défaut de convention
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  duty_shape: payment.due_date
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038414392
    clause: art. L. 441-10, I et III
    access_date: '2026-10-18'
