    register: worker_qualification
    system_type: document_store
  clause: art. R. 554-27, IV ; R. 554-31, II et III ; R. 554-35, 8° et 10°
  caveat: 'L''exécutant informe les personnes travaillant sous sa direction de la localisation des ouvrages repérés
    et des mesures de prévention, et s''assure de leur formation, de leur qualification et, le cas échéant, de leur
    autorisation d''intervention à proximité des réseaux (AIPR), systématiquement pour les travaux urgents (art.
    R. 554-31, II). Les règles de compétence et d''autorisation sont fixées par un arrêté non lu ici (art. R. 554-31,
    III). Chaque exécutant maintient en bon état le marquage ou piquetage au fur et à mesure de ses interventions
    (art. R. 554-27, IV) ; y manquer est le manquement 8°, et méconnaître l''article R. 554-31 le manquement 10°
    (art. R. 554-35). Obligation permanente sans délai : pas de fenêtre. Chaque manquement listé à l''article R.
    554-35 est passible d''une amende administrative d''au plus 1 500 euros, doublée en cas de récidive, sans préjudice
    des sanctions pénales du II de l''article L. 554-1-1, non lu ici (art. R. 554-35).'
