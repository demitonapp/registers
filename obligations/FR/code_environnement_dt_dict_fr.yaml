  clause: art. R. 554-33 ; R. 554-35, 6° bis
  window:
    value: 3
    unit: months
  caveat: Les trois mois courent de la consultation du guichet unique faite par l'exécutant (art. R. 554-33, I et
    R. 554-24). Une interruption des travaux de plus de trois mois impose aussi une nouvelle déclaration (art. R.
    554-33, II). Si les travaux durent plus de six mois, ou dépassent le délai annoncé, une nouvelle déclaration
    est due aux exploitants d'ouvrages sensibles pour la sécurité, sauf réunions périodiques planifiées dès le démarrage
    (art. R. 554-33, III). Ne pas renouveler la déclaration est le manquement 6° bis (art. R. 554-35). Chaque manquement
    listé à l'article R. 554-35 est passible d'une amende administrative d'au plus 1 500 euros, doublée en cas de
    récidive, sans préjudice des sanctions pénales du II de l'article L. 554-1-1, non lu ici (art. R. 554-35).
- key: latent_conditions.reseau_imprevu.fr
  duty: Informer par écrit le responsable du projet de tout ouvrage découvert après la commande, et surseoir aux
    travaux adjacents, s'il peut être sensible ou si le sous-sol diffère notablement, jusqu'à son ordre écrit
  consequence: offence
