  clause: art. R. 554-28, I à IV ; R. 554-35, 9°
  caveat: 'L''information écrite vaut pour tout ouvrage découvert après la commande ou la signature du marché ;
    les actions complémentaires donnent lieu à avenant ou à nouveau marché à la charge du responsable du projet
    si le marché ne les a pas prévues (art. R. 554-28, I). Le sursis aux travaux adjacents s''impose si l''ouvrage
    découvert est susceptible d''être sensible pour la sécurité, ou si une différence notable entre le sous-sol
    constaté et les informations reçues crée un risque pour les personnes lié à un ouvrage sensible (art. R. 554-28,
    I et II). Les parties définissent avant le lancement du chantier les modalités de l''arrêt de travaux (art.
    R. 554-28, III). Le marché doit garantir l''exécutant contre tout préjudice d''un arrêt justifié et fixer son
    indemnisation (art. R. 554-28, IV). Engager ou poursuivre des travaux en contradiction avec l''ordre écrit est
    le manquement 9° (art. R. 554-35). Aucun délai chiffré : pas de fenêtre. Chaque manquement listé à l''article
    R. 554-35 est passible d''une amende administrative d''au plus 1 500 euros, doublée en cas de récidive, sans
    préjudice des sanctions pénales du II de l''article L. 554-1-1, non lu ici (art. R. 554-35).'
- key: approvals.dommage_reseau.fr
  duty: Aviser l'exploitant dans les plus brefs délais de toute dégradation, même superficielle, d'un ouvrage en
    service, de tout déplacement accidentel de plus de 10 cm d'un ouvrage souterrain flexible, ou de toute autre
    anomalie
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: approvals.utility_damage_notice
  severity: 3
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074220/LEGISCTA000024643886/
    clause: art. R. 554-29, R. 554-31, II ; R. 554-35, 10°
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: safety_incident
  clause: art. R. 554-29, R. 554-31, II ; R. 554-35, 10°
  caveat: 'L''avis peut prendre la forme d''un constat contradictoire entre l''exécutant et l''exploitant (art.
    R. 554-31, II). Les dispositions immédiates de sécurité à prendre en cas d''endommagement et l''information
    des services de secours sont fixées par un arrêté qui approuve le guide technique (art. R. 554-29), non lu ici
    : cette ligne ne dit donc pas quand arrêter le chantier après un dommage. Mettre en œuvre des travaux sans respecter
    les articles R. 554-29 ou R. 554-31 est le manquement 10° (art. R. 554-35). « Dans les plus brefs délais »,
    sans nombre : pas de fenêtre. Chaque manquement listé à l''article R. 554-35 est passible d''une amende administrative
    d''au plus 1 500 euros, doublée en cas de récidive, sans préjudice des sanctions pénales du II de l''article
    L. 554-1-1, non lu ici (art. R. 554-35).'
- key: own_commitments.aipr.fr
  duty: Informer le personnel de la localisation des réseaux et des mesures de prévention, et s'assurer de sa formation,
    de sa qualification et, le cas échéant, de son autorisation d'intervention à proximité des réseaux
  consequence: offence
  protection_type: check
  disease: non_compliance
