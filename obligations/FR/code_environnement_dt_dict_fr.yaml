# Code de l'environnement, livre V, titre V, chapitre IV (sécurité des réseaux souterrains,
# aériens ou subaquatiques de transport ou de distribution), lu sur Légifrance le 18 octobre
# 2026 dans la version en vigueur : articles R. 554-20 à R. 554-31, R. 554-33 et R. 554-35.
# Les articles R. 554-21, R. 554-22, R. 554-26 et R. 554-35 sont dans leur rédaction issue du
# décret n° 2024-1022 du 13 novembre 2024, en vigueur le 1er janvier 2025.
#
# Les lignes visent l'exécutant des travaux, qui adresse la déclaration d'intention de
# commencement de travaux (DICT). La déclaration de projet de travaux (DT) incombe au
# responsable du projet, en pratique le maître d'ouvrage (art. R. 554-21) ; elle n'est pas
# reprise ici. Le guide technique, les arrêtés d'application (formulaires, AIPR, précision
# des plans, constat contradictoire) et le guichet unique n'ont pas été lus.
#
# Computation : les exploitants répondent dans un délai exprimé en jours, « jours fériés non
# compris » (art. R. 554-22 et R. 554-26) ; samedis et dimanches comptent. La relance
# appelle une réponse en deux jours ouvrés (art. R. 554-26, VI). Le code ne dit pas ici ce qu'il
# advient d'un délai qui expire un samedi ou un dimanche. Sanction : amende administrative
# d'au plus 1 500 euros par manquement, doublée en cas de récidive (art. R. 554-35).
