obligations:
- key: approvals.dict_declaration.fr
  duty: Avant les travaux, consulter le guichet unique et adresser une déclaration d'intention de commencement de
    travaux à chaque exploitant de réseau dont la zone d'implantation est touchée par l'emprise
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: approvals.utility_works_declaration
  severity: 3
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074220/LEGISCTA000024643876/
    clause: art. R. 554-24, R. 554-25 et R. 554-35, 6° bis
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. R. 554-24, R. 554-25 et R. 554-35, 6° bis
  caveat: Vise l'exécutant des travaux (art. R. 554-24 et R. 554-25). Sont dispensés les exploitants exemptés de
    DT au I de l'article R. 554-21 et ceux qui ont indiqué, dans un récépissé de DT de moins de trois mois relatif
    au même projet, ne pas être concernés (art. R. 554-25, I). La DICT reprend exactement les informations de la
    DT et précise l'emprise, la nature des travaux et les techniques opératoires (art. R. 554-25, II). DT et DICT
    peuvent être faites conjointement sur un document unique quand il est matériellement impossible d'attendre la
    réponse à la DT (art. R. 554-25, IV). Le défaut de DICT est le manquement 6° bis de l'article R. 554-35. Chaque
    manquement listé à l'article R. 554-35 est passible d'une amende administrative d'au plus 1 500 euros, doublée
    en cas de récidive, sans préjudice des sanctions pénales du II de l'article L. 554-1-1, non lu ici (art. R.
    554-35). Mappé à offence comme les autres manquements réglementaires sanctionnés, bien qu'il s'agisse d'une
    amende administrative et non pénale. Le registre contract_notice ne distingue pas une DICT d'un autre avis.
- key: approvals.dict_reponses.fr
  duty: 'Ne pas commencer les travaux avant d''avoir les informations de localisation des exploitants : ceux-ci
    répondent dans les sept jours, jours fériés non compris, de la réception d''une DICT dématérialisée'
  consequence: offence
  protection_type: watch
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: approvals.utility_works_response
  severity: 3
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074220/LEGISCTA000024643876/
    clause: art. R. 554-26, I et VI ; R. 554-31, II ; R. 554-35, 7°
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: art. R. 554-26, I et VI ; R. 554-31, II ; R. 554-35, 7°
  window:
    value: 7
    unit: days
  caveat: 'Sept jours pour une DICT dématérialisée, neuf jours pour une DICT papier, jours fériés non compris, à
    compter de la réception de la déclaration dûment remplie ; pour une DT-DICT conjointe, le délai est celui de
    la DT, neuf ou quinze jours (art. R. 554-26, I et R. 554-22, I). Une demande de compléments reporte le départ
    du délai à leur réception (art. R. 554-26, I). Faute de réponse, l''exécutant renouvelle sa déclaration par
    lettre recommandée avec accusé de réception ou moyen équivalent, et l''exploitant répond sous deux jours ouvrés
    (art. R. 554-26, VI). Les travaux ne peuvent être entrepris avant l''obtention de tous les récépissés relatifs
    à des ouvrages sensibles pour la sécurité (art. R. 554-26, VI). Travailler à proximité d''un ouvrage avant d''avoir
    obtenu les informations de localisation est le manquement 7° (art. R. 554-35). Le marché doit prévoir que l''exécutant
    ne subit pas de préjudice d''un retard dû à l''absence de réponse à une relance fondée (art. R. 554-26, VI).
    L''exécutant conserve un exemplaire du récépissé sur le chantier pendant toute sa durée (art. R. 554-31, II).
    Les délais de réponse se comptent en jours, jours fériés non compris : samedis et dimanches sont comptés, seuls
    les jours fériés sont exclus (art. R. 554-26). Chaque manquement listé à l''article R. 554-35 est passible d''une
    amende administrative d''au plus 1 500 euros, doublée en cas de récidive, sans préjudice des sanctions pénales
    du II de l''article L. 554-1-1, non lu ici (art. R. 554-35).'
- key: approvals.dict_renouvellement.fr
  duty: Renouveler la DICT si les travaux ne sont pas entrepris dans les trois mois de la consultation du guichet
    unique, après une interruption de plus de trois mois, ou au-delà de six mois de travaux
