# Code du patrimoine, livre V, titre III, chapitre Ier, section 3 (découvertes fortuites) et
# titre IV, chapitre IV (dispositions pénales), lus sur Légifrance le 18 octobre 2026 dans la
# version en vigueur : articles L. 531-14, L. 531-15, L. 531-19 et L. 544-1 à L. 544-4-1.
#
# « Déclaration immédiate » ne porte pas de nombre : la ligne n'a pas de fenêtre. Le volet
# réglementaire (partie R) et l'archéologie préventive n'ont pas été lus.
