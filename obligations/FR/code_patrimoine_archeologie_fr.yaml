  clause: art. L. 531-14, L. 531-15, L. 544-3 et L. 544-4
  caveat: 'L''obligation pèse sur l''inventeur des vestiges ou objets et sur le propriétaire de l''immeuble ; le
    maire transmet sans délai au préfet (art. L. 531-14). Le propriétaire est responsable de la conservation provisoire
    des vestiges immobiliers, et le dépositaire des objets de leur garde (art. L. 531-14). L''autorité administrative
    peut visiter les lieux, prescrire les mesures de conservation et ordonner la suspension des recherches pour
    six mois à compter de la notification (art. L. 531-14 et L. 531-15). Ne pas déclarer, ou déclarer faussement,
    est puni de 3 750 euros d''amende (art. L. 544-3) ; aliéner ou acquérir un objet dissimulé est puni de deux
    ans d''emprisonnement et de 4 500 euros d''amende (art. L. 544-4). « Déclaration immédiate », sans nombre :
    pas de fenêtre. Dans un marché au CCAG-Travaux 2021, la déclaration est faite par le titulaire conjointement
    avec le maître d''ouvrage (voir approvals.archaeological_find_ccag.fr).'
