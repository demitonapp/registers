# Code de la sécurité sociale, lu sur Légifrance le 18 octobre 2026 dans la version en
# vigueur : articles L. 441-2, R. 441-1 à R. 441-5, L. 471-1 et R. 471-3.
#
# Computation : l'employeur déclare l'accident « dans les quarante-huit heures non compris les
# dimanches et jours fériés » (art. R. 441-3) ; les samedis comptent. Cette bibliothèque ne
# contient pas de calendrier des jours fériés français.
