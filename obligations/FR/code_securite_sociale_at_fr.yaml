  caveat: L'employeur ou l'un de ses préposés déclare tout accident dont il a eu connaissance à la caisse primaire
    dont relève la victime (art. L. 441-2), par tout moyen conférant date certaine à sa réception, dans les quarante-huit
    heures non compris les dimanches et jours fériés (art. R. 441-3). Pour un accident survenu hors des locaux de
    l'établissement à l'une des personnes visées par les 1°, 2°, 4°, 6°, 8° et 13° de l'article L. 311-3, le délai
    ne court que du jour où l'employeur en a été informé (art. R. 441-3). L'attestation de salaire est adressée
    en même temps ou à l'arrêt de travail s'il est postérieur (art. R. 441-4). Le défaut de déclaration est puni
    de l'amende des contraventions de 4e classe, de 5e classe en cas de récidive dans l'année (art. R. 471-3), et
    la caisse recouvre auprès de l'employeur la totalité des dépenses faites à l'occasion de l'accident et peut
    prononcer une pénalité (art. L. 471-1). Le déclencheur notifiable_incident_recorded date l'accident enregistré
    ; le délai court de la connaissance qu'en a l'employeur. Le registre safety_incident ne dit pas si la déclaration
    a été faite, d'où not_collected.
