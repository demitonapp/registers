# Code du travail, lu sur Légifrance le 18 octobre 2026 dans la version en vigueur :
# articles L. 8291-1 à L. 8291-3, R. 8291-1 à R. 8291-6, R. 8292-1 à R. 8292-4, R. 8293-1
# et R. 8294-1 à R. 8294-7 (carte d'identification professionnelle du BTP, rédaction du
# décret n° 2024-112 du 15 février 2024 en vigueur le 1er avril 2024) ; L. 8222-1 à L. 8222-7,
# R. 8222-1 à R. 8222-3, D. 8222-4 et D. 8222-5 (obligation de vigilance) ; L. 4532-9,
# R. 4532-56 à R. 4532-74 et L. 4744-4 et L. 4744-5 (plan particulier de sécurité et de
# protection de la santé, PPSPS).
#
# Modification à venir : la loi n° 2026-534 du 25 juin 2026 (art. 95) crée un article
# L. 8222-1-1 (vigilance du maître de l'ouvrage sur le sous-traitant accepté) et modifie
# L. 8222-2 en conséquence, au plus tard le 26 décembre 2026 (date affichée par Légifrance) ;
# les lignes portent le texte en vigueur au 18 octobre 2026.
#
# Computation : les délais du PPSPS sont exprimés en jours, sans précision ; la vigilance est
# semestrielle. Les articles lus ne disent rien d'un délai qui expire un samedi, un dimanche
# ou un jour férié.
id: code_travail_btp_fr
lang: fr
source: law
instrument_type: act
title: 'Code du travail : carte d''identification professionnelle du BTP, obligation de vigilance et plan particulier
  de sécurité et de protection de la santé'
publisher: République française (Légifrance)
jurisdictions:
- FR
