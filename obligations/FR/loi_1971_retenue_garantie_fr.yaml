# Loi n° 71-584 du 16 juillet 1971 tendant à réglementer les retenues de garantie en matière de
# marchés de travaux définis par l'article 1779-3° du code civil, lue en entier sur Légifrance le
# 18 octobre 2026 (page « en vigueur au 17 octobre 2026 », dernière mise à jour des données du texte :
# 1er janvier 2020). L'article 1er est dans sa rédaction issue de l'ordonnance n° 2019-964 du
# 18 septembre 2019 (tribunal judiciaire), en vigueur le 1er janvier 2020 ; les articles 2 et 3 sont
# d'origine ; l'article 4 (loi n° 72-1166 du 23 décembre 1972) étend la loi aux conventions de
# sous-traitance.
#
# La loi compte en années (« délai d'une année », art. 2), rendu ici par 12 mois faute d'unité
# « années ». Elle ne fixe ni mode de computation ni report d'un délai qui expire un samedi, un
# dimanche ou un jour férié.
