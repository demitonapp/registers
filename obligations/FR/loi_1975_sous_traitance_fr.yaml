obligations:
- key: payment.subcontractor_acceptance.fr
  duty: Faire accepter chaque sous-traitant et agréer les conditions de paiement de chaque sous-traité par le maître
    de l'ouvrage, dès la conclusion et pendant toute la durée du marché, et lui communiquer le sous-traité sur sa
    demande
  consequence: barred
  protection_type: check
  disease: forfeited_entitlements
  approval_class: payments
  duty_shape: payment.subcontractor_acceptance
  severity: 1
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000889241
    clause: art. 1, 2, 3, 15
    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: subcontract
  clause: art. 1, 2, 3, 15
  caveat: 'L''obligation pèse sur l''entrepreneur principal (art. 3, al. 1), et sur tout sous-traitant à l''égard
    de ses propres sous-traitants, puisqu''il est alors considéré comme entrepreneur principal (art. 2). Faute d''acceptation
    et d''agrément, l''entrepreneur principal reste tenu envers le sous-traitant mais ne peut invoquer le sous-traité
    à son encontre (art. 3, al. 2). Le sous-traitant direct non accepté d''un marché relevant du titre II ne bénéficie
    pas du paiement direct, réservé au sous-traitant accepté dont les conditions de paiement ont été agréées (art.
    6). Sont nuls et de nul effet les clauses, stipulations et arrangements qui auraient pour effet de faire échec
    à la loi (art. 15). Dans les marchés publics, l''acceptation suit les articles L. 2193-4 à L. 2193-7 et R. 2193-1
    à R. 2193-4 du code de la commande publique (ligne payment.public_subcontractor_acceptance.fr). « Ne pourra
    invoquer le contrat de sous-traitance » est rendu par barred, la valeur la plus proche de l''énumération. La
    loi ne fixe aucun délai : l''acceptation est due au moment de la conclusion et pendant toute la durée du contrat.
    Aucun registre ne date l''acceptation d''un sous-traitant, d''où not_collected.'
- key: payment.direct_action.fr
  duty: Mettre l'entrepreneur principal en demeure de payer les sommes dues au titre du sous-traité, avec copie
    au maître de l'ouvrage, puis agir directement contre le maître de l'ouvrage si l'entrepreneur principal n'a
    pas payé un mois après
  consequence: guidance
  protection_type: watch
  disease: disputes
  approval_class: payments
  duty_shape: payment.non_payment
  severity: 4
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000889241
    clause: art. 11, 12, 13
    access_date: '2026-10-18'
  evidence: &id001
    kind: record_in_demiton
    register: contract_notice
  clause: art. 11, 12, 13
  window:
    value: 1
    unit: months
  caveat: 'Le titre III s''applique à tous les sous-traités qui n''entrent pas dans le titre II, donc aux marchés
    privés (art. 11, al. 1). Il ne s''applique aux marchés publics soumis à la deuxième partie du code de la commande
    publique que pour ceux de ses livres Ier à III dont le montant est inférieur au seuil fixé en application du
    2° de l''article L. 2193-10, soit 600 euros toutes taxes comprises (art. R. 2193-10 de ce code), et pour ceux
    de son livre V (art. 11, al. 2). L''action ne vise que le paiement des prestations prévues par le sous-traité
    dont le maître de l''ouvrage est effectivement bénéficiaire (art. 13, al. 1). Les obligations du maître de l''ouvrage
    sont limitées à ce qu''il doit encore à l''entrepreneur principal à la date de réception de la copie de la mise
    en demeure (art. 13, al. 2) : une copie tardive réduit ce qui peut être recouvré. Toute renonciation à l''action
    directe est réputée non écrite, et l''action subsiste en cas de liquidation, de règlement judiciaire ou de suspension
    provisoire des poursuites de l''entrepreneur principal (art. 12, al. 2 et 3). Le deuxième alinéa de l''article
    1799-1 du code civil (versement d''un crédit spécifique) s''applique au sous-traitant qui remplit ces conditions
    (art. 12, al. 4). Le délai d''un mois court de la mise en demeure ; la loi n''impose pas de forme à celle-ci
    et ne fixe ni mode de computation ni report d''un délai qui expire un samedi, un dimanche ou un jour férié.'
- key: payment.subcontract_payment_guarantee.fr
  duty: Garantir, à peine de nullité du sous-traité, le paiement de toutes les sommes dues au sous-traitant par
    une caution personnelle et solidaire d'un établissement qualifié, sauf à déléguer le maître de l'ouvrage au
    sous-traitant à concurrence des prestations qu'il a exécutées
  consequence: barred
  protection_type: check
  disease: forfeited_entitlements
  approval_class: payments
  duty_shape: payment.payment_guarantee
  severity: 1
  grade: primary_read
  citation:
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000889241
    clause: art. 6, 13-1, 14
    access_date: '2026-10-18'
  evidence:
    kind: not_collected
    register: bank_guarantee
  clause: art. 6, 13-1, 14
  caveat: 'La caution est obtenue d''un établissement qualifié, agréé dans des conditions fixées par décret ; elle
    n''a pas lieu d''être fournie si l''entrepreneur délègue le maître de l''ouvrage au sous-traitant, à concurrence
    du montant des prestations exécutées par celui-ci (art. 14). La sanction est la nullité du sous-traité, que
    l''article 14 prononce sans en préciser le régime. Le sous-traitant direct d''un marché relevant du titre II
    est payé directement ; c''est le sous-traitant qui confie une partie de ce marché à un autre sous-traitant qui
    doit lui délivrer la caution ou la délégation (art. 6, al. 4), règle que l''article L. 2193-14 du code de la
    commande publique reprend pour les marchés publics. L''entrepreneur principal ne peut céder ou nantir l''intégralité
    des créances du marché qu''après avoir obtenu, préalablement et par écrit, ce cautionnement vis-à-vis des sous-traitants
    (art. 13-1). La loi ne fixe aucun délai : la garantie doit couvrir toutes les sommes dues en application du
    sous-traité. « À peine de nullité du sous-traité » est rendu par barred, la valeur la plus proche de l''énumération.
    Aucun registre ne relie une caution à un sous-traité, d''où not_collected.'
- key: payment.subcontractor_regularisation_notice.fr
  duty: Régulariser l'acceptation, l'agrément et la déclaration du sous-traitant présent sur le chantier dès la
    mise en demeure du maître de l'ouvrage, et justifier de la caution lorsque le sous-traitant accepté ne bénéficie
    pas d'une délégation de paiement
