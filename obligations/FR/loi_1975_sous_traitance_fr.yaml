  citation:
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000889241
    clause: art. 14-1
    access_date: '2026-10-18'
  evidence: *id001
  clause: art. 14-1
  caveat: 'Pour les contrats de travaux de bâtiment et de travaux publics, le maître de l''ouvrage qui a connaissance
    de la présence sur le chantier d''un sous-traitant n''ayant pas fait l''objet des obligations des articles 3
    ou 6, ainsi que de l''article 5, doit mettre l''entrepreneur principal ou le sous-traitant en demeure de s''en
    acquitter, en marché public comme en marché privé (art. 14-1, premier tiret). Si le sous-traitant accepté, dont
    les conditions de paiement sont agréées, ne bénéficie pas de la délégation de paiement, le maître de l''ouvrage
    doit exiger de l''entrepreneur principal qu''il justifie avoir fourni la caution (art. 14-1, second tiret).
    Ces obligations ne visent pas la personne physique qui construit un logement pour l''occuper elle-même ou le
    faire occuper par son conjoint, ses ascendants, ses descendants ou ceux de son conjoint (art. 14-1). Elles s''étendent
    au contrat de sous-traitance industrielle : la mise en demeure, lorsque le maître de l''ouvrage en connaît l''existence
    même si le sous-traitant n''est pas sur le chantier, et l''exigence de la caution (art. 14-1, dernier alinéa).
    Ce sont des obligations du maître de l''ouvrage : l''article ne fixe aucun délai de régularisation et n''énonce
    aucune sanction. La mise en demeure reçue se consigne comme une notification, d''où contract_notice.'
