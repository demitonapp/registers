# Loi n° 75-1334 du 31 décembre 1975 relative à la sous-traitance, lue en entier sur Légifrance le
# 18 octobre 2026 (page « en vigueur au 17 octobre 2026 », dernière mise à jour des données du texte :
# 1er avril 2019). Aucun article n'a été modifié depuis l'ordonnance n° 2018-1074 du 26 novembre 2018 ;
# l'article 14 est dans sa rédaction issue de l'ordonnance n° 2016-131 du 10 février 2016 et
# l'article 14-1 dans celle de la loi n° 2005-845 du 26 juillet 2005.
#
# Titre II (paiement direct, art. 4 à 10) : tous ses articles restent en vigueur, mais depuis le
# 1er avril 2019 il ne s'applique plus qu'aux marchés passés par les entreprises publiques qui ne
# sont pas des acheteurs soumis au code de la commande publique (art. 4). Pour les acheteurs soumis
# au code, le paiement direct relève des articles L. 2193-10 à L. 2193-13 et R. 2193-10 à R. 2193-16
# de ce code, portés par code_commande_publique_fr ; aucune ligne ne cite donc le titre II. Les
# articles 15-1 et 15-2 sont abrogés par la même ordonnance et ne sont pas cités.
#
# La loi compte en mois (art. 12) et ne fixe ni mode de computation ni report d'un délai qui expire
# un samedi, un dimanche ou un jour férié. Elle ne prévoit aucune sanction pénale.
