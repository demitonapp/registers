# CLOCS Standard, Version 5 (November 2024), read in full from clocs.org.uk on
# 2026-10-21. CLOCS (Construction Logistics and Community Safety) is a UK standard,
# not law. It binds a party
# through a planning condition (s 3) or a contract (ss 4.2, 5.4), so every row's
# consequence is `breach`, except cl 5.13, which is a "should" and is `guidance`.
#
# Read: ss 2 to 7 (definitions, regulators, clients, principal contractors, site
# operators, fleet operators). Rows cover the client duties (4.1 to 4.5), the
# principal contractor duties (5.1 to 5.13) and the fleet operator duty (7.1).
# Regulator duties (s 3) bind planning authorities, not a contractor, and site
# operator duties (s 6) restate the principal contractor and fleet operator
# rows for whoever holds them, so neither has rows of its own.
#
# Where it applies: CLOCS is national across the UK. This library has no code
# for Great Britain alone, so the instrument carries `GB`, as the CDM 2015 rows
# do; Demiton writes it up for England, the only UK project place it supports.
#
# Two windows are the Standard's own approximation ("approximately six-monthly",
# cl 4.4(a)(i) and 5.11(a)) and one is quarterly (cl 5.11(c)); every other
# timing is "regular", "frequent", "as soon as reasonably practicable" or the
# start of a construction phase, with no number, so those rows carry no window.
