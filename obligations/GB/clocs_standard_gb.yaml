    that engages the operator requires CLOCS. FORS Silver accreditation itself is not a CLOCS requirement; another
    accreditation scheme or management system may show the same standard. A heavy goods vehicle is one over 3.5
    tonnes gross vehicle weight (s 2). No register holds it, so this is recorded not_collected.
