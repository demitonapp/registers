# The Scheme for Construction Contracts (England and Wales) Regulations 1998,
# as amended for England by S.I. 2011/2333. Read in full from legislation.gov.uk
# on 2026-10-09, latest available (revised) version in force from 1 October
# 2011, with the amending S.I. 2011/2333 (as made) read the same day.
# legislation.gov.uk lists no outstanding effects for the Scheme as at
# 2026-10-09.
#
# The Scheme is a default, not a floor. Its Part I adjudication provisions
# apply only where the contract does not meet s 108(1) to (4) of the Act (reg
# 2), and each Part II payment provision only where the parties failed to agree
# that matter or the contract does not make the provision ss 110 or 110A
# require (reg 3). Where it applies, it has effect as implied terms of the
# contract (Act s 114(4)), so a breach of it is a breach of contract. Every
# row below holds only when the Scheme applies to that point; a compliant
# contract's own period replaces it. Rules the Act states for every contract
# are in hgcra_1996_part2_gb.
#
# Where it applies: England only, as transcribed. The Regulations extend to
# England and Wales (reg 1(2)), but S.I. 2011/2333 applies only to contracts
# for operations in England entered into on or after 1 October 2011 (its reg
# 1(2), (3)). Wales amended the Scheme by its own instrument, which was not
# read, and Scotland has a separate Scheme. This library has no code for
# England, so the instrument carries `GB`, the ISO 3166-1 code for the whole
# United Kingdom, and every row's caveat says England.
#
# The Scheme states no rule for reckoning periods of its own; the Act's s 116
# reckons periods "for the purposes of this Part" (begin after the date,
# exclude Christmas Day, Good Friday and bank holidays). Windows are recorded
# in calendar days.
