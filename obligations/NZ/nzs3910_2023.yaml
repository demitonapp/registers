    clause: cl 10.3.2 (2023); DZ 10.3.6(c)
    access_date: '2026-09-16'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  research_row: ND2
  clause: cl 10.3.2 (2023); DZ 10.3.6(c)
  window:
    value: 20
    unit: working_days
  caveat: 20 WD after becoming aware, to the Contract Administrator and Independent Certifier; a continuing
    delay may be notified more than once. Not a bar; lateness and its cost are weighed instead (DZ cl
    10.3.6(c), draft only).
