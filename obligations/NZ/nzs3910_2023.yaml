obligations:
- key: closeout.final_account.nzs3910_2023
  duty: Submit the final account within 3 months of practical completion
  consequence: barred
  protection_type: countdown
  disease: disputes
  approval_class: payments
  duty_shape: closeout.final_claim
  severity: 1
  grade: primary_via_secondary
  citation:
    url: https://contractormag.co.nz/contractor/nzs-39102023-final-account-mechanism/
    clause: cl 9.11
    access_date: '2026-09-16'
  evidence:
    kind: register
    register: progress_claim
    system_type: finance
  research_row: NC5
  clause: cl 9.11
  window:
    value: 3
    unit: months
  caveat: Interim Final Account due within 3 Months of practical completion by default (recorded here);
    the Final Account is due 20 Working Days after the Final Completion Certificate, and the Independent
    Certifier decides it if unagreed after 3 Months. Conclusive under cl 9.11.6 - mapped to barred (once
    conclusive, further claims are shut out).
- key: delay_eot.early_warning.nzs3910_2023
  duty: Give an early warning of an event likely to affect time or cost
  consequence: guidance
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: variations_claims
  duty_shape: delay_eot.early_warning
  severity: 4
  grade: primary_read
  citation:
    url: https://www.masterbuilder.org.nz/assets/publicdocs/Clause%209.2%20%20Special%20Conditions%20-%20Info%20Sheet.pdf
    clause: DZ cl 6.10
    access_date: '2026-09-16'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  research_row: ND5
  clause: DZ cl 6.10
  caveat: As soon as a party becomes aware of a likely material price, delay or statutory-breach matter.
    A Variation is valued as if notice had been given (cl 6.10.3). 2023 published wording not confirmed
    - read from the DZ draft only. No 'early_warning' member in the notice_kind vocabulary; recorded as
    'other'.
- key: delay_eot.eot_notice.nzs3910_2023
  duty: Give notice of an extension of time claim within 20 working days
  consequence: guidance
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: variations_claims
  duty_shape: delay_eot.eot_claim
