# Washington's registration of contractors, chapter 18.27 RCW, read on
# app.leg.wa.gov on 2026-10-18: ss 18.27.010 to 18.27.111, 18.27.200, 18.27.205,
# 18.27.250, 18.27.270 and 18.27.340 in full, and the section list. The chapter
# was last amended by 2026 c 77 (ss 18.27.010, 18.27.060), and the bond amounts
# by 2023 c 213 (s 18.27.040). Registration is with the Department of Labor
# and Industries (L&I).
#
# "Contractor" is wide: anyone who, in an independent business, undertakes,
# offers or bids to build, alter, repair, improve, develop or demolish any
# building, highway, road, railroad, excavation or other structure, project or
# improvement attached to real estate (s 18.27.010(1)(a)). Civil work is in
# scope, subject to the s 18.27.090 exemptions, two of which matter on a civil
# job: work within a site or reservation under federal jurisdiction (s
# 18.27.090(7)) and contractors on highway projects prequalified with the
# Department of Transportation under RCW 47.28.070 (s 18.27.090(16)). Public
# works contracts with unregistered contractors are dealt with in RCW
# 39.06.010 (s 18.27.111), which this read did not cover.
#
# Only the renewal row carries a period (the 2 year certificate). RCW 1.12.040
# excludes the first day and includes the last, and excludes a last day that
# is a holiday, Saturday or Sunday.
