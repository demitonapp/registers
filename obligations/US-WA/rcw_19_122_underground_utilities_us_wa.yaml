# Washington's underground utility damage prevention act, chapter 19.122 RCW,
# read in full from app.leg.wa.gov on 2026-10-18 (every section, 19.122.010 to
# 19.122.901), as last amended by 2025 c 292. The 2025 amendments added the
# positive response rule (an excavator may not start until every operator in
# the notified area has responded, from 1 January 2026, s 19.122.030(5)) and
# the misdemeanor for digging near a transmission pipeline before the
# work-to-begin date or a positive response (s 19.122.090(2), (3)).
#
# The chapter defines a business day as any day other than Saturday, Sunday,
# or a legal local, state, or federal holiday (s 19.122.020(3)), and measures
# the locate notice in full business days. Its other periods (45 days for marks
# and for the damage report) are calendar days. RCW 1.12.040 (read the same
# day) computes a time within which an act is to be done by excluding the first
# day and including the last, and excludes the last day too if it is a
# holiday, Saturday or Sunday. This library holds no Washington holiday
# calendar.
#
# Penalties: most violations carry a civil penalty enforced by the Utilities
# and Transportation Commission (ss 19.122.070, 19.122.140, 19.122.150); only
# digging near a transmission pipeline without a code, before the work-to-begin
# date or before positive response, and giving a false code, are crimes
# (misdemeanors, ss 19.122.090, 19.122.110). Rows whose penalty is civil are
# mapped to breach, and each caveat says when the misdemeanor applies.
