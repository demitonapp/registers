# Washington's law on what a contractor finds in the ground, read in full from
# app.leg.wa.gov on 2026-10-18: chapter 27.53 RCW (archaeological sites and
# resources, every section 27.53.010 to 27.53.150), chapter 27.44 RCW (Indian
# graves and records, 27.44.020 to 27.44.901) and RCW 68.50.645 (skeletal
# human remains).
#
# ONE combined instrument, not three, because the three are written to be read
# together: s 27.53.060(1) carves Indian graves, cairns and glyptic or painted
# records out of the permit offence and sends them to the felony in s 27.44.040;
# s 27.44.055 and s 68.50.645 state the same human remains duty in the same
# words (both enacted by 2008 c 275); and s 27.44.040(4) makes a proper report
# of an accidental discovery part of the defence. Each row cites its own
# section URL.
#
# Neither chapter requires a contractor to stop and report an archaeological
# find that is not human remains: s 27.53.070(1) only encourages persons who
# know of a site to tell the Department of Archaeology and Historic
# Preservation (DAHP). The binding find duty is the human remains row. No
# contractor duty here carries a day count ("in the most expeditious manner
# possible" has no number), so no row has a window. The coroner's, DAHP's and
# the tribes' later steps run in business days, which these sections do not
# define; RCW 1.12.040 excludes the first day and includes the last, and
# excludes a last day that is a holiday, Saturday or Sunday. This library holds
# no Washington holiday calendar.
