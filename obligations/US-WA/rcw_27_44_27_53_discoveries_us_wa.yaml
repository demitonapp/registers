- key: approvals.archaeological_permit.us-wa
  duty: Hold the written permit of the director of the Department of Archaeology and Historic Preservation
    before knowingly digging into, altering or removing any part of an archaeological site, and keep it
    on site while the work goes on
  consequence: offence
  protection_type: check
  disease: non_compliance
