# Chapter 39.04 RCW (Public works), read on app.leg.wa.gov/RCW on 2026-10-18:
# RCW 39.04.152(5), 39.04.250, 39.04.320 and both versions of 39.04.350. The
# latest session laws in the chapter are 2026 c 97 (RCW 39.04.152) and 2026 c
# 183. RCW 39.04.250 dates from 1992 c 223 (in force 1 September 1992), RCW
# 39.04.320 was last amended by 2023 c 342 s 1 (in force 1 July 2024), and RCW
# 39.04.350 is in force as amended by 2025 c 63 s 1 and 2025 c 173 s 1 until 1
# July 2027, when the version amended by 2025 c 63 s 2 replaces it.
#
# The bidder responsibility criteria in RCW 39.04.350(1) and (2) are a bid-stage
# eligibility test, not a contract duty, and carry no row; the prime
# contractor's duty to verify its subcontractors' responsibility sits in RCW
# 39.06.020, which was not read. Days are counted under RCW 1.12.040 (the first
# day excluded, the last included unless it is a Saturday, Sunday or holiday,
# which is then also excluded). This library holds no Washington holiday
# calendar.
