# Chapter 39.08 RCW (Contractor's bond), read in full from app.leg.wa.gov/RCW
# on 2026-10-18. The latest session law in the chapter is 2025 c 103 s 2 (RCW
# 39.08.030). RCW 39.08.010 was last amended by 2017 c 75, 39.08.015 dates from
# 1909, and 39.08.065 was last amended by 2011 c 336. Read with RCW 39.04.152(5)
# (small works bonds) and RCW 60.28.011 (retainage).
#
# The bond is required whenever the state, a county, a municipality or another
# public body contracts for work (RCW 39.08.010(1)(a)). Days are counted under
# RCW 1.12.040 (the first day excluded, the last included unless it is a
# Saturday, Sunday or holiday, which is then also excluded). This library holds
# no Washington holiday calendar.
