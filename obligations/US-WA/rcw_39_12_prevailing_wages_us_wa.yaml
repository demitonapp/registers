# Chapter 39.12 RCW (Prevailing wages on public works), read in full from
# app.leg.wa.gov/RCW on 2026-10-18. The latest session law in the chapter is
# 2026 c 105 (RCW 39.12.105). The sections these rows rely on were last amended
# by 2025 c 99 s 2 (RCW 39.12.010, in force 1 January 2026), 2025 c 99 s 3
# (RCW 39.12.120), 2023 c 395 s 29 (RCW 39.12.040), 2023 c 88 (RCW 39.12.050,
# .055, .065), 2023 c 145 (RCW 39.12.055) and 2011 c 92 (RCW 39.12.110).
#
# The chapter binds the prime contractor and every subcontractor tier on a
# public work of the state or any county, municipality or political subdivision
# (RCW 39.12.020, .040); "contractor" includes any prime contractor,
# subcontractor or other employer (RCW 39.12.010(8)). It does not apply to
# workers regularly employed by the public body (RCW 39.12.020). Its penalties
# are civil, imposed by the director of labor and industries after a hearing
# under chapter 34.05 RCW; the legislature's 2019 finding records the shift in
# the 1980s from criminal to civil penalties, so no row is an offence. Filing
# runs through the department of labor and industries' online system, which the
# statute names (RCW 39.12.120(2)); no lni.wa.gov page was read, so no row
# states L&I's own procedure. Days are counted under RCW 1.12.040 (the first day
# excluded, the last included unless it is a Saturday, Sunday or holiday, which
# is then also excluded); the reviser's note there records that the courts treat
# it as of general application. This library holds no Washington holiday
# calendar.
