    unit: working_days
  caveat: Applies on written contracts for public works when the public body withholds part or all of a payment
    for unsatisfactory performance or because the request does not comply with the contract (RCW 39.76.011(2)(b)).
    A notice that does not state the reasons and remedial actions costs the public body interest at 1% per month
    from the ninth working day after receipt of the request until the contractor receives a notice that does (RCW
    39.76.011(2)(c)). A withheld amount is due within 30 calendar days after the prime contractor satisfactorily
    completes the remedial actions, and carries interest from the thirty-first calendar day until paid (RCW 39.76.011(2)(d)).
    The section counts from the public body's receipt of the request, while claim_lodged dates the request when
    given; an invoice is received when date-stamped or marked as delivered, and otherwise on its own date (RCW 39.76.011(3)(b)).
    The chapter does not define a working day. RCW 1.12.040 excludes the first day and includes the last, unless
    the last day is a Saturday, Sunday or holiday, in which case that day is also excluded.
- key: payment.public_body_interest.us-wa
  duty: Charge the public body interest at 1% per month, and at least USD 1 a month, on any amount it does not pay
    on time
  consequence: guidance
  protection_type: check
