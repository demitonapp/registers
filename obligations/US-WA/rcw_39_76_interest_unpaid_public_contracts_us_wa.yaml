# Chapter 39.76 RCW (Interest on unpaid public contracts), read in full from
# app.leg.wa.gov/RCW on 2026-10-18. RCW 39.76.011 dates from 1992 c 223 s 1
# (in force 1 September 1992) and RCW 39.76.020 was last amended by 2009 c
# 219; no later session law amends the chapter.
#
# The chapter binds every state agency, county, city, town, school district,
# board, commission and other public body on written contracts for public works,
# personal services, goods and services, equipment and travel (RCW
# 39.76.011(1)), and the prime contractor on a public works contract when it
# withholds from a subcontractor (RCW 39.76.011(2)(e)). It mixes calendar days
# and working days and defines neither; days are counted under RCW 1.12.040 (the
# first day excluded, the last included unless it is a Saturday, Sunday or
# holiday, which is then also excluded). This library holds no Washington
# holiday calendar.
