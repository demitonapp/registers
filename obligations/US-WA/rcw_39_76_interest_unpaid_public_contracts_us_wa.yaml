    clause: RCW 39.76.011(2)(e)
    access_date: '2026-10-18'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  clause: RCW 39.76.011(2)(e)
  window:
    value: 8
    unit: working_days
  caveat: Applies to the prime contractor on a public works contract that, after requesting payment from the public
    body and before paying the subcontractor, discovers that part or all of the subcontractor's payment is subject
    to withholding under the subcontract for unsatisfactory performance (RCW 39.76.011(2)(e)(i)). The subcontract
    must allow the withholding, and the notice is given as soon as practicable after the cause is determined and
    before the subcontractor's payment is due (RCW 39.76.011(2)(e)(i)(A)). A prime contractor that does not follow
    the notice and payment rules owes the subcontractor interest on the withheld amount at 1% per month from the
    eighth working day (RCW 39.76.011(2)(e)(ii)). The 10 day rule for paying amounts not withheld is in rcw_39_04_public_works_us_wa.
    The chapter does not define a working day. RCW 1.12.040 excludes the first day and includes the last, unless
    the last day is a Saturday, Sunday or holiday, in which case that day is also excluded.
