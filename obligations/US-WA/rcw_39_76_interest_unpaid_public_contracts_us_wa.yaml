  clause: RCW 39.76.011(1), 39.76.020, 39.76.040
  caveat: The chapter does not apply to interagency or intergovernmental transactions; to expense reimbursements
    of public employees; to belated claims for any delinquency after July 31 following the second year of the fiscal
    biennium; to a claim in good faith dispute where, before the date of timely payment, notice of the dispute is
    sent by certified mail, personally delivered or sent as the contract provides; to delinquencies from natural
    disasters, disruption of postal or delivery service, labor dispute work stoppages, power failures or any other
    cause clearly beyond the public body's control; to contracts entered before 26 July 1981; or to payments from
    the listed retirement systems (RCW 39.76.020). The prevailing party in an action to collect the interest is
    entitled to reasonable attorney fees (RCW 39.76.040). The progress_claim register holds the amount but not the
    interest charged on it, so this is recorded not_collected.
- key: payment.subcontractor_withholding_notice.us-wa
  duty: Before withholding a subcontractor's payment for unsatisfactory performance, give it notice of the remedial
    action needed before its payment is due, copy the notice to the public body, and pay within 8 working days after
    the remedy is complete
  consequence: guidance
  protection_type: watch
