  window:
    value: 30
    unit: days
  caveat: 'On a contract funded by grant or federal money the public body pays the prime contractor for satisfactory
    performance within 30 calendar days of receiving a payment request that complies with the contract, or of actually
    receiving the grant or federal money, whichever is later (RCW 39.76.011(2)(a)). A payment is made when mailed
    or personally delivered (RCW 39.76.011(3)(a)). An invoice is received when date-stamped or otherwise marked
    as delivered, and otherwise on the date of the invoice (RCW 39.76.011(3)(b)). Late payment carries interest
    at 1% per month (its own row). No trigger is set, as for the other jurisdictions'' due date rows. Calendar days:
    the chapter defines no business day. RCW 1.12.040 excludes the first day and includes the last, unless the last
    day is a Saturday, Sunday or holiday, in which case that day is also excluded.'
- key: payment.public_works_withholding_notice.us-wa
  duty: Receive any written notice that a public works payment is withheld, stating specifically why and the remedial
    action required, within 8 working days after the public body receives the payment request
  consequence: guidance
