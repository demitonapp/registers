# Washington Industrial Safety and Health Act (WISHA), chapter 49.17 RCW, read
# on app.leg.wa.gov on 2026-10-18: ss 49.17.120, 49.17.140, 49.17.180 and
# 49.17.190 in full, and the section list. Section 49.17.140 was last amended
# by 2026 c 77 s 16 (notice by a tracked or delivery-confirmed method,
# electronic or not), s 49.17.120 by 2026 c 19 s 1.
#
# Only one row is drawn from the Act. Its incident reporting duty is in WAC
# 296-27-031 (see wac_296_27_incident_reporting_us_wa), so the contractor-facing
# duty here with a clear window that that instrument does not cover is the
# appeal of a citation. The Act counts it in working days and does not define
# a working day. WAC 296-155-012 (construction, read the same day) defines one
# for that chapter as a calendar day except Saturdays, Sundays and legal
# holidays under RCW 1.16.050, excluding the first working day and including
# the last; that definition is stated for chapter 296-155 WAC only. RCW
# 1.12.040 excludes the first day and includes the last, and excludes a last
# day that is a holiday, Saturday or Sunday. This library holds no Washington
# holiday calendar.
