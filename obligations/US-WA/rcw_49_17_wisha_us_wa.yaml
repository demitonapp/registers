  caveat: 'Binds the employer cited after an inspection or investigation (s 49.17.140(1)). The same 15 working
    days apply to a notice that a cited violation was not corrected and to a notice of violating an order
    of immediate restraint (s 49.17.140(2), (3)). The period runs from the communication of the notice, which
    the department must send by a method that can be tracked or whose delivery can be confirmed (s 49.17.140(1)),
    and before its first electronic notice it must offer the employer a nonelectronic method (s 49.17.140(8)). If the director reassumes
    jurisdiction, the redetermination is due within 75 working days and becomes final unless appealed to
    the Board of Industrial Insurance Appeals within 15 working days (s 49.17.140(4)). A notice of appeal
    stays the citation and penalty, but not an order of immediate restraint (s 49.17.140(4)). An appeal of
    a serious, willful or repeated serious violation, or a failure to abate one, does not stay the abatement
    dates unless the notice of appeal asks for a stay, and abatement is stayed only while that request is
    pending or once it is granted (s 49.17.140(5)(a), (f)). Each citation must be posted prominently
    at or near each place a violation occurred (s 49.17.120(3)), and none may issue more than 6 months after
    the inspection (s 49.17.120(4)). The Act does not define a working day, so this row reads one as a calendar
    day other than a Saturday, Sunday or legal holiday, the definition WAC 296-155-012 gives for the construction
    rules. No register records a citation or its date of communication, so this is recorded not_collected.'
