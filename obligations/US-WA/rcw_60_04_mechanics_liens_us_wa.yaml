# Chapter 60.04 RCW (Mechanics' and materialmen's liens), read in full from
# app.leg.wa.gov/RCW on 2026-10-18. The latest session law in the chapter is
# 2008 c 6 s 641 (RCW 60.04.211); the sections these rows rely on were last
# amended by 1992 c 126 (RCW 60.04.011, .031, .091, .141) or date from 1991 c
# 281 (RCW 60.04.021, .101, .131, .261), 1984 c 202 as amended by 1991 c 281
# (RCW 60.04.230) and 2006 c 192 (RCW 60.04.081).
#
# These rows are for private works: the lien attaches to the owner's interest
# in the improved land (RCW 60.04.051). On a public work, the remedies these
# instruments record are the retainage lien (chapter 60.28 RCW) and the bond
# claim (chapter 39.08 RCW). A contractor or subcontractor that must be
# registered or licensed has lien rights only if it is (RCW 60.04.011(11),
# 60.04.041). Days are counted under RCW 1.12.040 (the first day excluded, the
# last included unless it is a Saturday, Sunday or holiday, which is then also
# excluded). This library holds no Washington holiday calendar.
