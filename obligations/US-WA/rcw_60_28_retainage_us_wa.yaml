# Chapter 60.28 RCW (Lien for labor, materials, taxes on public works), read in
# full from app.leg.wa.gov/RCW on 2026-10-18. The latest session law in the
# chapter is 2017 c 302 s 1 (RCW 60.28.011); RCW 60.28.015 was last amended by
# 1986 c 314, 60.28.021 by 2009 c 432, 60.28.030 by 2012 c 117, 60.28.040 by
# 2014 c 97, 60.28.051 by 2009 c 432 and 60.28.060 by 2012 c 117. Read with RCW
# 39.12.040 (the affidavit of wages paid before retainage is released) and RCW
# 39.04.152(5) (small works retainage).
#
# The chapter governs every public improvement contract of the state or a
# county, city, town, district, board or other public body, other than for
# professional services (RCW 60.28.011(12)). A contract funded in whole or part
# by federal transportation funds holds no retainage and relies on the chapter
# 39.08 RCW bond (RCW 60.28.011(1)(b)), and a farmers home administration
# project is outside RCW 60.28.011(1) to (9) (RCW 60.28.011(10)). The
# department of revenue (DOR), the employment security department (ESD) and the
# department of labor and industries (L&I) each certify the contractor's taxes
# before retainage is paid out. Days are counted under RCW 1.12.040 (the first
# day excluded, the last included unless it is a Saturday, Sunday or holiday,
# which is then also excluded). This library holds no Washington holiday
# calendar.
