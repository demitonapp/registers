# Washington's rule for reporting a serious work-related incident to the
# Division of Occupational Safety and Health (DOSH) of the Department of Labor
# and Industries, read in full from app.leg.wa.gov on 2026-10-18: WAC
# 296-27-031 as amended by WSR 25-18-088 (filed 2 September 2025, effective 3
# October 2025). Read with the rule its own notes point to, WAC 296-800-320
# (summary) and 296-800-32010 to 32025 (the safety and health core rules on
# not moving equipment, assisting the investigation and the preliminary
# investigation), last amended by WSR 18-22-116, effective 7 December 2018.
# The core rules apply to construction work except where chapter 296-155 WAC
# (construction) conflicts with them (WAC 296-155-005(2), read the same day).
# This read did not search chapter 296-155 WAC for a conflicting rule.
#
# The windows are in hours (8 and 24), so no weekend or holiday rule applies.
# A rule states no penalty of its own: contravening a WISHA rule is cited by
# L&I and penalised under RCW 49.17.180 (read the same day): up to USD 7,000
# for each serious or other violation, up to USD 70,000 for a willful or
# repeated one with a USD 5,000 minimum for willful, or the higher federal
# maximum if a state plan requires it. A willful and knowing violation that
# causes an employee's death is a gross misdemeanor (RCW 49.17.190(3)).
# Because the penalty for missing a report is civil, the rows are mapped to
# breach.
id: wac_296_27_incident_reporting_us_wa
