# South Africa's Occupational Health and Safety Act 85 of 1993. Its own
# incident-reporting duty, s 24(1), says only "within the prescribed period and
# in the prescribed manner": the 7 days and the forms are in the General
# Administrative Regulations, 2003, so the reporting rows live in
# general_administrative_regulations_2003_za.yaml. This file carries the one
# incident duty the Act states in full. Read on 2026-10-09 from the Department of
# Employment and Labour's copy, which shows the Act as amended by Act 181 of 1993.
