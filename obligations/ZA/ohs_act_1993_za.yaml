  caveat: >-
    Binds any person. The site may still be disturbed as far as needed to prevent a further incident, remove
    the injured or dead, or rescue people from danger. It lasts until an inspector consents, with no day
    count, so no window is recorded. Section 38(1)(a) makes a breach of s 24(1) or (2) an offence: a fine
    of up to R50,000 or up to one year's imprisonment, or both, as the copy read states it (later changes to
    fine amounts were not checked). The incidents s 24(1) makes reportable are a death, unconsciousness,
    loss of a limb, an injury or illness likely to cause death, a permanent physical defect or at least 14
    days off work, a major incident, and four kinds of dangerous occurrence; notifiable_incident_recorded is
    the closest event type, though this duty covers a narrower set. Nothing in the Act or its copy read was
    found amending s 24 after 1993. No register records the site's release by an inspector, so this is
    recorded not_collected.
