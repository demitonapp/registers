# SM031 M2: the model WHS Act, held once for every state and territory that
# enacted it. Seven concretes extend this base (ACT, NSW, NT, QLD, SA, TAS, WA);
# before SM031 each carried these three duties word for word. A base binds no
# job, is never vendored and is never run (decision 8).
#
# `whs.incident_notice` carries no caveat here: every state's penalty and any
# local widening differ, so each concrete supplies its own. The other two duties
# share one caveat across all seven, so it is written once, here.
id: model_whs_act_2011
source: law
instrument_type: act
title: Model Work Health and Safety Act (Safe Work Australia model law)
publisher: Safe Work Australia
jurisdictions: []
abstract: true
model_type: model_law
citation:
  url: https://www.safeworkaustralia.gov.au/doc/model-work-health-and-safety-act
  version: Model WHS Act as published by Safe Work Australia, the text each harmonised state and territory enacted
  access_date: '2026-09-30'
obligations:
- key: whs.incident_notice
  duty: Notify the regulator immediately after becoming aware of a notifiable incident
  consequence: offence
  protection_type: watch
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: whs.incident_notice
  trigger: notifiable_incident_recorded
  severity: 3
  grade: primary_read
  citation:
    url: https://www.safeworkaustralia.gov.au/doc/model-work-health-and-safety-act
    clause: s 38(1)-(3)
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: safety_incident
  clause: s 38(1)-(3)
- key: whs.incident_written_notice
  duty: Give written notice of a notifiable incident within 48 hours when the regulator requires it
  consequence: offence
  protection_type: watch
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: whs.incident_written_notice
  trigger: written_notice_required
  severity: 3
  grade: primary_read
  citation:
    url: https://www.safeworkaustralia.gov.au/doc/model-work-health-and-safety-act
    clause: s 38(4)
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: safety_incident
  clause: s 38(4)
  window:
    value: 48
    unit: hours
  caveat: 'Runs from the regulator''s requirement, not from the incident. It carries no penalty of its
    own: a failure is a failure of s 38(1)''s duty. The safety_incident register records when the regulator
    required it (written_notice_required_at, the trigger of this duty), but not whether or when the notice
    was given, so this is recorded not_collected.'
- key: whs.incident_record
  duty: Keep a record of each notifiable incident for at least 5 years from the day notice is given
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  duty_shape: whs.incident_record
  severity: 3
  grade: primary_read
  citation:
    url: https://www.safeworkaustralia.gov.au/doc/model-work-health-and-safety-act
    clause: s 38(7)
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: safety_incident
  clause: s 38(7)
  window:
    value: 60
    unit: months
  caveat: 5 years converted to 60 months. The safety_incident register holds each incident and its worst
    outcome, but not whether or when the regulator was told, so this is recorded not_collected.
