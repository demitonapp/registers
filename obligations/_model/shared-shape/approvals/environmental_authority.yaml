# SM031 M3: the duty shape every environmental authority or environment
# protection licence carries, whichever state issues it. The shape is drawn
# across the state instruments listed in the caveats rather than read from one
# of them, so no row states a clause and no row carries a grade - the concrete
# that first reads its own state's text supplies both.
id: model_environmental_authority
source: approvals
instrument_type: permit
title: Environmental authority or environment protection licence (shared shape)
publisher: Queensland Department of the Environment, Tourism, Science and Innovation
jurisdictions: []
abstract: true
model_type: shared_shape
citation:
  url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1994-062
  version: Shape drawn across the Environmental Protection Act 1994 (Qld) and its counterparts - the Protection of the Environment Operations Act 1997 (NSW), the Environment Protection Act 2017 (Vic) and the Environmental Protection Act 1986 (WA). The URL is the representative instrument (Qld).
  access_date: '2026-09-30'
obligations:
- key: approvals.environmental_authority_conditions
  duty: Carry out the work so that every condition of the environmental authority or environment protection licence is met
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  severity: 2
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1994-062
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: environmental_authority
  caveat: Each state enacts its own instrument - the duty to comply with the authority's conditions is the one part that does not vary, while the conditions themselves (limits, monitoring points, hours) are set authority by authority and state by state. The concrete that extends this base supplies its own citation, clause and conditions summary. Nothing in the library yet holds an authority's conditions, so the register here is a placeholder name.
- key: approvals.environmental_authority_incident_notice
  duty: Notify the regulator that an incident has caused or threatens material environmental harm within the window the authority or the Act states
  consequence: offence
  protection_type: watch
  disease: non_compliance
  approval_class: safety_environment
  severity: 3
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1994-062
    access_date: '2026-09-30'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  window:
    value: 24
    unit: hours
  caveat: The window is the shape's own default, not read from any one state's text - Queensland's Environmental Protection Act 1994 gives 24 hours for serious or material environmental harm and 20 business days for a merely notifiable activity, and other states differ (Victoria's Environment Protection Act 2017 says 'as soon as practicable' with no number). The concrete that extends this base supplies the true window and clause for its own state, and the window may be overridden again by the contract.
- key: approvals.environmental_authority_records
  duty: Keep the authority's monitoring results and incident records for the period the authority or the Act requires
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  severity: 3
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1994-062
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: environmental_authority
  caveat: Retention periods are set per authority and per state; no single period is stated here. The maintenance_record and inspection_test_result registers hold adjacent facts (plant servicing, test results) but not the authority's own monitoring record, so this is recorded not_collected rather than pointed at a register that would answer a different question.
