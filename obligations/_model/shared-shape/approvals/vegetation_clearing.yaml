# SM031 M3: the native vegetation clearing shape, drawn across the state
# vegetation management and planning instruments. Some states route clearing
# through a development approval, some through a notification or an accepted-
# development code, which is why the first duty names both paths.
id: model_vegetation_clearing
source: approvals
instrument_type: permit
title: Native vegetation clearing approval or notification (shared shape)
publisher: Queensland Department of Natural Resources and Water
jurisdictions: []
abstract: true
model_type: shared_shape
citation:
  url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1999-090
  version: Shape drawn across the Vegetation Management Act 1999 (Qld) and the Planning Act 2016 (Qld) clearing rules, together with the equivalent native vegetation and land clearing regimes in the other states. The URL is the representative instrument (Qld).
  access_date: '2026-09-30'
obligations:
- key: approvals.vegetation_clearing_approval
  duty: Do not clear native vegetation on the site without the development approval, or the notification, that the state's vegetation rules require
  consequence: barred
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  severity: 2
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1999-090
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: vegetation_clearing
  caveat: Each state enacts its own instrument and its own exemptions - Queensland assesses clearing against the vegetation management framework, New South Wales against the Biodiversity Conservation Act 2016 and the Local Land Services Act 2013 - and some clearing is accepted development with no approval at all. The concrete that extends this base supplies its own citation, clause and the path its state takes.
- key: approvals.vegetation_clearing_conditions
  duty: Comply with the conditions attached to the clearing approval or notification
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  severity: 2
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1999-090
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: vegetation_clearing
  caveat: Conditions are imposed approval by approval - retained trees, staged clearing, offsets, fauna spotter-catcher attendance - and differ per state. The concrete supplies its own citation and clause.
- key: approvals.vegetation_clearing_records
  duty: Keep the clearing approval, the notification and the clearing records for the period the state's instrument requires
  consequence: offence
  protection_type: check
  disease: non_compliance
  approval_class: safety_environment
  severity: 3
  citation:
    url: https://www.legislation.qld.gov.au/view/whole/html/inforce/current/act-1999-090
    access_date: '2026-09-30'
  evidence:
    kind: not_collected
    register: vegetation_clearing
  caveat: Retention periods and the records that must be kept vary by state and by approval. The clearing records could sit in a document store, but no shelf_type in the library describes them today, so this is recorded not_collected rather than invented as a register.
