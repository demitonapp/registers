# SM031 M3: the insurance notification shape. The duty that matters on a job is
# not buying the policy, it is telling the insurer in time when something
# happens - a late notification lets the insurer decline, which turns a covered
# loss into the contractor's own cost. That is why the disease is forfeited
# entitlements, not non-compliance. Drawn across the policy wordings and the
# insurance clauses of the standard conditions, so no clause and no grade are
# stated on the rows whose window differs; the window itself is a default.
id: model_insurance_notification
source: counterparties
instrument_type: insurance_policy
title: Insurance policy notification and record-keeping (shared shape)
publisher: Queensland Department of Transport and Main Roads
jurisdictions: []
abstract: true
model_type: shared_shape
citation:
  url: https://www.tmr.qld.gov.au/_/media/busind/techstdpubs/contract/road-maintenance-performance-contract-manual/generalconditions.pdf?rev=dc8826aa9b9044fa9aea4c3444221e06&sc_lang=en&extension=pdf&size=613945&hash=208A60A75B332E3CE164ADA231E5A70C
  version: Shape drawn across the liability policy wordings a civil contractor holds and the insurances clauses of the standard conditions of contract that require them - clause 8 of the TMR Road Maintenance Performance Contract general conditions (C6083, July 2026) is the representative text at the URL. No single policy wording was read end to end.
  access_date: '2026-09-30'
obligations:
- key: counterparties.insurance_notification_notice
  duty: Notify the insurer of an incident, claim or circumstance that may give rise to a claim within the window the policy or the contract's insurances clause states
  consequence: breach
  protection_type: watch
  disease: forfeited_entitlements
  approval_class: general
  duty_shape: counterparties.insurance_notification_notice
  severity: 3
  citation:
    url: https://www.tmr.qld.gov.au/_/media/busind/techstdpubs/contract/road-maintenance-performance-contract-manual/generalconditions.pdf?rev=dc8826aa9b9044fa9aea4c3444221e06&sc_lang=en&extension=pdf&size=613945&hash=208A60A75B332E3CE164ADA231E5A70C
    clause: cl 8.1
    access_date: '2026-09-30'
  evidence:
    kind: record_in_demiton
    register: contract_notice
  window:
    value: 7
    unit: days
  caveat: The 7-day window and cl 8.1 are read from the representative instrument (TMR RMPC general conditions C6083, July 2026, clause 8.1(b) and (c), which require the contractor to give the principal a copy of any notice of claim and to inform the principal of any event that may give rise to a claim, both within 7 days). A policy wording sets its own notification window and many are shorter; the concrete that extends this base supplies the citation and window its own policy or contract states. The contract_notice register holds a notice the contractor gave the principal, not the notice to the insurer, so the insured-notified fact is not evidenced by it.
- key: counterparties.insurance_notification_records
  duty: Keep the policy, its schedule and every notification made under it for the period the contract requires
  consequence: breach
  protection_type: check
  disease: forfeited_entitlements
  approval_class: general
  duty_shape: counterparties.insurance_notification_records
  severity: 3
  citation:
    url: https://www.tmr.qld.gov.au/_/media/busind/techstdpubs/contract/road-maintenance-performance-contract-manual/generalconditions.pdf?rev=dc8826aa9b9044fa9aea4c3444221e06&sc_lang=en&extension=pdf&size=613945&hash=208A60A75B332E3CE164ADA231E5A70C
    clause: cl 8.1
    access_date: '2026-09-30'
  evidence:
    kind: register
    register: insurance_certificate
    system_type: document_store
  caveat: A contract that requires evidence of insurance on request, and a policy that requires a notification to be provable after the event, both depend on these records existing. The retention period is set by the contract of the day, so none is stated here. The concrete that extends this base supplies its own citation, clause and period.
